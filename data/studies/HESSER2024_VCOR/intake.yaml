# Intake config for HESSER2024_VCOR.
#
# Regenerate the derived result files:      aree intake-supplementary data/studies/HESSER2024_VCOR/intake.yaml
# Verify them without touching the tree:    aree intake-supplementary data/studies/HESSER2024_VCOR/intake.yaml --check
#
# This file is the documented, re-runnable bridge between the published
# supplementary artifact and the TSVs that `aree harmonize` consumes. See
# docs/adding_a_study.md and docs/first_real_study.md.

study_id: HESSER2024_VCOR
assay: rnaseq

source:
  description: >-
    Supplementary Table S4 (annotated differentially expressed genes per
    treatment vs Larvae Only control)
  url: https://www.frontiersin.org/articles/10.3389/fimmu.2024.1380089/full#supplementary-material
  license: CC BY 4.0
  citation: >-
    Hesser J, Mueller RS, Langdon C, Schubiger CB (2024). Immunomodulatory
    effects of a probiotic combination treatment to improve the survival of
    Pacific oyster (Crassostrea gigas) larvae against infection by Vibrio
    coralliilyticus. Front Immunol 15:1380089.
    https://doi.org/10.3389/fimmu.2024.1380089
  local_copy: data/studies/HESSER2024_VCOR/_source/fimmu-15-1380089-Table_S4.xls
  # Checked before every conversion. A mismatch stops the intake rather than
  # silently re-deriving results from a different version of the artifact.
  sha256: fdce7393109a3969f7ad21667f5f8284e23633c69cc078dbfc277fb691a8a9f9

output_dir: data/studies/HESSER2024_VCOR
provenance_file: data/studies/HESSER2024_VCOR/intake_provenance.json

# Only AREE columns the source actually reports are mapped. Unmapped columns
# (here lfcSE and pvalue) are emitted empty — never imputed.
conversions:
  - output_file: HESSER2024_VCOR_vcor_vs_larvae_only_dge.tsv
    source_sheet: Vcor v LOnly
    column_map:
      gene_id: Gene ID
      log2FoldChange: log2FoldChange
      padj: padj

  - output_file: HESSER2024_VCOR_probiotic_plus_vcor_vs_larvae_only_dge.tsv
    source_sheet: 18hrPB+Vc v LOnly
    column_map:
      gene_id: Gene ID
      log2FoldChange: log2FoldChange
      padj: padj

# Quoted so that a note containing ": " is read as a string, not a YAML mapping.
transformation_notes:
  - "Identifiers preserved verbatim, including the 'gene-LOCxxxxx|LOCxxxxx' decoration used by the source; harmonize.identifiers resolves the embedded stable id."
  - "The source reports only log2FoldChange and a BH-adjusted p-value, so lfcSE and the raw p-value are empty. Meta-analysis weighting that requires a standard error cannot use this study."
  - "The source table lists only ANNOTATED DEGs passing the authors' |log2FC| >= 2 and padj < 0.05 thresholds, not the full DESeq2 result. This is a truncated, significance-filtered table."
  - "Sheet '18hrPB+Vc v LOnly' of the published file contains a repeated header row part-way down (source row 71); it is dropped by the numeric coercion step and counted as rows_dropped_non_numeric."
  - "Sheet '18hrPB v LOnly' (probiotic only, no pathogen) was not converted: it has no stressor, and the AREE stressor ontology has no term for a beneficial-microbe exposure."
