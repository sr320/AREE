# Reference genome assemblies AREE knows about.
#
# Every `genome_assembly` value in a study registration must appear here, either
# as an `assembly_id` or as one of its `aliases`. `aree validate-study` enforces
# that, so a typo or an undocumented assembly is caught at registration rather
# than surfacing later as evidence that cannot be compared.
#
# `metabolite_gene_links` (optional) is the metabolite -> enzyme gene link table
# that metabolomics evidence on this species is linked through for the
# `metabolite_linked_convergence` tier. It is built locally by
# `aree build-metabolite-links` and NOT committed (KEGG terms); until it is built,
# real candidates report `link_table_status: not_built`. See
# docs/metabolite_gene_links.md.
#
# `identifier_crosswalk` is the crosswalk that evidence from studies on this
# assembly is standardized against (repo-relative path, or null if none has been
# built yet). Harmonizing a real study reads it from here, so a mussel study and
# an oyster study in the same run each resolve against their own species'
# crosswalk. The crosswalk follows the ASSEMBLY, not the study's species: a study
# that mapped reads to a related species' genome (quality flag
# `reference_species_mismatch`) reports that genome's gene identifiers. A real
# study on an assembly with a null crosswalk can be registered but not
# harmonized. See docs/identifier_mapping.md.
#
# Accessions were verified against the NCBI Datasets API on the date recorded in
# each entry's `verified`. When adding an assembly, look the accession up
# yourself and record the date — do not copy one from another entry. See
# docs/handling_genome_versions.md.
version: "0.3.0"
verified_against: "NCBI Datasets API (api.ncbi.nlm.nih.gov/datasets/v2alpha); per-entry date in `verified`"

assemblies:
  - assembly_id: "xbMagGiga1.1"
    species: "Magallana gigas"
    ncbi_taxid: 29159
    ncbi_assembly_accession: "GCF_963853765.1"
    genbank_accession: "GCA_963853765.1"
    assembly_level: "Chromosome"
    submitter: "Wellcome Sanger Institute"
    is_ncbi_reference: true
    annotation_release: "GCF_963853765.1-RS_2024_06"
    annotation_release_date: "2024-06-20"
    identifier_crosswalk: "data/reference/crosswalk/mgigas_gene_id_crosswalk.tsv"
    metabolite_gene_links: "data/mappings/metabolite_gene_links_mgigas.tsv"
    verified: "2026-08-28"
    notes: >-
      Current NCBI reference genome for the Pacific oyster. AREE's identifier
      crosswalk (data/reference/crosswalk/) is built from the NCBI Gene records
      of this annotation release, so this is the annotation that every
      `feature_id_standardized` ultimately refers to, regardless of which
      assembly the source study itself used.

  - assembly_id: "cgigas_uk_roslin_v1"
    species: "Magallana gigas"
    ncbi_taxid: 29159
    ncbi_assembly_accession: "GCF_902806645.1"
    genbank_accession: "GCA_902806645.1"
    assembly_level: "Chromosome"
    submitter: "The Roslin Institute"
    is_ncbi_reference: false
    annotation_release: null
    identifier_crosswalk: "data/reference/crosswalk/mgigas_gene_id_crosswalk.tsv"
    metabolite_gene_links: "data/mappings/metabolite_gene_links_mgigas.tsv"
    verified: "2026-08-28"
    notes: >-
      The assembly most C. gigas studies published before ~2024 were mapped
      against, including HESSER2024_VCOR. It is no longer the NCBI reference.
      Evidence from studies on this assembly is standardized through NCBI Gene
      IDs, which persist across assemblies; the crossing is recorded per
      evidence record in `identifier_annotation_release`. The demo studies also
      carry this label, but their coordinates and effect sizes are fabricated —
      the assembly record here is real, the demo data referencing it is not.

  # ------------------------------------------------------------------------- #
  # Mussels and clams (added 2026-10-11; docs/mussel_clam_integration_plan.md).
  # All are NCBI RefSeq-annotated. Their crosswalks were built 2026-10-11 with
  # `aree build-crosswalk --taxid <ncbi_taxid> --slug <slug>` (WP2).
  # ------------------------------------------------------------------------- #

  - assembly_id: "xbMytGall1.hap1.1"
    species: "Mytilus galloprovincialis"
    ncbi_taxid: 29158
    ncbi_assembly_accession: "GCF_965363235.1"
    genbank_accession: "GCA_965363235.1"
    assembly_level: "Chromosome"
    submitter: "Wellcome Sanger Institute"
    is_ncbi_reference: true
    annotation_release: "GCF_965363235.1-RS_2025_08"
    annotation_release_date: "2025-08-13"
    identifier_crosswalk: "data/reference/crosswalk/mgall_gene_id_crosswalk.tsv"
    verified: "2026-10-11"
    notes: >-
      Haplotype 1 of a Darwin Tree of Life assembly; haplotype 2
      (GCA_965363225.1) is scaffold-level and not annotated. Several older
      M. galloprovincialis assemblies exist (MGAL_10, MytGallo_primary_0.1,
      MgalMED) with no NCBI RefSeq annotation; studies mapped to them can only
      be standardized through this annotation by sequence, not by identifier.

  - assembly_id: "xbMytEdul2.2"
