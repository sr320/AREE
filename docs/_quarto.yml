project:
  type: website
  output-dir: _site
  # Parquet tables for explore.qmd, fetched by DuckDB-WASM rather than linked,
  # so Quarto must be told to copy them (written by `aree export-site-data`).
  resources:
    - explore/data/

website:
  title: "AREE"
  site-url: "https://sr320.github.io/AREE/"
  repo-url: "https://github.com/sr320/AREE"
  description: "Aquaculture Resilience Evidence Engine — reproducible resilience biomarker evidence for Crassostrea gigas and other aquaculture species."
  navbar:
    left:
      - text: "Progress"
        href: index.qmd
      - text: "Explore"
        href: explore.qmd
      - text: "About"
        href: about.qmd
      - text: "Docs"
        href: installation.md
    right:
      - icon: github
        href: https://github.com/sr320/AREE
  sidebar:
    style: docked
    contents:
      - section: "Getting started"
        contents:
          - text: "Progress and findings"
            href: index.qmd
          - text: "About AREE"
            href: about.qmd
          - text: "Explore the evidence"
            href: explore.qmd
          - text: "Querying AREE (explorer + MCP)"
            href: querying_aree.md
          - text: "Installation"
            href: installation.md
          - text: "Why this resource matters"
            href: why_it_matters.md
      - section: "Using AREE"
        contents:
          - text: "Worked example: a real study"
            href: first_real_study.md
          - text: "Adding a study"
            href: adding_a_study.md
          - text: "Candidate studies to curate"
            href: candidate_studies.md
          - text: "Candidate mussel and clam studies"
            href: candidate_studies_mussels_clams.md
          - text: "Running studies on several machines"
            href: parallel_study_runs.md
          - text: "First raw reanalysis"
            href: first_raw_reanalysis.md
          - text: "Reference bundles"
            href: reference_bundles.md
          - text: "Defining a phenotype"
            href: defining_a_phenotype.md
          - text: "Resilience vs. exposure-only"
            href: resilience_vs_exposure.md
          - text: "Raw vs. processed harmonization"
            href: raw_vs_processed.md
          - text: "Identifier mapping"
            href: identifier_mapping.md
          - text: "Metabolite–gene links"
            href: metabolite_gene_links.md
      - section: "Interpreting results"
