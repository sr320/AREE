# Klone autopilot settings (aree autopilot tick). See docs/klone_autopilot_plan.md.
# $USER and ~ are expanded. Any key left out takes the default in src/autopilot/config.py.

# Ledger (state.json) and the local copy of the status page. Keep it off
# scrubbed so it outlives the 21-day purge.
state_dir: ~/.local/share/aree-autopilot

# Head jobs submitted as `sbatch --job-name=aree-<STUDY_ID>` are found without
# `aree autopilot track`.
head_job_prefix: aree-
task_job_prefix: nf-

# The run's --outdir; pipeline_info/execution_trace.txt is read from under it.
results_template: /gscratch/scrubbed/$USER/aree/results/{study_id}

scrubbed_root: /gscratch/scrubbed
min_scrubbed_free_tb: 8
stall_hours: 6
scratch_alert_days: 14

github_repo: sr320/AREE
status_issue_title: Klone autopilot status
status_label: autopilot-status
alert_label: autopilot-alert
# Fine-grained token for sr320/AREE only, Issues: read and write. chmod 600.
token_file: ~/.config/aree/github_token
