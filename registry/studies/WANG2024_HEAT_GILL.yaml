# analysis_status is in_progress because the workflow ran; it is halted at QC,
# not awaiting harmonization. See the header.
qc_status: "failed"
analysis_status: "in_progress"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. Every library has a unique library_name,
# <HC|NC>.<species><rep>_<RNA-Seq|ATAC-Seq>_fastq. HC = heat, NC = no heat
# (experiment_title: "adult gill under heat stress" / "without heat stress").
# The sample sheet parses it, so condition = <assay>_<species>_<heat>, giving
# 8 groups x n=3. Each oyster has one BioSample, shared by its RNA-seq and
# ATAC-seq library; fetch-samplesheet's "24 runs share 12 BioSamples" warning
# is that pairing, not pseudo-replication. Within the C. gigas RNA-seq arm,
# all 6 libraries are distinct BioSamples. BioSample replicate attributes read
# "HGi biological replicate 1" etc.
#
# ONE COMPARISON, PRESPECIFIED BEFORE ANY RESULT WAS COMPUTED (2026-10-11):
# C. gigas RNA-seq, heat (RNA_Seq_gigas_HC) vs no heat (RNA_Seq_gigas_NC).
# It was meta_analysis_primary until the study failed QC (flag removed
# 2026-10-13). It matches LI2022_HEAT_PLOIDY's
# diploid_acute_heat_12h_vs_baseline in species, tissue, life stage and
# exposure length. Unlike LI2022's time-0 baseline, the no-heat arm is a
# concurrent control (to be confirmed from the methods).
#
# ON PHENOTYPE CLASSIFICATION. Heat vs no heat within one species is an
# exposure. The paper's contrast in thermal tolerance is between species (C.
# angulata more tolerant than C. gigas), and no oyster here was scored for
# its own tolerance. Classified exposure_only on thermal_tolerance, like
# LI2022_HEAT_PLOIDY, so the validator warning is expected. A C. angulata vs
# C. gigas contrast would be species-level, needs cross-species identifier
# mapping, and is not registered.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "gigas_heat_12h_vs_control"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "12 h of heat treatment; 'adult gill under heat stress' vs 'adult gill without heat stress' (BioProject description and experiment titles). Temperature not stated in the deposit or the abstract."
    stressor_standardized: "temperature"
    exposure_intensity: null
    exposure_duration: "12 h"
    exposure_timing: "gill sampled at the end of 12 h of heat treatment"
    control_condition: "C. gigas adults without heat stress (sample-sheet level RNA_Seq_gigas_NC; NC.gigas1-3)"
    treatment_condition: "C. gigas adults after 12 h of heat stress (sample-sheet level RNA_Seq_gigas_HC; HC.gigas1-3)"
    phenotype: "thermal_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "exposure_only"
    contrast_type: "exposure_response"
    sample_size: 6
    biological_replicates: 3
    results_file: null

quality_flags:
  - raw_data_available
  - low_replication   # nominal n=3 per arm, effective n=1: each arm's libraries share one RNA source (genotype check)
  - single_timepoint

limitations: >
  (1) n = 3 oysters per arm, so DESeq2 dispersion rests on 2 residual degrees
  of freedom per arm. (2) The heat temperature is unknown. The deposit and
  abstract give only "12 h of heat treatment". The open-access follow-up's
  42 C runs are a separate mortality assay, not this exposure. Until the
  methods are read, effect sizes are not dose-comparable to other thermal
  studies, including LI2022_HEAT_PLOIDY. (3) The publication link is
  inferred from title, design, species pair and group. (4) Exposure only:
  the paper's tolerance difference is between species, and no oyster here
  was scored for its own tolerance. (5) Single timepoint (12 h), single
  site (Qingdao), single collection (2022-12-10). Oyster age, size, origin
  and acclimation are not stated. (6) Gill only. (7) The paired ATAC-seq
  libraries come from the same oysters. Once registered, they are convergent
  evidence across omics layers, not independent replication. (8) RNA-seq and
  ATAC-seq were sequenced on different platforms (NovaSeq 6000 vs HiSeq X
  Ten). That does not affect this comparison.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-11"
  curation_notes: >
    Claimed with `aree start-study` (draft PR #34). Registered from live ENA
    metadata for PRJNA970954 with `aree fetch-samplesheet --bioproject
    PRJNA970954 --study WANG2024_HEAT_GILL --label-field library_name
    --label-pattern
    '^(?P<heat>HC|NC)\.(?P<species>gigas|angulata)(?P<replicate>[1-3])_(?P<assay>RNA-Seq|ATAC-Seq)_fastq$'
    --condition-attribute assay --condition-attribute species
    --condition-attribute heat --attribute replicate --attribute tissue
    --attribute organism --attribute collection_date --attribute geo_loc_name
    --attribute "replicate'_attribute"`. library_name was used because
    sample_alias (e.g. HC.gigas1) is shared by an oyster's RNA-seq and
    ATAC-seq runs, and experiment_title has no replicate number. The design
    was first read from NCBI SRA runinfo while the ENA portal API was timing
    out, then regenerated from ENA. REPLICATION CHECK: 6 distinct
    BioSamples in the C. gigas RNA-seq arm (SAMN35017932-37), each paired
    with one ATAC-seq run. Run scripts/check_replicate_dispersion.py after
    quantification. PUBLICATION: Europe PMC finds no paper citing the
    accession. A search on species pair, ATAC and heat returned Wang C et al.
    2024, Aquaculture (AGRICOLA record). Crossref gives DOI
    10.1016/j.aquaculture.2023.740177 (vol. 579, art. 740177, January 2024)
    and the full author list. The paper was not read. Per PubMed Central, the
    open-access Wang et al. 2024 Cell Commun Signal (PMC11552224,
    doi:10.1186/s12964-024-01923-0) reuses this group's 12 h heat RNA-seq and
    ATAC-seq data for both species. It deposits its own new data under
    PRJNA1059049 and PRJNA1058704, which are not part of this study. A 2025
    Aquaculture paper from the same group (doi:10.1016/j.aquaculture.2025.742855,
    MAPK/ERK and divergent thermal tolerance) may also reuse these data; not
    checked. TO DO BEFORE HARMONIZING: read the 2024 Aquaculture methods for
    heat temperature, control temperature, acclimation and oyster
    origin/age, and confirm PRJNA970954 in its data availability statement.
    REANALYSIS AND QC DECISION (Pori, 2026-10-12/13): the 6 C. gigas
    RNA-seq libraries (14.5 GB) were downloaded from ENA. All 12 FASTQ
    files matched ENA's MD5s. Resumed transfers repeatedly produced
    full-size files with wrong MD5s; those were discarded. SRR24489463_2
    was finally fetched fresh over HTTPS without resume. Run with native
    tools from environment.yml (versions in the workflow manifest: Salmon
    2.8.0, DESeq2 1.50.2, tximport 1.38.2, FastQC 0.12.1, MultiQC 1.35)
    and the saved Salmon index: 23 tasks, status OK. Salmon mapped
    77.4-79.9% of read pairs (20.9-24.4 M pairs), unstranded.
    scripts/check_replicate_dispersion.py FAILED both arms (control 0.0009,
    heat 0.0030). GENOTYPE CHECK (data/studies/WANG2024_HEAT_GILL/genotype_check/,
    scripts committed there): first 3 M read pairs per library mapped with
    minimap2 2.31 to the most expressed transcript of each of the 400 most
    expressed genes; joint calling with bcftools 1.24; 9,355 biallelic SNPs
    with depth >= 30 in all six libraries (median 161-180) and alt AF >
    0.15 in at least one. Observed pairwise median |dAF| was compared with
    a binomial simulation of two libraries from one RNA source at the
    observed depths. Within-arm ratios were 1.78-2.13x, between-arm
    5.88-6.49x. Conclusion: one RNA source per arm (most likely a pool),
    replicated at library level only. The sample sheet's "biological
    replicate" labels and the six distinct BioSamples do not reflect
    independent animals. This is the second study, after
    IOCAS2022_OA_ENERGY, where distinct BioSamples labelled biological
    replicates turned out not to be. Two descriptive numbers from the
    invalid run, recorded only to show the symptom: 9,732 of 26,874 genes
    at padj < 0.05; vs LI2022_HEAT_PLOIDY diploid acute 12 h, LFC r = 0.11
    and 990 of 1,357 jointly significant genes in the same direction. The
    standardized table is not committed. The ATAC-seq libraries come from
    the same "oysters" and should get the same genotype check before any
    registration.
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA970954"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA970954"
    - "https://doi.org/10.1016/j.aquaculture.2023.740177"
    - "https://doi.org/10.1186/s12964-024-01923-0"
