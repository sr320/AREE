# SECOND REAL THERMAL RNA-SEQ STUDY, and the closest like-for-like partner of
# LI2022_HEAT_PLOIDY's diploid acute comparison: adult C. gigas gill, 12 h of
# heat, n=3 per arm.
#
# Registered from deposited metadata. The deposit is a two-species,
# two-assay design: C. gigas and C. angulata gill, heat vs no heat, each oyster
# sequenced by RNA-seq and ATAC-seq (24 runs, 12 BioSamples). Only the
# C. gigas RNA-seq arm is registered as a comparison. The other 18 runs stay
# in the sample sheet so that the ATAC arm (once AREE has an
# accessible-region feature type) and a species contrast can be added later
# without re-curating the deposit.
#
# The publication is INFERRED, not confirmed. Wang C et al. 2024 (Aquaculture
# 579:740177) is titled for exactly this design: chromatin dynamics in two
# congeneric oysters with differential thermal tolerance. No full text citing
# PRJNA970954 was found, and the paper's full text was not read. The same
# group's open-access follow-up (Wang et al. 2024, Cell Commun Signal,
# doi:10.1186/s12964-024-01923-0) reuses "transcriptomic, ATAC-Seq ... data
# for [both species] under 12 h of heat stress ... from our previous study".
# That confirms the 12 h exposure but not its temperature.
#
# Registered 2026-10-11.
#
# QC FAILED, 2026-10-13: PSEUDO-REPLICATION. Each arm's three libraries come
# from one shared RNA source, not three oysters. The comparison was run at
# full depth (2026-10-13). Median replicate dispersion was 0.0009 (control)
# and 0.0030 (heat), below the 0.005 threshold and in IOCAS2022_OA_ENERGY's
# range, and 9,732 of 26,874 genes (36%) were "DE". A genotype check confirmed
# it (data/studies/WANG2024_HEAT_GILL/genotype_check/): at 9,355 SNPs in the
# 400 most expressed genes, libraries of the same arm differ in allele
# fraction only 1.8-2.1x as much as two libraries drawn from one RNA would
# (median |dAF| 0.03-0.04; genotype discordance 9-11%). Libraries of
# different arms differ 5.9-6.5x as much (|dAF| 0.14-0.15; discordance
# 37-41%). So the two arms are genetically different sources, but within an
# arm the "biological replicates" are not distinct animals. Every library
# also has an excess of low intermediate allele fractions (35% of sites at
# 0.1-0.3, 10% above 0.9), which points to each source being a pool of
# several oysters, not one animal. RNA allelic imbalance can also produce
# intermediate fractions, so the pooling reading is likely, not proven.
# Effective n is 1 vs 1: p-values are invalid, and lfcSE measures library
# noise, not animal-to-animal variation. results_file stays null and no
# comparison is meta_analysis_primary, so nothing reaches the evidence table
# or a pool. The run manifest, report, dispersion table and genotype check
# are archived in data/studies/WANG2024_HEAT_GILL/ as provenance for the
# decision.

