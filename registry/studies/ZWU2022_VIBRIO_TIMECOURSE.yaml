# Vibrio exposure time course in juvenile M. gigas digestive gland. Chosen
# 2026-10-14 after the RNA-seq candidates in candidate_studies.md and the
# AREE-co list were exhausted or rejected; it passed a pre-download genotype
# screen. Not in candidate_studies.md.
#
# NO PUBLICATION FOUND (Europe PMC: 0 hits for PRJNA852380; deposited by
# Zhejiang Wanli University, BioProject description only "vibrio stress of
# the Pacific oyster"). So the Vibrio species, dose, route, temperature, tank
# layout and whether libraries pool animals are unknown, and left null.
# The study_id names the institute and BioSample collection year.
#
# Design from the deposit: 9-month-old intertidal oysters (Qingdao),
# digestive gland; isolate 'normal' (control) and 'vibrio stress <t>h' at
# 1, 3, 6, 12 and 24 h; 'biological replicate 1-3' each; 18 distinct
# BioSamples. The controls are one untreated group, not time-matched.
#
# REPLICATION SCREENED BEFORE DOWNLOAD (replicate_genotype_check.txt): on
# ~250 MB of reads from three controls and two 24 h libraries, libraries
# within a group differ in expressed-SNP allele frequency by 0.196 against
# 0.054 for one RNA sample, so they are different animals (each library
# appears to pool several, by the allele-frequency histograms).

study_id: ZWU2022_VIBRIO_TIMECOURSE
simulated: false

accessions:
  doi: null
  bioproject: "PRJNA852380"
  geo: null
  sra: "SRR19849539-SRR19849556"
  ena: "PRJNA852380"
  proteomexchange: null
  other: "BioSamples SAMN29336127-SAMN29336144; no publication identified as of 2026-10-14"

citation: "Zhejiang Wanli University (2022). Magallana gigas Raw sequence reads: vibrio stress of the Pacific oyster [RNA-seq dataset]. NCBI BioProject PRJNA852380. No associated publication identified as of 2026-10-14."

species: "Magallana gigas"
strain_or_population: "9-month-old intertidal oysters, Qingdao, China (BioSample age, isolation_source, geo_loc_name)."

genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina HiSeq X Ten, paired-end 150 bp (18 libraries, 20.6-27.6 M read pairs; 59 GB FASTQ)"

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 18 runs are public in ENA/SRA under PRJNA852380. Groups are in the sample aliases (control1-3, V<t>h_1-3) and BioSample isolate. Sequence data are not committed."

qc_status: "in_progress"
analysis_status: "in_progress"

# Five comparisons, each time point vs the untreated controls, prespecified
# 2026-10-14 before any result. meta_analysis_primary = 24 h: the latest
# time point, closest to the 8-48 h sampling of the other pathogen-challenge
# studies. All five share the controls. disease_susceptibility / disease is
# the axis, but no outcome (survival, load) was deposited, so the evidence
# is flagged ambiguous_phenotype_definition.
comparisons:
  - comparison_id: "vibrio_24h_vs_control"
    tissue: "digestive_gland"
    life_stage: "juvenile"
    stressor_original: "BioSample isolate 'vibrio stress 24h' vs 'normal'; Vibrio species, dose and route not stated in the deposit"
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: null
    exposure_duration: "24 h"
    exposure_timing: "sampled 24 h after Vibrio exposure"
    control_condition: "untreated controls ('normal'), 3 libraries, not time-matched"
    treatment_condition: "24 h after Vibrio exposure, 3 libraries"
    phenotype: "disease_susceptibility"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "disease"
    sample_size: 6
    biological_replicates: 3
    meta_analysis_primary: true
