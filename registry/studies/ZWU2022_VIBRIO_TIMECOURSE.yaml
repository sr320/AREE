quality_flags:
  - raw_data_available
  - ambiguous_phenotype_definition   # no outcome deposited; pathogen identity and dose unknown

limitations: >
  (1) No publication: the Vibrio species, dose, route and temperature, the
  tank layout and the pooling are unknown. (2) The controls are a single
  untreated group, not time-matched, so time in the aquarium after handling
  is confounded with time since exposure. (3) No survival, mortality or
  pathogen-load data were deposited. (4) All five comparisons share the same
  three controls; only the 24 h comparison may pool.

provenance:
  registered_by: "sr320"
  date_registered: "2026-10-14"
  curation_notes: >
    Claimed with `aree start-study --accession PRJNA852380 --study-id
    ZWU2022_VIBRIO_TIMECOURSE` (draft PR sr320/AREE#53). Sample sheet from live
    ENA metadata with `aree fetch-samplesheet --label-field sample_alias` (the
    pattern is in config/ZWU2022_VIBRIO_TIMECOURSE.config): 18 runs, 3 per group,
    matching BioSample isolate. Replicate independence screened before the full
    download with the expressed-SNP check (0.196 within vs 0.054 same-RNA noise).
    Comparisons and meta_analysis_primary fixed before any result.
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA852380"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA852380"
