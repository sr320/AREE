  date_registered: "2026-11-27"
  curation_notes: >
    Claimed on Hete with `aree start-study --accession PRJNA1153018 --study-id
    LSU2024_HYPOX_POP` (draft PR sr320/AREE#133). Sample sheet and FASTQ
    manifest from live ENA metadata with `aree fetch-samplesheet`, joining
    design.tsv (parsed from each BioSample's isolate attribute) on isolate:
    48 runs, 48 samples, 12 per population x treatment, 4 per day. Library
    type read from a 20,000-read sample of SRR30420622. Comparisons, the
    primary flags and the day covariate were fixed before any FASTQ was
    downloaded.
    DOWNLOAD (Hete, 2026-11-27/28): all 48 FASTQ (13.8 GB) from ENA with
    `aree fetch-fastq`, each accepted only on a matching ENA MD5. ENA
    dropped connections repeatedly, so it took five passes (4, 2, then 1
    job); one full-size file with a wrong MD5 was deleted and re-fetched.
    REANALYSIS (Hete, 2026-11-28): -profile local,workstation, work
    directory on /Volumes/Monarch, --single_end --tag_seq --covariates day.
    la_hypoxia_vs_control ran all 150 tasks (02:46-03:56, including the
    Salmon index); the other three reused them with -resume (4 new tasks
    each). No failures and no manifest warnings. Salmon 2.3.4, fastp 1.3.6,
    FastQC 0.12.1, DESeq2 1.42.1 / tximport 1.30.0 on R 4.3.2, MultiQC 1.9.
    Replicate dispersion (scripts/check_replicate_dispersion.py,
    replicate_dispersion_qc.tsv) passes: median 0.029 (LA control), 0.052
    (LA hypoxia), 0.113 (TX control), 0.051 (TX hypoxia) on 405-451 genes.
    HARMONIZED against cvirg_gene_id_crosswalk.tsv (built on the same
    GCF_053477285.1 annotation): all 103,316 records resolve exact; 22,211-
    23,244 per comparison carry an orthogroup.
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA1153018"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA1153018"
