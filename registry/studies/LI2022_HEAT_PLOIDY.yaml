quality_flags:
  - raw_data_available
  - low_replication

limitations: >
  (1) n = 3 oysters per group. DESeq2 dispersion estimates rest on 2 residual
  degrees of freedom per group, so standard errors are imprecise. (2) The
  control is a time-0 baseline, not a time-matched control. Heat is therefore
  confounded with time in the experiment (handling, feeding, days in the
  system), most of all for the prolonged comparison. (3) The exposure is only
  partly described. The abstract gives 28 C for the prolonged stress, but not
  its duration, the acute-stress temperature, the acclimation temperature or
  the ramp. Until the methods are read, effect sizes here are not
  dose-comparable to other thermal studies. (4) The reading of the time codes
  (0 = baseline, 12 = 12 h acute, f = end of prolonged) is inferred from the
  abstract. (5) The link to Li et al. 2022 is inferred from submitter,
  institution, title, design and dates. No full text citing PRJNA762441 was
  found. (6) Exposure only: the sequenced oysters were not scored for their
  own tolerance. The paper's survival result (triploid below diploid under
  prolonged 28 C) applies to ploidy groups, not to these 18 animals. (7) The
  more informative contrast for breeding is the ploidy x heat interaction
  (does triploid gill respond differently?). It is not registered, because
  the workflow fits pairwise contrasts. A triploid-vs-diploid contrast at one
  time point would mix baseline ploidy differences into the heat response.
  (8) life_stage 'adult' is an assumption: age and size are not in the
  deposit or the abstract. (9) Triploid production method (chemical vs
  tetraploid cross) and parentage are not stated. Diploids and triploids may
  differ in genetic background as well as in ploidy. (10) Gill only, one
  cohort, one site (Qingdao). (11) Triploid gill tissue carries three
  genome copies. Library preparation normalizes total RNA, so per-copy dosage
  effects are not identifiable from these data.

