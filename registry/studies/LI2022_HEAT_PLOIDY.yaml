    treatment_condition: "Diploid oysters after 12 h acute heat stress (d_12; A12d_1-3)"
    phenotype: "thermal_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "exposure_only"
    sample_size: 6
