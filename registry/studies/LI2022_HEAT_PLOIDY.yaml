  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 18 runs are public in ENA/SRA under PRJNA762441 (first public 2021-11-05). No count matrix or differential-expression table is deposited, and the paper is closed access, so its supplementary tables were not checked. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. Each BioSample carries one sample_alias,
# A<time><ploidy>_<rep>: time 0, 12 or f; ploidy d (diploid) or t (triploid);
# replicate 1-3. That gives 6 groups x n=3, all gill, collected 2020-12. The
# BioSample isolation_source numbers oysters 1-9 within each ploidy
# ("diploid Crassostrea gigas1" ... "9"), three per time point. So each
# library is a different animal, as expected when gill is sampled lethally.
# This is a deposit-level check only; replicate dispersion is checked after
# quantification.
#
# READING OF THE TIME CODES. This is inferred from the abstract, not stated
# in the deposit: 0 = before heat (baseline), 12 = 12 h of acute heat stress,
# f = final sampling after prolonged heat stress at 28 C. The acute
# temperature, the length of the prolonged exposure, the acclimation
# temperature and the ramp are not in the abstract or the deposit. They are
# left null until the methods are read.
#
# FOUR COMPARISONS, PRESPECIFIED BEFORE ANY RESULT WAS COMPUTED (2026-10-10).
# Each one is heat vs the same ploidy's time-0 baseline, mirroring the
# paper's per-ploidy DEG counts (779 / 396 acute, 418 / 483 prolonged,
# diploid / triploid). The primary comparison for pooling is DIPLOID
# PROLONGED heat vs baseline. Reasons: diploids are the reference population
# that other thermal studies use; 28 C is the only exposure level the
# abstract states; and prolonged heat is where the paper measured survival.
# A ploidy x heat interaction would be the more interesting contrast, but
# the workflow fits pairwise contrasts only. It is noted under limitations,
# not registered.
#
# ON PHENOTYPE CLASSIFICATION. The paper reports that triploid survival was
# lower than diploid survival after prolonged heat at 28 C. That is a
# ploidy-level measurement, made on animals other than the sequenced ones.
# Every registered comparison is heat vs baseline within a single ploidy: an
# exposure, with no tolerant vs sensitive animals contrasted. They are
# classified exposure_only on the thermal_tolerance axis, as LUTIER2022 and
# IOCAS2022 are. This overrides the ontology default of `resilience`, so the
# validator warning is expected.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "diploid_prolonged_heat_vs_baseline"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Prolonged heat stress at 28 C (Li et al. 2022 abstract); deposited sample_alias time code 'f'. Exposure length and acclimation temperature not stated in the deposit or abstract."
