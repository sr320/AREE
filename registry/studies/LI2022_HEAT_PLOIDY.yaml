quality_flags:
  - raw_data_available
  - low_replication

limitations: >
  (1) n = 3 oysters per group. DESeq2 dispersion estimates rest on 2 residual
  degrees of freedom per group, so standard errors are imprecise. (2) The
  control is a time-0 baseline, not a time-matched control. Heat is therefore
  confounded with time in the experiment (handling, feeding, days in the
  system), most of all for the prolonged comparison. (3) The exposure is only
  partly described. The abstract gives 28 C for the prolonged stress, but not
  its duration, the acute-stress temperature, the acclimation temperature or
  the ramp. Until the methods are read, effect sizes here are not
  dose-comparable to other thermal studies. (4) The reading of the time codes
  (0 = baseline, 12 = 12 h acute, f = end of prolonged) is inferred from the
  abstract. (5) The link to Li et al. 2022 is inferred from submitter,
  institution, title, design and dates. No full text citing PRJNA762441 was
  found. (6) Exposure only: the sequenced oysters were not scored for their
  own tolerance. The paper's survival result (triploid below diploid under
  prolonged 28 C) applies to ploidy groups, not to these 18 animals. (7) The
  more informative contrast for breeding is the ploidy x heat interaction
  (does triploid gill respond differently?). It is not registered, because
  the workflow fits pairwise contrasts. A triploid-vs-diploid contrast at one
  time point would mix baseline ploidy differences into the heat response.
  (8) life_stage 'adult' is an assumption: age and size are not in the
  deposit or the abstract. (9) Triploid production method (chemical vs
  tetraploid cross) and parentage are not stated. Diploids and triploids may
  differ in genetic background as well as in ploidy. (10) Gill only, one
  cohort, one site (Qingdao). (11) Triploid gill tissue carries three
  genome copies. Library preparation normalizes total RNA, so per-copy dosage
  effects are not identifiable from these data.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-10"
  curation_notes: >
    Registered from live ENA metadata for PRJNA762441 with
    `aree fetch-samplesheet --bioproject PRJNA762441 --study
    LI2022_HEAT_PLOIDY --label-field sample_alias --label-pattern
    '^A(?P<timepoint>0|12|f)(?P<ploidy>d|t)_(?P<replicate>[1-3])$'
    --condition-attribute ploidy --condition-attribute timepoint --attribute
    replicate --attribute 'isolation source' --attribute tissue --attribute
    'collection date' --attribute 'geo loc name'`. Condition levels are
    <ploidy>_<time>, e.g. d_0, t_f. REPLICATION CHECK: 18 distinct
    sample_alias values and 18 distinct BioSamples. isolation_source numbers
    9 oysters per ploidy, three per time point, which fits lethal gill
    sampling of separate animals. ENA reports all 18 runs as RNA-Seq /
    TRANSCRIPTOMIC / PAIRED, HiSeq 2000, 21.5-27.1 M read pairs. Run
    scripts/check_replicate_dispersion.py after quantification, as for every
    raw_reanalysis study. Distinct BioSamples do not prove distinct animals
    (IOCAS2022_OA_ENERGY). PUBLICATION: PubMed search returned nothing.
    Europe PMC (AGRICOLA record IND607730474) found Li Y, Jiang K, Li Q,
    "Comparative transcriptomic analyses reveal differences in the responses
    of diploid and triploid Pacific oysters (Crassostrea gigas) to thermal
    stress", Aquaculture 555. Crossref gives DOI
    10.1016/j.aquaculture.2022.738219, article 738219, June 2022. Unpaywall
    reports it closed access. Exposure details were taken from the abstract
    only. A related paper, Li Y, Xu C, Li Q (2022) Aquaculture Research,
    "Physiological and gene expression responses of diploid and triploid
    Pacific oyster (Crassostrea gigas) to heat", may describe the same
    challenge. It was not checked. TO DO BEFORE REANALYSIS: read the methods
    (UW library access) for acute temperature, prolonged duration,
    acclimation temperature, oyster age/size and triploid production; confirm
    the data availability statement names PRJNA762441; update
    exposure_intensity, exposure_duration and life_stage.
    REANALYSIS (Pori, 2026-10-10): the 12 libraries of the primary
    comparison were downloaded from ENA over HTTPS and all 24 FASTQ files
    matched ENA's MD5s. Three files reached full size with a wrong MD5 after
    connections dropped mid-transfer and were resumed; they were discarded
    and fetched again. ENA throttled 10 parallel connections (HTTP 403, then
    refused connections) and the download was finished with 2-4 parallel connections. Run with
    -profile local,workstation, native tools from environment.yml, no
    container, plus a machine-local resource override for 8 GB RAM (task
    cpus/memory only, which does not change results). The reads glob was
    pointed at a folder holding only the comparison's 6 libraries. Nextflow
    26.04.7: 23 tasks completed, 1 cached, status OK, 28 min. Versions that
    actually ran: FastQC 0.12.1, fastp 1.4.0, Salmon 2.8.0, MultiQC 1.35,
    R 4.5.3, DESeq2 1.50.2, tximport 1.38.2, Quarto 1.9.38. The workflow
    manifest's software_versions lists the declared container versions
    instead (docs/implementation_status.md). Salmon index built in-workflow
    (k=31, transcriptome only) from GCF_963853765.1 rna.fna. Salmon mapped
    82.2-85.5% of read pairs (21.4-25.5 M pairs per library); library type
    IU, i.e. unstranded. REPLICATE DISPERSION: median 0.0138 (d_0) and
    0.0143 (d_f) over 5,446-5,536 well-expressed genes. That passes the
    0.005 threshold and is ten times IOCAS2022_OA_ENERGY's
    technical-replicate values, but lower than the 0.03-0.05 seen in
    CALLA2026_OSHV and LUTIER2022_OA_TIPPING. Gill from one cultured
    cohort may simply vary less than whole spat or juveniles; it is noted,
    not treated as a failure. Harmonized locally against the committed
    crosswalk: 25,823 evidence records, all mapping_confidence exact.
    DIPLOID ACUTE 12 H (Pori, 2026-10-11): all 6 d_12 FASTQ files matched
    ENA's MD5s (SRR15851232_2 needed a second download after a full-size
    MD5 mismatch). The first run was correct in content but mislabelled:
    config/LI2022_HEAT_PLOIDY.config set rnaseq.comparison_id to the
    primary comparison, and the workflow reads that before --comparison_id,
    so every output carried the primary's name. Nothing was renamed by
    hand. The config now leaves rnaseq.comparison_id null and sets the
    default as a top-level param, the results were deleted, and the run
    was repeated with -resume (11 tasks run, 12 cached: FastQC, fastp and
    Salmon). Manifest records control d_0, treatment d_12. The committed
    primary result is unaffected: its id and levels matched. Salmon mapped
    81.0-81.4% of read pairs (23.0-24.3 M pairs), unstranded. d_12 median
    dispersion 0.0225.
