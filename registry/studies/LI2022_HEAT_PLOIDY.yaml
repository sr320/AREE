    Registered from live ENA metadata for PRJNA762441 with
    `aree fetch-samplesheet --bioproject PRJNA762441 --study
    LI2022_HEAT_PLOIDY --label-field sample_alias --label-pattern
    '^A(?P<timepoint>0|12|f)(?P<ploidy>d|t)_(?P<replicate>[1-3])$'
    --condition-attribute ploidy --condition-attribute timepoint --attribute
    replicate --attribute 'isolation source' --attribute tissue --attribute
    'collection date' --attribute 'geo loc name'`. Condition levels are
    <ploidy>_<time>, e.g. d_0, t_f. REPLICATION CHECK: 18 distinct
    sample_alias values and 18 distinct BioSamples. isolation_source numbers
    9 oysters per ploidy, three per time point, which fits lethal gill
    sampling of separate animals. ENA reports all 18 runs as RNA-Seq /
    TRANSCRIPTOMIC / PAIRED, HiSeq 2000, 21.5-27.1 M read pairs. Run
    scripts/check_replicate_dispersion.py after quantification, as for every
    raw_reanalysis study. Distinct BioSamples do not prove distinct animals
    (IOCAS2022_OA_ENERGY). PUBLICATION: PubMed search returned nothing.
    Europe PMC (AGRICOLA record IND607730474) found Li Y, Jiang K, Li Q,
    "Comparative transcriptomic analyses reveal differences in the responses
    of diploid and triploid Pacific oysters (Crassostrea gigas) to thermal
    stress", Aquaculture 555. Crossref gives DOI
    10.1016/j.aquaculture.2022.738219, article 738219, June 2022. Unpaywall
    reports it closed access. Exposure details were taken from the abstract
    only. A related paper, Li Y, Xu C, Li Q (2022) Aquaculture Research,
    "Physiological and gene expression responses of diploid and triploid
    Pacific oyster (Crassostrea gigas) to heat", may describe the same
    challenge. It was not checked. TO DO BEFORE REANALYSIS: read the methods
