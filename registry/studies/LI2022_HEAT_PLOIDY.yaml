# FIRST REAL THERMAL RNA-SEQ STUDY REGISTERED IN AREE. Thermal evidence until
# now was simulated (GIGAS_HEAT01) or methylation that has not been run yet
# (CIBNOR2021_HEAT_RRSS).
#
# Registered from deposited metadata and the publication abstract. The
# publication is INFERRED, not confirmed. Li, Jiang & Li 2022 (Aquaculture
# 555:738219) is closed access, and Europe PMC finds no full text that cites
# PRJNA762441. The match rests on four things that agree: (a) the BioProject
# submitter is Kunyin Jiang, Ocean University of China, the paper's second
# author, and the last author (Qi Li) is at the same institution; (b) the
# BioProject title and description ("transcriptomic response of triploid and
# diploid C. gigas to thermal stress") match the abstract; (c) the deposit
# has diploid and triploid gill libraries at three sampling points, and the
# abstract describes acute and prolonged heat stress in both ploidies;
# (d) the deposit went public 2021-11-05 and the paper came out in June 2022.
# Confirm the accession against the paper's data availability statement
# before any result is harmonized.
#
# Registered 2026-10-10. REANALYZED 2026-10-10 at full depth for the primary
# comparison only (diploid prolonged heat vs baseline, 3 vs 3): 849 of 25,823
# genes have padj < 0.05 (431 up, 418 down), every one with a real lfcSE.
# The paper reports 418 DEGs for this contrast from its own pipeline.
# Replicates pass the dispersion check (median 0.014 in both groups,
# data/studies/LI2022_HEAT_PLOIDY/replicate_dispersion_qc.tsv).
# Diploid acute 12 h vs baseline, run 2026-10-11: 2,522 of 26,155 genes at
# padj < 0.05 (1,202 up, 1,320 down); the paper reports 779. d_12 median
# dispersion 0.022. The two triploid comparisons have not been run, so
# analysis_status is in_progress.

study_id: LI2022_HEAT_PLOIDY
simulated: false

accessions:
  doi: "10.1016/j.aquaculture.2022.738219"
  bioproject: "PRJNA762441"
  geo: null
  sra: "SRP336611 (SRR15851229-SRR15851246)"
  ena: "PRJNA762441"
  proteomexchange: null
  other: "BioSamples SAMN21393613-SAMN21393630 (one per library)"

citation: "Li Y, Jiang K, Li Q (2022). Comparative transcriptomic analyses reveal differences in the responses of diploid and triploid Pacific oysters (Crassostrea gigas) to thermal stress. Aquaculture 555:738219. https://doi.org/10.1016/j.aquaculture.2022.738219"

species: "Magallana gigas"
strain_or_population: "Cultured diploid and triploid oysters, Qingdao, China (BioSample isolate 'cultured', geo_loc_name China:Qingdao). How the triploids were produced, and whether the diploids and triploids share parents, is not stated in the deposit or the abstract."

# AREE reanalyzes against its current reference, matching the identifier
# crosswalk and the other raw_reanalysis studies.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina HiSeq 2000 (as deposited), paired-end 2x150 bp RNA-seq, 18 libraries, 21.5-27.1 M read pairs each; 54.7 GB FASTQ reported by ENA"

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 18 runs are public in ENA/SRA under PRJNA762441 (first public 2021-11-05). No count matrix or differential-expression table is deposited, and the paper is closed access, so its supplementary tables were not checked. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

qc_status: "in_progress"
analysis_status: "in_progress"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. Each BioSample carries one sample_alias,
# A<time><ploidy>_<rep>: time 0, 12 or f; ploidy d (diploid) or t (triploid);
# replicate 1-3. That gives 6 groups x n=3, all gill, collected 2020-12. The
# BioSample isolation_source numbers oysters 1-9 within each ploidy
# ("diploid Crassostrea gigas1" ... "9"), three per time point. So each
# library is a different animal, as expected when gill is sampled lethally.
# This is a deposit-level check only; replicate dispersion is checked after
# quantification.
#
# READING OF THE TIME CODES. This is inferred from the abstract, not stated
# in the deposit: 0 = before heat (baseline), 12 = 12 h of acute heat stress,
# f = final sampling after prolonged heat stress at 28 C. The acute
# temperature, the length of the prolonged exposure, the acclimation
# temperature and the ramp are not in the abstract or the deposit. They are
# left null until the methods are read.
#
# FOUR COMPARISONS, PRESPECIFIED BEFORE ANY RESULT WAS COMPUTED (2026-10-10).
# Each one is heat vs the same ploidy's time-0 baseline, mirroring the
# paper's per-ploidy DEG counts (779 / 396 acute, 418 / 483 prolonged,
# diploid / triploid). The primary comparison for pooling is DIPLOID
# PROLONGED heat vs baseline. Reasons: diploids are the reference population
# that other thermal studies use; 28 C is the only exposure level the
# abstract states; and prolonged heat is where the paper measured survival.
# A ploidy x heat interaction would be the more interesting contrast, but
# the workflow fits pairwise contrasts only. It is noted under limitations,
# not registered.
#
# ON PHENOTYPE CLASSIFICATION. The paper reports that triploid survival was
# lower than diploid survival after prolonged heat at 28 C. That is a
# ploidy-level measurement, made on animals other than the sequenced ones.
# Every registered comparison is heat vs baseline within a single ploidy: an
# exposure, with no tolerant vs sensitive animals contrasted. They are
# classified exposure_only on the thermal_tolerance axis, as LUTIER2022 and
# IOCAS2022 are. This overrides the ontology default of `resilience`, so the
# validator warning is expected.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "diploid_prolonged_heat_vs_baseline"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Prolonged heat stress at 28 C (Li et al. 2022 abstract); deposited sample_alias time code 'f'. Exposure length and acclimation temperature not stated in the deposit or abstract."
    stressor_standardized: "temperature"
    exposure_intensity: "28 C (control/acclimation temperature not stated)"
    exposure_duration: null
    exposure_timing: "final sampling of the prolonged exposure (time code 'f'); baseline sampled at time 0"
    control_condition: "Diploid oysters at time 0, before heat stress (sample-sheet level d_0; A0d_1-3)"
    treatment_condition: "Diploid oysters after prolonged heat stress at 28 C (sample-sheet level d_f; Afd_1-3)"
    phenotype: "thermal_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "exposure_only"
    sample_size: 6
    biological_replicates: 3
    results_file: "data/studies/LI2022_HEAT_PLOIDY/LI2022_HEAT_PLOIDY_diploid_prolonged_heat_vs_baseline_dge_standardized.tsv"
    meta_analysis_primary: true

  - comparison_id: "diploid_acute_heat_12h_vs_baseline"
