# FIRST REAL STUDY OF A FIELD MASS-MORTALITY EVENT in AREE: farmed adult
# Pacific oysters dying in Baynes Sound, British Columbia (July-August 2020),
# vs apparently healthy wild oysters from ten sites. Individually sequenced
# (one BioSample per animal per tissue), with a per-animal disease state.
#
# Publication: Zhong et al. 2025, PNAS (open access, read via PubMed Central
# PMC12377751). It reports a new nidovirus, PONV1, replicating in 20 of 33
# diseased farmed oysters and in none of 26 wild ones. The paper's text, as
# retrieved, does not show the ENA accession, so the link is INFERRED. It is
# strong all the same: the paper's station codes (StnA-H, J, K wild; StnI,
# StnL, StnM farm), tissues (mantle, plus hemolymph "when possible"), animal
# counts (33 farm, 26 wild) and year all match the 96-run deposit. Confirm
# from the data availability statement before harmonizing.
#
# NOT TO BE RUN ON THE MACHINE THAT REGISTERED IT. The libraries are
# metatranscriptomes at ~175-200 M read pairs each: 792.6 GB of FASTQ (mantle
# alone 437 GB). Registered and pre-screened on Pori (8 GB RAM, ~84 GB free),
# claimed for Chlo, the workstation with external storage. Registered
# 2026-10-14; not yet reanalyzed.

study_id: ZHONG2025_PONV1_MORTALITY
simulated: false

accessions:
  doi: "10.1073/pnas.2426923122"
  bioproject: "PRJEB77044"
  geo: null
  sra: null
  ena: "PRJEB77044 (ERR13334386-ERR13334481, 96 runs)"
  proteomexchange: null
  other: "PMID:40758866; PMCID:PMC12377751; BioSamples SAMEA115788887-SAMEA115788982 (one per animal per tissue)"

citation: "Zhong KX, Chan AM, Miller KM, Saunders R, Suttle CA (2025). Evolutionarily divergent nidovirus with an exceptionally large genome identified in Pacific oysters undergoing mass mortality. Proceedings of the National Academy of Sciences USA 122(33):e2426923122. https://doi.org/10.1073/pnas.2426923122"

species: "Magallana gigas"
strain_or_population: "Two- to three-year-old adults. Farmed: two aquaculture farms in Baynes Sound, Vancouver Island, BC (farm 1 = StnI; farm 2 = StnL, StnM), sampled during a mass-mortality event, most showing gaping shells and tissue necrosis. Wild: beach oysters without obvious disease from ten sites (StnA-H, J, K), a few km to >100 km from the farms (Zhong et al. 2025)."

# AREE reanalyzes against its current reference, matching the identifier
# crosswalk and the other raw_reanalysis studies.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, paired-end, 96 libraries (mantle 53, hemolymph 43), ~175-200 M read pairs each; 792.6 GB FASTQ reported by ENA. Deposited as RNA-Seq / size fractionation (metatranscriptomics)."

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 96 runs are public in ENA under PRJEB77044 (first public 2026-06-27). No host count matrix or DE table is deposited; the paper's analysis is viral discovery, not host expression. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. Each animal has its own BioSample per tissue, and
# sample_alias is Stn<site>_<Mantle|Hemolymph>_<animal>. The sample sheet
# parses it, so condition = <station>_<tissue> (24 levels, n = 2-17). Station
# is a sampling site, not a treatment, so comparisons pool station levels:
#   farm (mortality event): StnI, StnL, StnM.   No StnM mantle was deposited.
#   wild (no obvious disease): StnA-H, StnJ, StnK.  No StnB hemolymph.
# Mantle: farm 27 (I 17, L 10) vs wild 26. Hemolymph: farm 19 (I 10, L 3,
# M 6) vs wild 24. The paper's 33 farm animals = 17 + 10 + 6.
#
# COMPARISONS, PRESPECIFIED BEFORE ANY RESULT WAS COMPUTED (2026-10-14).
# Registered now: diseased farm vs healthy wild, per tissue. Farm vs wild
# confounds disease state with everything else that differs: genetics,
# husbandry, density, site environment, collection logistics. These
# comparisons are therefore recorded, but not flagged meta_analysis_primary.
#
# PLANNED PRIMARY, to be added after viral QC on the reanalysis machine:
# within the 27 farm mantle animals, PONV1-positive vs PONV1-negative. Rule,
# fixed now so that assignment cannot follow the results: run the workflow's
# viral QC (--viral_reference) against the PONV1 genome (both segments; the
# GenBank accessions are given in the paper's data availability statement)
# and call an animal positive if it has PONV1 read pairs at >= 100 per million
# in mantle (the workflow's --viral_detection_per_million default), with both
# segments detected. That is CALLA2026_OSHV's viral-QC approach. (Corrected
# 2026-10-14 from ">= 10", which misstated that default. No viral counts had
# been computed for this study when the rule was written or corrected.) The paper's own call is RPKM > 0, from assembled-contig mapping;
# record agreement with its 20 of 33. Same farms, same days, same
# husbandry, so this is the least confounded disease contrast in the
# deposit. If either arm has fewer than 5 animals, do not register it.
#
# CONTRAST TYPE (2026-10-20). Farm vs wild is exposure_response, the type
# that claims least (docs/contrast_types.md). It is closest to infected vs
# uninfected: nothing shows the wild arm met the same challenge, so it is not
# a phenotype_difference_under_exposure. The planned within-farm
# PONV1-positive vs PONV1-negative comparison will be
# phenotype_difference_under_exposure, like CORPOREAU2014's high vs low load.
# ON PHENOTYPE CLASSIFICATION. Disease state (gaping, necrosis, sampled during
# mass mortality) was observed per animal, so these are disease
# comparisons, not exposures. The cause is not established: the paper
# implicates PONV1 but does not show causation. The stressor is the field
# event as a whole, mapped to multi_stressor, with the original wording kept.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "farm_mortality_vs_wild_mantle"
    tissue: "mantle"
    life_stage: "adult"
    stressor_original: "Summer 2020 mass-mortality event on two oyster farms in Baynes Sound, BC; diseased animals showed gaping shells and tissue necrosis; PONV1 nidovirus replicating in 20 of 33 (Zhong et al. 2025). Etiology not established."
