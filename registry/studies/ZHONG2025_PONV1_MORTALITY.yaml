quality_flags:
  - raw_data_available
  - unbalanced_design
  - single_timepoint

limitations: >
  (1) Farm vs wild is confounded with disease state. Genetics (farmed stock
  vs naturalised wild), husbandry, density, site environment and sampling
  logistics all differ, so the registered comparisons cannot attribute
  expression differences to disease. The planned within-farm PONV1
  comparison is the less confounded one. (2) Etiology is not established:
  PONV1 is associated with the diseased animals, and its causal role is not
  shown. Other agents may contribute and are not excluded. (3) Diseased
  animals were sampled while dying (gaping, necrosis). Their expression
  includes moribund and necrotic tissue states, not only a response to
  infection. (4) Animals are nested in stations (2-17 per site) and the
  design is unbalanced; StnI dominates the farm arm (17 of 27 mantle).
  (5) These are total-RNA metatranscriptomes without rRNA depletion. In the
  pre-screen, cytoplasmic LSU and SSU rRNA took 65-97% of gene-level counts.
  The share differs by group: StnL farm libraries ran 82-85% at the top
  transcript, wild 53-68%. Host mRNA depth is still ample at ~190 M pairs
  per library. Run with --exclude_genes
  data/reference/gene_lists/GCF_963853765.1-RS_2024_06_rRNA.txt (PR #57;
  68 genes with NCBI gene_biotype rRNA). It keeps rRNA genes out of the
  results and records each library's rRNA share. Measured on 3 farm vs 3
  wild libraries, it does NOT change DESeq2's size factors (ratio 1.00 for
  every library). Median-of-ratios is robust to the few dominant rRNA genes,
  so leaving rRNA in would not have biased normalization. The large
  farm/wild difference in size factors (0.35-0.81 vs 1.53-1.83) is mRNA
  depth, and DESeq2 accounts for it. (6) Single time point, one
  region, one summer. (7) Hemolymph was collected "when possible", so the
  hemolymph comparison is a non-random subset of animals. (8) The wild
  oysters are "apparently healthy", not shown to be free of infection; the
  paper detected no PONV1 in them.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-14"
  curation_notes: >
    Claimed with `aree start-study --machine "Chlo (registered and
    pre-screened on Pori)"` (draft PR #56). Registered from live ENA metadata
    for PRJEB77044 with `aree fetch-samplesheet --bioproject PRJEB77044
    --study ZHONG2025_PONV1_MORTALITY --label-field sample_alias
    --label-pattern
    '^(?P<station>Stn[A-M])_(?P<tissue_label>Mantle|Hemolymph)_(?P<oyster>[A-M][0-9]+)$'
    --condition-attribute station --condition-attribute tissue_label
    --attribute oyster --attribute 'collection date' --attribute
    'geographic location (country and/or sea)'`. The deposit's BioSample
    attributes carry no disease or virus status, only organism, country
    and collection date. Station, tissue and animal come from sample_alias,
    and farm vs wild from the paper's station key. REPLICATION CHECK: 96
    runs, 96 distinct BioSamples, one per animal per tissue.
    PRE-SCREEN, PASSED (2026-10-14): scripts/prescreen_replicates.py (PR
    #54) on 20 mantle libraries (5 StnI, 5 StnL, all StnC/D/E;
    prescreen_subset_samplesheet.tsv), 1 M read pairs each from NCBI.
    Median dispersion was 0.03-0.32 (prescreen_replicates.tsv). Recomputed
    without the 69 rRNA transcripts' genes (picked by FASTA header; the
    committed GTF-biotype list has 68), which dominate these libraries, it was
    0.016-0.171 over 897-977 genes (prescreen_replicates_no_rrna.tsv). Every
    group is well above 0.005 and in line with individually sequenced
    animals. The diseased farm groups are the most variable (StnI 0.146,
    StnL 0.171). Salmon mapping on the subsample: farm StnI 47-66%, StnL
    75-78%, wild 61-75%. Most mapped reads are rRNA (see limitation 5).
    PUBLICATION: Europe PMC search on oyster, British Columbia and
    metatranscriptomics returned Zhong et al. 2025 (PMID 40758866). Its full
    text (PMC12377751) gives the station codes, tissues, counts and dates
    quoted above. Crossref gives the author list, volume 122(33) and article
    e2426923122. FOR THE MACHINE THAT RUNS IT: stage only the libraries of
    the comparison being run (mantle 437 GB, hemolymph 355 GB); add the
    PONV1 genome to data/reference/pathogens/ for viral QC; then add the
    within-farm comparison following the rule in the header.
  source_links:
    - "https://www.ebi.ac.uk/ena/browser/view/PRJEB77044"
    - "https://doi.org/10.1073/pnas.2426923122"
    - "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12377751/"
