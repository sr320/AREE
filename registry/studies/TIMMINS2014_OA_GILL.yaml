    TIMMINS2014_OA_GILL` (branch study/PXD000835/TIMMINS2014_OA_GILL).
    Inputs built 2026-10-17 by build_inputs.py from the Europe PMC
    supplementary files (Tables S2 and S3), the figshare SQLShare workflow
    (md5-checked) and the first 1 KB of each PRIDE .raw file (acquisition
    times); checksums in inputs_provenance.json. Design, phenotype and the
    authors' statistics come from the open-access full text (PMC4531390),
    read 2026-10-17. Workflow run on Hete with -profile local for each
    comparison: --mode raw_reanalysis --proteomics.input_scale linear
    --proteomics.normalization none --proteomics.quantification
    spectral_count --proteomics.min_detected_per_arm 3
    --proteomics.id_mapping_table data/reference/crosswalk/mgigas_gene_id_crosswalk.tsv,
    using workflows/proteomics at commit e3f0d7f (PR #80). Sensitivity
    (sensitivity.py): the primary comparison rerun with median normalization,
    and on a replicates-2-3 matrix with otherwise identical flags. pco2_2800_vs_400 flagged
    meta_analysis_primary before any result was computed. Harmonized with
    `aree harmonize` against the mgigas crosswalk v1.1.0 (PR #80). QC
    decision (2026-10-17, sr320): passed_with_warnings. The registering
    curator is the paper's senior author; the design facts the analysis
    rests on are pinned by tests/test_timmins2014_study.py.
