citation: "Timmins-Schiffman E, Coffey WD, Hua W, Nunn BL, Dickinson GH, Roberts SB (2014) Shotgun proteomics reveals physiological response to ocean acidification in Crassostrea gigas. BMC Genomics 15:951. https://doi.org/10.1186/1471-2164-15-951 (PMID 25362893, PMC4531390, CC BY 4.0). Proteomics: PRIDE PXD000835. NSAF workflow: Timmins-Schiffman E, Roberts SB (2014) SQLShare workflow for proteomics analysis, figshare 10.6084/m9.figshare.894323 (CC BY 4.0)."

species: "Magallana gigas"
strain_or_population: "One cohort from a single March 2011 spawning of about 25 broodstock; adults (shell length 51 +/- 5 mm) collected from Oyster Bay, Washington, on 29 Dec 2011."

# Spectra were searched against the oyster_v9 proteome (GigaDB
# 10.5524/100030, CGI_ gene models). AREE maps those models to current NCBI
# genes through the crosswalk's legacy_locus_tags (inferred); 1,107 of 1,616
# proteins resolve. See docs/identifier_mapping.md.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["proteomics"]
analysis_mode: "raw_reanalysis"
platform: "Data-dependent LC-MS/MS on a Thermo LTQ Orbitrap XL (MS1 at 60,000 resolution, 6 CID MS/MS per cycle), 3 technical replicates per oyster; SEQUEST against the oyster_v9 proteome with a reversed decoy, PeptideProphet/ProteinProphet (probability >= 0.9, ~0.6% FDR); NSAF from spectral counts averaged over technical replicates (authors' SQLShare workflow)."

data_availability:
  raw_data_available: true
  processed_data_available: true
  status: "available"
  access_notes: "PRIDE PXD000835 (public 2014-05-15, PARTIAL submission, EBI terms of use): 48 .raw files and 48 ProteinProphet .prot.txt files. The .prot.txt for run 20120821_101B_11_01 is truncated in PRIDE (42 KB vs ~5.7 MB); the full ProteinProphet output for every run is in the paper's Additional file 3 (Table S2). The per-oyster NSAF table the paper analysed is Additional file 4 (Table S3, CC BY 4.0), copied unchanged into data/studies/TIMMINS2014_OA_GILL/nsaf_matrix.tsv with columns renamed to oyster numbers by build_inputs.py. Checksums in inputs_provenance.json."

qc_status: "passed_with_warnings"
analysis_status: "harmonized"

# ---------------------------------------------------------------------------
# THREE COMPARISONS, the paper's three pairwise contrasts, each 4 vs 4
# oysters. pco2_2800_vs_400 (no mechanical stress) is the primary, chosen
# before any result was computed: it is the single-stressor OA contrast
# comparable with other OA studies. The two mechanical-stress contrasts are
# within-study and stay out of pooling.
#
# PHENOTYPE (pCO2). Measured on other oysters of the same treatments: shell
# fracture toughness lower at 2800 than 400 uatm (Tukey p < 0.05, n = 5-7
# shells); microhardness trend lower (n.s.); shell growth, glycogen, fatty
# acids and acute heat-shock mortality not different. Recorded as
# acidification_tolerance, decrease. No phenotype was measured for
# mechanical stress, so those two are exposure_only.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "pco2_2800_vs_400"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "29 days at 2800 uatm pCO2 (pH 7.29, calcite undersaturated) versus 400 uatm (pH 8.02) at 13 C in a flow-through system (CO2-stripped seawater with CO2 added back to set point in one treatment tank per level, feeding 8 replicate 3.5 L chambers of 6 oysters at 57.5 mL/min); sampled directly at day 29."
    stressor_standardized: "ocean_acidification"
    exposure_intensity: "2800 vs 400 uatm pCO2 (pH 7.29 vs 8.02)"
    exposure_duration: "29 d"
    exposure_timing: "chronic, adults, winter (Jan-Feb 2012)"
    control_condition: "400 uatm pCO2, sampled directly: oysters 221, 224, 227, 230"
    treatment_condition: "2800 uatm pCO2, sampled directly: oysters 2, 5, 8, 11"
    phenotype: "acidification_tolerance"
    phenotype_direction: "decrease"
    phenotype_unit: "shell fracture toughness at the growing edge, lower at 2800 uatm (n = 5-7 shells per treatment); growth, glycogen, fatty acids and heat-shock mortality unchanged"
    resilience_classification: "resilience"
    sample_size: 8
    biological_replicates: 4
    results_file: "data/studies/TIMMINS2014_OA_GILL/TIMMINS2014_OA_GILL_pco2_2800_vs_400_protein_abundance_standardized.tsv"
    meta_analysis_primary: true
  - comparison_id: "mech_stress_vs_none_at_400"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Mechanical stimulation: centrifugation in a salad spinner (5 min, ~100 rpm) at the end of 29 days at 400 uatm pCO2, then sampled; versus sampled directly."
    stressor_standardized: "handling_transport_stress"
    exposure_intensity: "5 min centrifugation (~100 rpm)"
    exposure_duration: "5 min, sampled immediately after"
    exposure_timing: "acute, after 29 d at 400 uatm"
    control_condition: "400 uatm, no mechanical stress: oysters 221, 224, 227, 230"
    treatment_condition: "400 uatm + mechanical stress: oysters 242, 245, 248, 251"
    phenotype: "recovery_following_stress"
    phenotype_direction: "not_applicable"
    phenotype_unit: "no phenotype measured for the mechanical stress"
    resilience_classification: "exposure_only"
    sample_size: 8
    biological_replicates: 4
    results_file: "data/studies/TIMMINS2014_OA_GILL/TIMMINS2014_OA_GILL_mech_stress_vs_none_at_400_protein_abundance_standardized.tsv"
  - comparison_id: "mech_stress_vs_none_at_2800"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Mechanical stimulation: centrifugation in a salad spinner (5 min, ~100 rpm) at the end of 29 days at 2800 uatm pCO2, then sampled; versus sampled directly."
    stressor_standardized: "handling_transport_stress"
    exposure_intensity: "5 min centrifugation (~100 rpm)"
    exposure_duration: "5 min, sampled immediately after"
    exposure_timing: "acute, after 29 d at 2800 uatm"
    control_condition: "2800 uatm, no mechanical stress: oysters 2, 5, 8, 11"
    treatment_condition: "2800 uatm + mechanical stress: oysters 26, 29, 32, 35"
    phenotype: "recovery_following_stress"
    phenotype_direction: "not_applicable"
    phenotype_unit: "no phenotype measured for the mechanical stress"
    resilience_classification: "exposure_only"
    sample_size: 8
    biological_replicates: 4
    results_file: "data/studies/TIMMINS2014_OA_GILL/TIMMINS2014_OA_GILL_mech_stress_vs_none_at_2800_protein_abundance_standardized.tsv"

quality_flags:
  - raw_data_available
  - single_timepoint
  - identifier_mapping_uncertain

limitations: >
  (1) Four oysters per group, and the paper does not say which of the 8
  chambers per pCO2 level each came from; oysters sharing a chamber would
  not be independent. Each pCO2 level was also delivered from one treatment
  tank, so level and water supply are confounded, as in most OA systems.
  (2) Spectral counting (NSAF) from DDA is noisy for low-abundance proteins:
  only 618-639 of 1,616 proteins are detected in >= 3 of 4 oysters per arm
  and tested; the rest are listed with their detection status, not given a
  fold change. (3) The reanalysis finds no protein at padj < 0.05 and a p-value
  distribution close to the null. This is a low-power null, not evidence of
  no effect, and it differs from the paper's fold-change-based list of
  245-286 proteins per comparison. (4) Technical replicate 1 was acquired in
  treatment blocks; the replicates 2-3 sensitivity (sensitivity.tsv) shows it
  does not drive the result. (5) 509 of 1,616 oyster_v9 protein models have
  no current NCBI gene (unresolved); resolved ones are inferred across an
  annotation version. (6) The phenotype (shell fracture toughness) was
  measured on different oysters of the same treatments, not the proteomic
  ones; heat-shock mortality was unaffected. (7) One cohort, one season,
  one 29-day time point.

