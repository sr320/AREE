# Real proteomics study: adult Pacific oyster gill after 29 days at 2800 vs
# 400 uatm pCO2, with and without a subsequent mechanical stress, shotgun
# LC-MS/MS spectral counting. Registered from PRIDE PXD000835 and the
# open-access paper, Timmins-Schiffman et al. 2014, BMC Genomics 15:951
# (PMC4531390, CC BY 4.0), and reanalyzed 2026-10-17 from the paper's
# per-oyster NSAF table. The first real proteomics study AREE has analyzed.
#
# DESIGN. One cohort (one March 2011 spawn of ~25 broodstock, Oyster Bay WA),
# 6 oysters per 3.5 L chamber, 8 replicate chambers per pCO2 level, one CO2-
# controlled treatment tank feeding each level's chambers (Friday Harbor OA
# lab). After 29 days, oysters were sampled directly or after 5 min of
# mechanical stress (salad-spinner centrifugation). Proteomics: 4 individual
# oysters per pCO2 x stress group, gill, each run as 3 technical replicates
# (48 runs). The paper does not say which chamber each sampled oyster came
# from; if two came from one chamber they are not independent, so the
# effective n may be below 4 (see limitations).
#
# WHICH COLUMN IS WHICH OYSTER. Table S3 (Additional file 4) labels oysters
# "2800 1"..."400 MechS4"; PRIDE and Table S2 use oyster numbers. The authors'
# SQLShare workflow on figshare (10.6084/m9.figshare.894323) gives the number
# ranges per group (2-11 = 2800, 26-35 = 2800 + stress, 221-230 = 400,
# 242-251 = 400 + stress). build_inputs.py checks the column -> oyster
# assignment by data: each Table S3 column's per-protein deviations correlate
# with exactly one oyster's Table S2 spectral counts (r 0.59-0.67, next best
# <= 0.13). The "101B"/"103B" in run names is that same split (2800 vs 400),
# not an MS batch.
#
# RUN ORDER (run_order.tsv, read from the .raw headers). All 48 runs were
# acquired on one instrument from 21 to 26 Aug 2012. Technical replicate 1 of
# every oyster ran in treatment blocks (all eight 400 uatm runs, then all
# eight 2800); replicates 2 and 3 are interleaved. Rerunning the pCO2
# comparison on an NSAF-equivalent matrix from replicates 2-3 only gives
# log2FC r = 0.85 with the full analysis, 85% same sign, mean shift 0.02
# (sensitivity.tsv), so the blocked replicate does not drive the result.
#
# REANALYSIS (2026-10-17). workflows/proteomics raw_reanalysis on the NSAF
# matrix: input_scale linear (zeros = not detected), normalization none (NSAF
# is normalized within each oyster), quantification spectral_count, limma,
# a protein tested only if detected in >= 3 of 4 oysters in each arm; these
# settings were fixed before any result was seen. 618-639 of 1,616 proteins
# are testable per comparison. No protein reaches padj < 0.05 in any
# comparison (one at padj < 0.1, mechanical stress at 2800 uatm), and the
# share of p < 0.05 is 4-6%, close to the null. log2FC agrees with the
# authors' fold changes (r = 0.81-0.83, 87-89% same sign). The paper's
# 245-286 "differentially abundant" proteins per comparison are mostly
# >= 2-fold differences in average NSAF, including proteins detected in
# only some oysters; its own q-value test found 12 proteins across all three
# comparisons. Median normalization changes nothing material (r = 1.00).
# QC decision (2026-10-17, sr320): passed_with_warnings. The standardized
# tables carry limma SEs, so the study contributes poolable (largely null)
# OA evidence.
#
# The run used workflows/proteomics from PR #80 (commit e3f0d7f: raw-mode
# options and lfcSE), which this study needs; it was not yet on main.

