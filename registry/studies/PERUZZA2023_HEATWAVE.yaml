# SECOND REAL MANILA CLAM STUDY, claimed 2026-10-15 from the WP5 backlog
# (docs/candidate_studies_mussels_clams.md, pool A: Manila clam heat). With
# TUCCI2025_HEAT_PRIMING it forms the first within-species clam pool (k = 2)
# on thermal_tolerance, which is also the first pool that can let a real
# oyster-clam orthogroup clear the WP6 cross-species replication gate.
#
# Registered from deposited metadata and the publication, which is CONFIRMED:
# Peruzza et al. 2023 (Mar Pollut Bull, open access, CC BY-NC-ND) gives
# "BioProject ID: PRJNA906528" for the RNA-seq libraries, and its methods
# (20 clams per arm, digestive gland, 75 bp single-end QuantSeq) match the
# deposit. NOT YET RUN.
#
# INDEPENDENCE FROM TUCCI2025_HEAT_PRIMING (checked 2026-10-15). Same Padova
# group and the same hatchery (SATMAR, France), but different animals: these
# clams were bought in February 2021 and sampled in March 2021; Tucci's were
# bought in February 2022. Different cohorts a year apart, different
# experiments, different exposures. Counted as independent (k = 2).
#
# DESIGN AS PUBLISHED. 240 clams acclimated 15 d at 20 C, then randomly
# allocated (randomizr) to control (20 C) or heatwave (30 C, reached by a
# 2-day ramp) for 30 days; 4 tanks per arm, 30 clams per 25 L tank. A pilot
# at 28, 30 and 32 C found no significant mortality at 30 C, so this is a
# non-lethal exposure: no survival difference. At the end, 5 clams per tank
# (20 per arm) were dissected; the digestive gland went to RNA-seq and 16S,
# mantle and foot to enzymes and metabolomics. Sex was assigned by a
# classifier trained on digestive-gland transcriptomes of 12 reference clams
# sexed by microscopy (PRJNA906977, not used here). The authors analysed each
# sex separately (RUVs k = 1, edgeR LRT, FDR < 0.05); AREE fits both sexes
# with sex as a covariate.
#
# ONE COMPARISON, PRESPECIFIED 2026-10-15, BEFORE ANY DATA WERE RUN.
#   heatwave_30c_vs_control_20c is meta_analysis_primary: the contrast that
#   pools with TUCCI2025_HEAT_PRIMING's naive_hw_vs_naive_control (heatwave
#   exposure in unprimed clams, both exposure_only on thermal_tolerance).
# Sample-sheet condition levels are 20 and 30 (BioSample attribute temp).
# ---------------------------------------------------------------------------

study_id: PERUZZA2023_HEATWAVE
simulated: false

accessions:
  doi: "10.1016/j.marpolbul.2023.115192"
  bioproject: "PRJNA906528"
  geo: null
  sra: "SRR22444642-SRR22444681 (40 RNA-seq runs)"
  ena: "PRJNA906528"
  proteomexchange: null
  other: "BioSamples SAMN31927492-SAMN31927531 (one per clam, RNA-seq). The same BioProject holds 39 16S amplicon runs from the same RNA, which are not used. Sex-reference transcriptomes are in PRJNA906977 (not used)."

citation: "Peruzza L, Tucci CF, Frizzo R, Riello T, Quagliariello A, Martino ME, Manuzzi A, Dalla Rovere G, Bonsembiante F, Gelain ME, Smits M, Borgheresi O, Camerani F, Panin M, Venier P, Mammi S, Hauton C, Patarnello T, Milan M, Bargelloni L (2023). Impaired reproduction, energy reserves and dysbiosis: the overlooked consequences of heatwaves in a bivalve mollusc. Marine Pollution Bulletin 193:115192. https://doi.org/10.1016/j.marpolbul.2023.115192 (PMID 37364338)."

species: "Ruditapes philippinarum"
strain_or_population: "Commercial hatchery stock from SATMAR (France), adults 25.7 +/- 1.9 mm shell length and 4.11 +/- 1.0 g, purchased February 2021; experiment in artificial seawater (32 PSU) at the University of Padova, March 2021. Sex assigned per clam by a transcriptome classifier (see limitations)."

# AREE reanalyzes against the NCBI RefSeq annotation its Manila clam crosswalk
# is built from. The authors mapped with STAR to the Xu et al. (2022) genome
# and counted with featureCounts; that pipeline is not reproduced.
genome_assembly: "ASM2657151v2"
annotation_version: "GCF_026571515.1-RS_2023_10"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, Lexogen QuantSeq 3' mRNA-Seq FWD (3' Tag) libraries, 75 bp single-end (76 bp per ENA); 5.1-8.5 M reads per library; 7.9 GB FASTQ reported by ENA. Deposited as library_selection PolyA."

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw single-end FASTQ for all 40 RNA-seq libraries are public in ENA/SRA under PRJNA906528 (first public 2023-07-01). The project also holds 39 paired-end 16S amplicon runs from the same RNA; the sample sheet keeps only library_strategy RNA-Seq. The paper's DEG tables are per sex after RUVs normalization and would not be reproduced here. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

qc_status: "not_started"
analysis_status: "not_started"

comparisons:
  - comparison_id: "heatwave_30c_vs_control_20c"
    tissue: "digestive_gland"
    life_stage: "adult"
    stressor_original: "Simulated marine heatwave: 30 C for 30 days, reached by a gradual 2-day increase from 20 C, against controls kept at 20 C for 30 days (Peruzza et al. 2023, section 2.3). BioSample attribute 'temp: 30' vs 'temp: 20'."
    stressor_standardized: "temperature"
    exposure_intensity: "30 C constant vs 20 C constant (+10 C)"
    exposure_duration: "30 d"
    exposure_timing: "sampled at the end of the 30 d exposure, at temperature; no mortality difference, so no survivor selection"
    control_condition: "Clams held at 20 C for 30 d (condition 20); 20 clams, 5 from each of 4 tanks"
    treatment_condition: "Clams held at 30 C for 30 d after a 2-day ramp (condition 30); 20 clams, 5 from each of 4 tanks"
    phenotype: "thermal_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "exposure_only"
    sample_size: 40
    biological_replicates: 4
    results_file: "data/studies/PERUZZA2023_HEATWAVE/PERUZZA2023_HEATWAVE_heatwave_30c_vs_control_20c_dge_standardized.tsv"
    meta_analysis_primary: true

quality_flags:
  - raw_data_available
  - tank_level_replication
  - single_timepoint
  - unbalanced_design

limitations: >
  (1) 3' Tag-Seq libraries (Lexogen QuantSeq FWD, 75 bp single-end), as in
  TUCCI2025_HEAT_PRIMING. Counts do not scale with transcript length, so the
  run must set tag_seq = true (fastp poly-X trimming, Salmon
  --noLengthCorrection, DESeq2 without length offsets); the workflow
  manifest's deseq2_design.length_model must read "none". Gene-level 3'
  counts depend on the RefSeq annotation's 3' ends on a contig-level assembly;
  expect a low Salmon mapping rate, as for Tucci (42-49%).
  (2) Tank is the unit of treatment: 4 tanks per arm, 5 clams sampled from
  each. Tank membership is not in the deposit or the paper, so the analysis
  cannot be fitted on tanks. Following the decision for TUCCI2025_HEAT_PRIMING
  (sr320, 2026-10-12), it is fitted on clams: lfcSE ignores tank-to-tank
  variation and adjusted p-values are optimistic by an amount these data
  cannot estimate. Four tanks per arm is better than Tucci's two, but treat
  significance calls as an upper bound. If tank IDs arrive, refit with
  --replicate_unit.
  (3) Sex. The deposited sex is a classifier's prediction from each clam's
  digestive-gland transcriptome, not an observation, and the arms are
  unbalanced (20 C: 15 male, 5 female; 30 C: 10 and 10). Sex is fitted as a
  covariate. The authors report a stronger heatwave response in males and
  analysed the sexes separately; a pooled ~ sex + condition fit estimates an
  average heatwave effect and does not test the sex difference.
  Misclassified sex would leave residual confounding.
  (4) Exposure only. The heatwave was chosen to be non-lethal and survival
  did not differ, so no sequenced clam differs in a tolerance outcome. The
  sublethal phenotypes the paper measured (hepato-somatic index, oocyte size,
  burying, filtration) are not encoded as the comparison's phenotype. Pooled
  with Tucci's naive heatwave contrast, this is replicated evidence of a heat
  response in clams, not of heat tolerance.
  (5) The two arms differ in temperature at sampling (30 vs 20 C), so the
  contrast mixes the acute state at 30 C with 30 days of acclimation; Tucci's
  contrast was sampled after 15 d recovery at a common 25 C. The pool
  therefore spans different timing, which the meta-analysis heterogeneity
  will reflect.
  (6) Single timepoint, single tissue (digestive gland, which includes some
  gonad, so reproductive genes reflect gonad state as well as the gland).
  One hatchery stock, shared with Tucci.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-15"
  curation_notes: >
    Claimed with `aree start-study --accession PRJNA906528 --study-id
    PERUZZA2023_HEATWAVE` (draft PR #64). Sample sheet and FASTQ manifest
    generated from live ENA metadata with `aree fetch-samplesheet --bioproject
    PRJNA906528 --study PERUZZA2023_HEATWAVE --condition-attribute temp
    --attribute sex --library-strategy RNA-Seq`; the provenance records the
    filter (kept RNA-Seq; 40 RNA-Seq and 39 AMPLICON runs before filtering).
    ENA returned HTTP 500 on the first attempt and succeeded on retry.
    LIBRARY-TYPE CHECK: ENA says PolyA; the paper says QuantSeq 3' mRNA-Seq
    FWD. The reads agree with the paper: in about 74,000 reads of SRR22444642,
    11.8% contain a run of 10 A and 0.1% a run of 10 T, against 4.3% and 0.1%
    for a known QuantSeq library from TUCCI2025_HEAT_PRIMING (SRR29712776). A
    one-sided poly-A signal is the forward 3' Tag-seq signature.
    REPLICATION CHECK: 40 distinct BioSamples and 40 distinct sample aliases
    (CTRL-<n>, HW-<n>), 20 per temperature, matching the paper's 5 clams from
    each of 4 tanks per arm. Tank membership is not recorded (limitation 2).
    Distinct names do not prove distinct animals: run
    scripts/check_replicate_dispersion.py after quantification.
    MAPPING: tissue 'digestive gland' maps to digestive_gland; adult clams map
    to adult. The GCF_026571515.1 reference bundle is the one fetched and
    verified for TUCCI2025_HEAT_PRIMING on 2026-10-12.
    PUBLICATION: the backlog listed none; found by searching the BioProject
    title. The open copy used for curation is the University of Padova
    repository PDF of the published version.
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA906528"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA906528"
    - "https://doi.org/10.1016/j.marpolbul.2023.115192"
    - "https://www.research.unipd.it/retrieve/feff46d3-23a2-40f5-a95a-82448f895ee8/64-Peruzza%20et%20al.%202023.pdf"
