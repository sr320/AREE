# WGBS of adult gill from common-garden F1 oysters of intertidal and subtidal
# origin (Laoting, Bohai Sea), before and after 6 h at 35 C. The methylation
# counterpart of LI2018_HEAT_TIDAL's Laoting half.
#
# Source: Wang et al. 2020, Heredity (open access, PMC7852555), which names
# PRJNA562805. Methods read in full 2026-10-18.
#
# NOT INDEPENDENT OF LI2018_HEAT_TIDAL. SAME COHORT, SAME EXPERIMENT, AND
# (BY ALL AVAILABLE EVIDENCE) THE SAME ANIMALS.
# - Methods: "The breeding and the heat-stress treatment of the oysters used
#   in this study were performed in a previous study (Li et al. 2018)."
# - Methods: the RNA-seq of PRJNA407831 (= LI2018_HEAT_TIDAL) was "matched
#   ... with the WGBS data on identical materials from the present study."
# - Design matches LI2018's Laoting arm exactly: Laoting intertidal and
#   subtidal wild parents, 30 females x 30 males per group, three culture
#   replicates, 10-month-old F1, 15 d laboratory acclimation at 14.2-18.2 C,
#   35 C seawater, gill sampled at 0 h and 6 h, n = 15 per group per time.
#   LI2018 sampled five oysters from each of three replicates per population
#   per time (n = 15); this study pooled DNA from its 15 per group into
#   three pools of five.
# - What is NOT stated: that each WGBS pool of five is the same five animals
#   (or the same tank) as an LI2018 RNA library. That is inferred from the
#   matching counts and the "identical materials" wording, not read.
# So this study is a second molecular layer on LI2018's Laoting population
# pair, not a replication of it. Its intertidal-vs-subtidal contrast must not
# count as a second independent population pair for LI2018's baseline
# contrast. It covers only Laoting (BioSample geo_loc_name "China: Laoting");
# LI2018's Bayuquan pair has no methylation data.
#
# REGISTERED, RUN PENDING (2026-10-18). Sample sheet, methylKit sheet, FASTQ
# manifest and run configuration are generated; no FASTQ downloaded, no
# workflow run, results_file null, both status fields not_started.

