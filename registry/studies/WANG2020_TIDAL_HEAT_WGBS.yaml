  - comparison_id: "intertidal_vs_subtidal_0h"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "No treatment contrast: F1 of intertidal-origin (thermally tolerant) vs subtidal-origin populations from Laoting, one-generation common garden, sampled before heat shock (0 h, laboratory acclimation 14.2-18.2 C, salinity 31.3 ± 0.5, 15 d); paper groups InC vs SubC"
    stressor_standardized: "temperature"
    exposure_intensity: null
    exposure_duration: null
    exposure_timing: "baseline (0 h); tolerance measured separately (Li et al. 2018: survival after 42 C for 1 h, 4-month-olds of the same cohorts)"
    control_condition: "subtidal-origin F1 (Laoting, SubC), 0 h; 3 pools of 5 oysters, 1 population"
    treatment_condition: "intertidal-origin F1 (Laoting, InC), 0 h; 3 pools of 5 oysters, 1 population"
    phenotype: "thermal_tolerance"
    phenotype_direction: "increase"
    phenotype_unit: "survival after acute heat stress (42 C, 1 h; followed 14 d), higher in intertidal than subtidal F1 at both Laoting and Bayuquan (Kaplan-Meier, log-rank p < 0.05); measured per population in 4-month-olds of the same cohorts by Li et al. 2018, not in this study"
