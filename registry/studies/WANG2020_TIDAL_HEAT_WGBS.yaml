  - raw_data_available
  - single_timepoint
  - family_level_replication   # tidal-origin contrasts: tolerance is a population trait, 1 v 1 populations
  - low_replication            # tidal-origin contrasts: 1 population per class

limitations: >
  (1) NOT INDEPENDENT OF LI2018_HEAT_TIDAL: same breeding, same F1 cohort,
  same heat-stress experiment, and per the authors "identical materials" to
  LI2018's RNA-seq (PRJNA407831); the paper's methylation-expression analysis
  uses those RNA-seq data. It adds a methylation layer to LI2018's Laoting
  population pair and must not be counted as an independent study or a second
  population pair when replicating LI2018's intertidal-vs-subtidal contrast.
  Multi-omics convergence between the two is same-animal linkage, not
  replication. Whether each WGBS pool is the same five animals as an LI2018
  RNA library is inferred, not stated. (2) Effective n for both tidal-origin
  contrasts is 1 population vs 1 population. The three pools per group
  replicate the population, not tidal origin, so tidal origin is fully
  confounded with everything else that differs between these two
  populations (genetic background, founder sampling, rearing replicate).
  The authors' SNP analysis found libraries cluster genetically by tidal
  origin; cytosine variation from SNPs can mimic C-to-T methylation calls and
  must be filtered or considered. (3) Every library pools DNA of five
  oysters, which averages individual variation. The shared BioSample does not
  by itself establish distinct pools; the paper states three pools of five
  distinct individuals per group. (4) The tolerance phenotype was not
  measured in this study: it is the survival difference after 42 C for 1 h
  measured by Li et al. 2018 in 4-month-olds of the same cohorts, while
  methylation is from 10-month-olds. Li et al. 2018 also report that
  Bayuquan intertidal oysters were more tolerant than Laoting intertidal
  oysters; only Laoting is sequenced here. (5) The heat contrasts' control
  is the same aquarium stock before heating (0 h), not a concurrent unheated
  group, so time, handling and the unchanged, unfed seawater are confounded
  with heat. Only 6 h was sequenced; LI2018's 24 h has no methylation
  counterpart. (6) Platform conflict: SRA says HiSeq X Ten and every run is
  2 x 150 bp; the paper says HiSeq 2500/4000, 125/150 bp. AREE uses the
  deposited reads as they are. (7) The authors report that two subtidal
  heat-shock libraries diverged from the rest in clustering; no library is
  excluded here, since no reason independent of the result is given. (8)
  The authors used Bismark with the default --score_min L,0,-0.2 and report
  ~30% mapping; CIBNOR2021 found the default badly under-maps this
  heterozygous genome, so the run config starts from the relaxed setting.
  (9) Sex and pool-to-tank assignment are not recorded. (10)
  Coordinate-based results are tied to GCF_963853765.1.

