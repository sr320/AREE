# ---------------------------------------------------------------------------
# Comparisons, prespecified 2026-10-18 before any AREE result was computed.
# (The authors' own results are published; see curation_notes for how the
# primary was chosen with that in mind.)
#
# RUN-TO-GROUP MAPPING. library_name = <origin><temperature>_<replicate>,
# In/Sub = intertidal/subtidal, C/H = control (0 h) / heat (6 h at 35 C); the
# paper: "InC/SubC and InH/SubH were used to represent control and heat-shock
# treatment samples from the intertidal/subtidal area." Corroborated: the
# mean ENA read count of each library_name group equals the paper's Table 1
# "raw reads" for that group (InC 83,021,662; InH 69,956,461; SubC 75,452,051;
# SubH 79,864,515), to within rounding of a single read.
#
# REPLICATION. Each library pools gill DNA of five oysters; three pools per
# group, 15 animals per group. Pools within a group are different animals from
# one population's F1. Whether each pool is one culture/heat-stress tank is
# not stated (inferred from LI2018's 3 x 5 sampling).
# - Tidal-origin contrasts: tolerance belongs to the population, and there is
#   ONE population per class (Laoting intertidal vs Laoting subtidal). The
#   effective n is 1 v 1. Pools are replicates of the population, not of
#   tidal origin; any test on 3 v 3 pools tests these two populations, and
#   cannot separate tidal origin from any other difference between them.
#   biological_replicates is recorded as 1.
# - Heat contrasts: three pools (probably tanks) per arm. Control is the same
#   aquarium stock before heating (0 h), not a concurrent unheated group,
#   as in LI2018.
# ---------------------------------------------------------------------------
