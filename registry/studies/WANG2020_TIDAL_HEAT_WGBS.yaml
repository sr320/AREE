strain_or_population: "F1 of two wild populations from the intertidal (In) and subtidal (Sub) zones at Laoting (39°16'N, Tangshan, Hebei, Bohai Sea, China); parents acclimated 1 month at Qingdao, eggs of 30 females split 30 ways and each fertilized by one of 30 males, larvae combined into three culture replicates per group, reared in sea cages; 10-month-old oysters used. Same F1 cohort as the Laoting populations of LI2018_HEAT_TIDAL (LT J / LT X)."

