  curation_notes: >
    Claimed with `aree start-study --accession PRJNA562805 --study-id
    WANG2020_TIDAL_HEAT_WGBS`. Registration only: no FASTQ downloaded and no
    workflow run. Sample sheet from live ENA metadata with `aree
    fetch-samplesheet --bioproject PRJNA562805 --study
    WANG2020_TIDAL_HEAT_WGBS --label-field library_name --label-pattern
    '^(?P<origin>In|Sub)(?P<temperature>C|H)_(?P<replicate>[1-3])$'
    --condition-attribute origin --condition-attribute temperature
    --attribute replicate --attribute tissue --methylkit-levels Sub_C In_C`:
    12 runs, 4 groups of 3, one BioSample. The group codes are the paper's
    (InC/InH/SubC/SubH), and the per-group mean ENA read counts reproduce the
    paper's Table 1 raw-read means. methylkit_samplesheet.csv codes the
    baseline contrast (SubC = 0, InC = 1); regenerate it with the other
    --methylkit-levels for the other comparisons. Orientation: intertidal is
    the treatment arm and subtidal the reference, as in LI2018, so positive
    effects mean higher in intertidal. Relationship to LI2018 established from
    the Wang et al. 2020 methods (PMC7852555) and the Li et al. 2018 methods
    (PMC6120431), both read 2026-10-18. PRIMARY COMPARISON: the two
    exposure_response comparisons share phenotype and contrast type, so one
    must be primary. heat_35c_6h_vs_0h_subtidal was chosen because the
    authors report more methylation plasticity in the intertidal group;
    taking intertidal as primary would select the comparison with the larger
    published response. This was decided from the published abstract, before
    any AREE analysis. The baseline and under-exposure contrasts are each the
    only comparison of their type and are not flagged. No exclusions.
    CLASSIFICATION OVERRIDE: the two heat comparisons are stress_response,
    not the thermal_tolerance default (resilience), as for LI2018's heat
    comparisons: heated vs unheated animals of one population measure the
    response to heat, not a difference in tolerance.
