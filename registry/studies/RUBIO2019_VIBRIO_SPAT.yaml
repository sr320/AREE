quality_flags:
  - raw_data_available
  - single_timepoint

limitations: >
  (1) Each library pools 30 spat, so animal-to-animal variation is averaged
  out and replication is at the level of the three experiments. (2) One
  family (Decipher 14), one dose, one time (8 h), before any death: the
  comparisons describe early host responses to infection, not which animals
  survive. (3) The libraries are dual RNA-seq (host plus bacteria); bacterial
  reads that do not map to the oyster transcriptome are simply not counted.
  (4) The deposited mock alias is 'anesthesis' while the paper describes a
  sterile-seawater injection; AREE reads the alias as the mock arm. (5) The
  stated dose differs between the paper's Methods (10^7 CFU) and its figure
  legend and infection section (7.5 x 10^7 CFU).

