# Four comparisons, prespecified 2026-10-12 before any result, all 3 v 3
# pools blocked on experiment. meta_analysis_primary = V. crassostreae J2-9
# (virulent) vs mock: a virulent Vibrio challenge against a sham injection is
# the contrast most like other pathogen-challenge studies (and the species
# behind summer mortality outbreaks in France). The other three share pools
# with it and must not pool alongside it.
comparisons:
  - comparison_id: "vcrass_j29_virulent_vs_mock_8h"
    tissue: "whole_animal"
    life_stage: "spat"
    stressor_original: "intramuscular injection of virulent Vibrio crassostreae J2-9, 7.5 x 10^7 CFU, 20 C, sampled 8 h (Rubio et al. 2019); alias Vcrass_J2-9"
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "7.5 x 10^7 CFU per spat by intramuscular injection"
    exposure_duration: "8 h"
    exposure_timing: "acute; sampled before mortality"
    control_condition: "mock injection with sterile seawater (alias 'anesthesis'), one pool of 30 spat per experiment"
    treatment_condition: "V. crassostreae J2-9 (virulent), one pool of 30 spat per experiment"
    phenotype: "disease_susceptibility"
    phenotype_direction: "increase"
    phenotype_unit: "mortality per strain in a separate infection of the same family (virulent strains: ~60% dead by 3 d; non-virulent: none); not measured on the sequenced pools"
    resilience_classification: "disease"
    sample_size: 6
    biological_replicates: 3
    meta_analysis_primary: true
    results_file: null

  - comparison_id: "vtasma_lgp32_virulent_vs_mock_8h"
    tissue: "whole_animal"
    life_stage: "spat"
    stressor_original: "intramuscular injection of virulent Vibrio tasmaniensis LGP32, 7.5 x 10^7 CFU, 20 C, sampled 8 h; alias Vtasma_LGP32"
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "7.5 x 10^7 CFU per spat by intramuscular injection"
    exposure_duration: "8 h"
    exposure_timing: "acute; sampled before mortality"
    control_condition: "mock injection with sterile seawater (alias 'anesthesis'), one pool of 30 spat per experiment"
    treatment_condition: "V. tasmaniensis LGP32 (virulent), one pool of 30 spat per experiment"
    phenotype: "disease_susceptibility"
    phenotype_direction: "increase"
    phenotype_unit: "mortality per strain in a separate infection of the same family; not measured on the sequenced pools"
    resilience_classification: "disease"
    sample_size: 6
    biological_replicates: 3
    results_file: null

  - comparison_id: "vcrass_virulent_vs_nonvirulent_8h"
    tissue: "whole_animal"
    life_stage: "spat"
    stressor_original: "virulent V. crassostreae J2-9 vs non-virulent V. crassostreae J2-8, same dose, route and time"
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "7.5 x 10^7 CFU per spat, both arms"
    exposure_duration: "8 h"
    exposure_timing: "acute; sampled before mortality"
    control_condition: "V. crassostreae J2-8 (non-virulent; no mortality), one pool of 30 spat per experiment"
    treatment_condition: "V. crassostreae J2-9 (virulent), one pool of 30 spat per experiment"
    phenotype: "disease_susceptibility"
    phenotype_direction: "increase"
    phenotype_unit: "virulent strain caused mortality, non-virulent none (separate infection of the same family)"
    resilience_classification: "disease"
    sample_size: 6
    biological_replicates: 3
    results_file: null

  - comparison_id: "vtasma_virulent_vs_nonvirulent_8h"
    tissue: "whole_animal"
    life_stage: "spat"
    stressor_original: "virulent V. tasmaniensis LGP32 vs non-virulent V. tasmaniensis LMG20012T, same dose, route and time"
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "7.5 x 10^7 CFU per spat, both arms"
    exposure_duration: "8 h"
    exposure_timing: "acute; sampled before mortality"
    control_condition: "V. tasmaniensis LMG20012T (non-virulent; no mortality), one pool of 30 spat per experiment"
    treatment_condition: "V. tasmaniensis LGP32 (virulent), one pool of 30 spat per experiment"
    phenotype: "disease_susceptibility"
