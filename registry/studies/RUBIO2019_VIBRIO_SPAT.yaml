# Vibrio infection of juvenile M. gigas spat: virulent vs non-virulent
# strains of two species, and each against a mock injection. Chosen
# 2026-10-12 from the RNA-seq studies the sister repository sr320/AREE-co had
# curated; not in candidate_studies.md.
#
# Source: Rubio et al. 2019, PNAS (PMC6628822; methods read 2026-10-12 via
# PMC). Every design label is deposited in the sample aliases
# (RNAseq_<treatment>_replicate<N>), and the paper confirms replicate N is
# independent experimental infection N.
#
# DESIGN. 150 Decipher-14 spat per experiment, 30 per condition, injected
# into the adductor muscle at 20 C with 7.5 x 10^7 CFU (the Methods also say
# 10^7 CFU; the figure legend and infection section say 7.5 x 10^7), or with
# sterile seawater (mock; alias 'anesthesis'). Sampled 8 h later, "before
# mortality occurred". One pool of 30 spat per condition per experiment,
# three experiments, so each comparison is 3 v 3 pools, paired by
# experiment and blocked on it (covariates = experiment).
#
# MEASURED PHENOTYPE, AT STRAIN LEVEL. In a separate infection of the same
# family, the virulent strains (J2-9, LGP32) killed spat within 1 day (~40%
# surviving at 3 d) and the non-virulent strains (J2-8, LMG20012T) killed
# none. So virulent-vs-non-virulent contrasts isolate the host response to a
# lethal infection, at the same dose, route and time.

