limitations: >
  (1) No survival, mortality, or viral-load phenotype is available for these
  animals in the deposited metadata or the publication abstract, so the
  population contrast that motivates the study (Midori vs Miyagi tolerance)
  cannot be anchored to a measured resilience outcome here. Evidence from this
  study is disease-associated, not resilience-validated. (2) Exposure dose,
  route, duration, and sampling timepoint are absent from the deposited
  metadata and the publication is not open access, so effect sizes are not
  dose-comparable to other pathogen-challenge studies. (3) Tissue is whole
  soft-tissue homogenate, so no tissue-specific resolution is possible and
  hemocyte-specific signals are diluted. (4) The three viral isolates are
  different OsHV-1 microvariants; the publication reports no marked difference
  between the USA and Australian variant responses, but they are registered as
  separate comparisons rather than pooled, because that is the authors'
  conclusion and not something AREE should assume. (5) AREE reanalyzes against
  the current NCBI reference annotation, which may differ from the authors' own
  transcriptome-assembly-based analysis; results are not expected to reproduce
  the paper's figures exactly and are not a replication of it. (6) The
  reanalysis has not been run — see analysis_status.

