quality_flags:
  - raw_data_available

limitations: >
  (1) Pairing not modeled. R and S are matched one-to-one by population, and
  T1 is a repeat biopsy of the same animal as T0. The registered DMR engines
  (methylKit, limma, DSS pooled tiles) fit an unpaired two-group contrast with
  no blocking term. For R vs S this leaves population (which dominates the
  paper's PCA) as unmodeled variance; for T1 vs T0 it discards the
  within-animal pairing. A population-blocked / animal-paired design needs a
  workflow change (a separate code PR) before results are treated as final.
  (2) Small n: 5 animals per class, one per population, each population
  contributing exactly one R and one S. Effective n is 5 individuals per
  class, not 5 families: R/S is an individual outcome, and populations are
  mass crosses, not families. How the 10 animals were chosen from the
  survivors and moribund animals of each population (and from which tanks)
  is not stated. (3) Individual phenotype from one challenge. Resistance is
  survival of one cohabitation challenge; with population survival from 15%
  (#5 SC18) to 85% (#1 Thau), an individual's outcome has a stochastic
  component (exposure dose, tank) that a single challenge cannot separate
  from predisposition. Per-individual viral load at T1 is reported only as a
  group difference (S > R, Mann-Whitney P = 0.032). (4) T1 contrasts are not
  like-for-like in time: S animals were biopsied when moribund (from 52 hpc
  onward), R animals at the end of the experiment, so a T1 R-vs-S difference
  mixes outcome with sampling time and disease state (dying tissue), and may
  be a consequence of the outcome rather than a cause. (5) T1 vs T0 is
  confounded with everything that changed over about five weeks besides
  infection: growth, the 30 d recovery, possible regeneration at the T0
  biopsy site (whether T1 was taken from the same site is not stated), and
  the move to the challenge tanks. There is no uninfected control kept
  through the same period, so these are not clean infection responses. For
  the resistant arm the disease phenotype direction is recorded as
  not_applicable because those animals survived. (6) Identifier anomaly:
  oyster code 21 appears for both the resistant (GT4_21_*_R) and the
  susceptible (GT4_21_*_S) population-4 oyster. Codes are otherwise distinct
  within a population, and an oyster cannot be both, so either codes are not
  unique tags or a label is wrong. The four libraries per animal should be
  checked for genotype concordance (C/T-neutral SNPs) before running, which
  also confirms T0/T1 and gill/mantle pairing for all ten animals. BioSample
  sample_description says 'susceptible (R)' for all ten susceptible mantle
  libraries; the phenotype attribute and titles say susceptible, and are used.
  (7) Sources conflict on details: recovery after biopsy is 30 days in the
  methods but three weeks in the results; acclimation reached 21 C but tanks
  are reported at 20 C; progenitors were collected in 2022 and F1 grown one
  year, yet every BioSample gives collection date 2022-03-01 and age 10
  months; ENA read counts (148-336 M per run) exceed the paper's 111.9 +/-
  19.8 M. Figure 4A reports n = 4 (ST0, RT0) and n = 3 (RT1) samples for one
  CpG, unexplained. life_stage is juvenile by inference from age (10 months
  per BioSample, about one year per the paper); sex and maturity are not
  reported. (8) EM-seq, like bisulfite data, cannot separate C/T SNPs from
  methylation; five genetically distinct populations make genotype-aware
  filtering important. (9) Coordinate-based region evidence is tied to
  GCF_963853765.1 and must be lifted over, not relabeled, if the reference
  changes; the paper's own coordinates are on cgigas_uk_roslin_v1.
  (10) Shares lab, funding and infection protocol (the cohabitation model of
  Gawra et al. 2023) with the group's other POMS studies, but no animals or
  populations with DECICOMP2025_POMS_AGE_EMSEQ (see curation_notes).

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-18"
  curation_notes: >
    Claimed with `aree start-study --accession PRJEB81880 --study-id
    VALDIVIESO2025_POMS_RS_EMSEQ` (branch
    study/PRJEB81880/VALDIVIESO2025_POMS_RS_EMSEQ). Sample sheet, methylKit
    sample sheet and FASTQ manifest generated from live ENA metadata
    (2026-10-18) with `aree fetch-samplesheet --bioproject PRJEB81880 --study
    VALDIVIESO2025_POMS_RS_EMSEQ --label-field experiment_title
    --label-pattern
    '(?P<population>GT[1-5])_(?P<code>\d{2})_(?P<time>T[01])_(?P<tissue_code>[GM])_(?P<phenotype_class>[RS])$'
    --condition-attribute tissue_code --condition-attribute phenotype_class
    --condition-attribute time --attribute population --attribute code
    --attribute phenotype --attribute tissue_type --attribute age --attribute
    sample_description --methylkit-levels G_S_T0 G_R_T0`. Cross-checks on all
    40 runs: parsed phenotype matches BioSample `phenotype`, parsed tissue
    matches `tissue_type`, and population, code and time match
    sample_description. All 40 runs have ENA FASTQ (no submitted_ftp
    fallback). Group sizes: 5 in each of the 8 tissue x phenotype x time
    cells; 10 (population, code, phenotype) animals with 4 libraries each.
    DESIGN SOURCE: the experimental design, the R/S definition and the
    meaning of T0/T1 were read from the accepted manuscript on HAL
    (hal-04901984, CC BY 4.0; Materials and methods, first Results section,
    Fig. 1 legend), which also names PRJEB81880 as the data accession. The
    SSRN preprint (Archimer 00915/102671) describes the same design.
    PRIMARY COMPARISONS, chosen 2026-10-18 before any AREE result was
    computed: gill within each contrast type, to match the gill comparisons
    already registered (CIBNOR2021_HEAT_RRSS, LI2018_HEAT_TIDAL); and, among
    the four exposure responses, the susceptible arm, because its T1 was
    taken during active disease, the state sampled by the other registered
    POMS exposure responses (CALLA2026_OSHV, DELISLE2020_OSHV_TEMP), whereas
    the resistant arm's T1 is a post-outbreak survivor state with no
    counterpart. The paper's own DMR counts per comparison were seen while
    reading it; the choice rests on tissue and sampling state, not on them.
    The methylKit sheet codes the primary baseline contrast only (G_S_T0 = 0,
    G_R_T0 = 1), keyed by run, so positive differences mean higher
    methylation in later-resistant oysters. OVERLAP WITH
    DECICOMP2025_POMS_AGE_EMSEQ (PRJEB105019): same group (IHPE / Ifremer,
    J. Vidal-Dupiol), same first author, shared ANR DECICOMP funding, and the
    same cohabitation infection model. No animals or families are shared:
    DECICOMP sequenced whole animals of full-sib families F14R and H2D (2020
    Argenton production) at 4, 16 and 28 months; this study sequenced gill
    and mantle biopsies of 10-month F1 mass-cross populations from four wild
    basins plus SC18. The F14 family appears here only as virus donors, which
    were not sequenced; whether DECICOMP's F14R descends from the same F14
    line is not stated. The two studies are independent replication units.
    Open questions for the submitters (J. Vidal-Dupiol): the code-21
    duplication; how the 10 animals were chosen; per-animal T1 sampling times
    and viral loads; whether T1 biopsies were taken from the T0 site.
