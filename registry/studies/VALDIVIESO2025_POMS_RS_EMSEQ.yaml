# EM-seq (DNA methylation) of gill and mantle biopsies from the SAME individual
# oysters before (T0) and after (T1) an experimental POMS (OsHV-1 µVar)
# cohabitation challenge, with each oyster's own outcome (resistant = survived,
# susceptible = moribund) recorded afterwards. Valdivieso et al. 2025, Sci Total
# Environ 962:178385 (IHPE / Ifremer; same group as DECICOMP2025_POMS_AGE_EMSEQ).
#
# Why it matters for AREE: the T0 resistant-vs-susceptible contrast is a
# PROSPECTIVE, INDIVIDUAL-LEVEL design. Animals were biopsied non-lethally
# before infection and classed by their own later outcome. That is the
# validation design docs/contrast_types.md asks for ("sample animals
# non-lethally before a challenge, record who survives"), here at n = 5 per
# class.
#
# Registered from the deposited ENA metadata (PRJEB81880) and the published
# paper (HAL hal-04901984, CC BY 4.0, which states the PRJEB81880 accession;
# methods read 2026-10-18). NOT YET RUN: 40 paired-end libraries, 624.9 GB of
# FASTQ; see config/VALDIVIESO2025_POMS_RS_EMSEQ.config.

study_id: VALDIVIESO2025_POMS_RS_EMSEQ
simulated: false

accessions:
  doi: "10.1016/j.scitotenv.2025.178385"
  bioproject: "PRJEB81880"
  geo: null
  sra: "ERR13913462-ERR13913501"
  ena: "PRJEB81880"
  proteomexchange: null
  other: "PMID 39799647; HAL hal-04901984 (accepted manuscript, CC BY 4.0); SSRN preprint 4971857; BioSamples SAMEA116339642-SAMEA116339681"

citation: "Valdivieso A, Morga B, Degremont L, Mege M, Courtay G, Dorant Y, Escoubas JM, Gawra J, de Lorgeril J, Mitta G, Cosseau C, Vidal-Dupiol J (2025). DNA methylation landscapes before and after Pacific Oyster Mortality Syndrome are different within and between resistant and susceptible Magallana gigas. Science of the Total Environment 962:178385. https://doi.org/10.1016/j.scitotenv.2025.178385"

species: "Magallana gigas"
strain_or_population: "Five hatchery-produced F1 populations (20 females x 10 males each; mass crosses, not full-sib families): #1 Thau Lagoon, #2 Arcachon Bay, #3 La Floride, #4 Logonna Daoulas (wild progenitors from POMS-affected basins), and #5 SC18 (Ifremer La Tremblade line kept biosecured since 2007, never POMS-exposed). Reared biosecured, never exposed to POMS before the challenge. BioSample calls these 'Family 1-5' (sample_alias prefix GT1-GT5); that they are the paper's populations #1-5 in the same order is inferred from the matching count and numbering, not stated."

# The paper aligned to cgigas_uk_roslin_v1 (GCA_902806645.1). AREE reanalyzes
# against its current reference; region coordinates are assembly-specific
# (docs/handling_genome_versions.md).
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["methylation"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, paired-end 150 bp NEBNext Enzymatic Methyl-seq (EM-seq), libraries and sequencing by IntegraGen; unmethylated lambda spike-in (paper: conversion 99.90 +/- 0.09%). 40 libraries; ENA read_count 148-336 M per run (the paper reports 111.9 +/- 19.8 M raw PE reads per sample; not reconciled). ENA library_strategy Bisulfite-Seq. 624.9 GB of FASTQ reported by ENA."

data_availability:
  raw_data_available: true
  processed_data_available: true
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 40 runs are public in ENA under PRJEB81880 (first public 2024-11-06), all with ENA-generated FASTQ and MD5s. The paper's supplementary tables (S5-S18) list DSS DMRs and genes per comparison; they were not retrieved or inspected for this registration. They are significance-filtered DMR calls on cgigas_uk_roslin_v1 coordinates, so this study is registered for raw reanalysis. Sample sheet, methylKit sample sheet and FASTQ manifest were generated from ENA metadata; sequence data are not committed."

qc_status: "not_started"
