# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED AND PUBLISHED. 40 libraries, parsed from
# experiment_title ('... sequencing: GT1_09_T0_G_R' = population GT1, oyster
# code 09, time T0, tissue G(ill)/M(antle), phenotype R/S). Parsed phenotype
# and tissue agree with the BioSample `phenotype` and `tissue_type` for all 40
# runs. 10 oysters (one R and one S from each of the 5 populations) x 2 tissues
# x 2 times = 40; each oyster contributes 4 libraries. Every cell
# (tissue x phenotype x time) holds 5 libraries, one per population.
#
# Paper (section 2.3): 100 tagged recipients (20 per population) were
# anaesthetized and biopsied (5-6 mm2 of gill and of mantle) = T0, recovered
# 30 days, then cohabited with OsHV-1 µVar-injected donors (5 tanks of 20, 4
# per population per tank). Checked every 2 h: an oyster that could not close
# its valves within 30 s of emersion was called susceptible, removed and
# biopsied again (T1). When no mortality occurred for 48 h, all survivors were
# called resistant and biopsied (T1). One R and one S per population were
# selected for EM-seq.
#
# So R/S is an INDIVIDUAL outcome, not a family or line property, and T0 and
# T1 are repeated biopsies of the same animal. The candidate-list note "5
# resistant vs 5 susceptible families" was wrong on both counts.
#
# REPLICATION. Replicates are individual oysters: 5 per phenotype class. The
# design is paired twice over: R and S are matched by population (the paper's
# PCA clusters samples by population of origin), and T1 is paired with T0
# within each animal. The registered DMR engines fit an unpaired two-group
# contrast with no blocking term, so a run as configured would ignore both
# pairings. See limitations (1).
#
# PRIMARY COMPARISONS (chosen before any AREE result; see curation_notes):
# gill within each contrast type, and the susceptible arm for the response.
# ---------------------------------------------------------------------------
