    stressor_standardized: "salinity"
    exposure_intensity: "15 ppt vs 25 ppt"
    exposure_duration: "three months"
    exposure_timing: null
    control_condition: "Gill of market-sized clams held for three months at 25 ppt (control_1-3), one clam per library."
    treatment_condition: "Gill of market-sized clams held for three months at 15 ppt (hyposalinity_1-3), one clam per library. Acclimation and transfer rate not read."
    phenotype: "salinity_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
