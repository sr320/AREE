quality_flags:
  - raw_data_available
  - low_replication
  - single_timepoint
  - ambiguous_phenotype_definition

limitations: >
  (1) Exposure only. Survival was measured but no clam died in any group,
  and body weight was compared between groups, not linked to the sequenced
  animals, so the comparisons are salinity responses, not tolerance.
  (2) Only the abstract was read. Acclimation, transfer rate and housing
  are not recorded; if each salinity was one tank, group is confounded with
  tank and significance is an upper bound (add tank_level_replication if the
  methods show this).
  (3) n = 3 clams per group.
  (4) hypersalinity_3 (SRR30635633) is sequenced about 3x deeper than the
  other libraries (118.9 M vs 28.6-41.0 M read pairs).
  (5) The two comparisons share the control libraries, so they are not
  independent of each other.
  (6) The control is 25 ppt, against 30 psu in ZHOU2023_SALINITY_GILL, so
  pooled hyposalinity contrasts differ in both baseline and step size
  (10 ppt down here, 20 psu there).

