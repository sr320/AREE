# SECOND REAL HARD CLAM (Mercenaria mercenaria) STUDY, claimed 2026-11-27 on
# Pori from the WP5 backlog (docs/candidate_studies_mussels_clams.md, Tier 1 B:
# hard clam salinity, PRJNA1159784). With ZHOU2023_SALINITY_GILL (IOCAS
# lineage, Tianjin) it makes the hyposalinity gill pool k = 2, from two
# independent labs.
#
# PUBLICATION: Zeng X, Zeng Y, Yee JC, Yang H (2024) Fish Shellfish Immunol
# 154:109888, doi 10.1016/j.fsi.2024.109888 (PubMed 39250983). Only the
# abstract was read. It states a three-month challenge at 15 (hyposalinity),
# 25 (control) and 35 ppt (hypersalinity) on market-sized northern quahogs,
# no mortality in any group, and a larger body-weight gain at 35 ppt.
#
# DESIGN AS DEPOSITED (BioSample attributes and aliases, checked 2026-11-27).
# University of Florida, Gainesville; gill; all sampled 2022-10-25. Three
# groups, three libraries each: control (25 ppt), hyposalinity (15 ppt),
# hypersalinity (35 ppt). Every alias agrees with its env_broad_scale. Each
# library is a distinct BioSample with its own isolate number (1-9) and
# sample title (MM15_02 ... MM35_05), so the unit is one clam; no pooling is
# recorded.
#
# SEQUENCING DEPTH: 28.6-41.0 M read pairs per run, except hypersalinity_3
# (SRR30635633) at 118.9 M, about 3x the others. DESeq2 size factors absorb
# depth; note it in case that library behaves as an outlier.
#
# TWO COMPARISONS, PRESPECIFIED 2026-11-27, BEFORE ANY DATA WERE DOWNLOADED.
#   hyposal_15_vs_25ppt (hyposalinity vs control) is meta_analysis_primary,
#   matching ZHOU2023_SALINITY_GILL's chronic_hyposal_10_vs_30psu so the hard
#   clam pool compares chronic hyposalinity with chronic hyposalinity in gill.
#   hypersal_35_vs_25ppt (hypersalinity vs control) is secondary.
# ---------------------------------------------------------------------------

