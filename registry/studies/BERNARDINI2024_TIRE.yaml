quality_flags:
  - raw_data_available
  - single_timepoint

limitations: >
  (1) The paper is not open access and only its abstract was read: exposure
  concentrations, tank layout and tanks per treatment are unknown, so
  exposure_intensity is null and oysters may be nested in one tank per
  treatment. (2) The library type was inferred from poly-A content, not
  stated in the deposit; effect sizes are on a 3' count scale. (3) All four
  comparisons share the same six controls. (4) No tolerance outcome is
  compared: the abstract reports no significant ecophysiological change in
  adults ("possible oyster resilience"), but that is an absence of effect at
  group level, not a tolerant-vs-sensitive contrast, so the comparisons are
  stress_response.

