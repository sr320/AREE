species: "Magallana gigas"
strain_or_population: "Adult oysters conditioned at Ifremer (France); origin not in the deposited metadata or abstract."

genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, single-end 76 bp, 3' tag (QuantSeq-style) RNA-seq inferred from poly-A content; 30 day-41 gill libraries used, 5.4-8.3 M reads each"

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw single-end FASTQ public in ENA/SRA under PRJNA856813. The design is in each run's experiment_title (e.g. 'Illumina NovaSeq 6000 sequencing: D41_GI_MR_H_3'); the BioSamples are 16S metagenome records that each oyster's 16S and RNA-seq runs share. Only the 30 day-41 gill NovaSeq runs of CTL, MR_L, MR_H, LEA_L and LEA_H are staged. Sequence data are not committed."

qc_status: "in_progress"
analysis_status: "in_progress"

# ---------------------------------------------------------------------------
# Four comparisons, each exposure against the same six day-41 gill controls,
# prespecified 2026-10-12 before any result was computed.
#
# meta_analysis_primary = tire particles, high concentration: the particles
# are the study's central stressor (leachate is one component of their
# effect), and the high dose is the one most likely to produce a detectable
# response; the abstract reports dysbiosis at high concentrations of both.
# The other three share the controls and must not pool alongside it.
#
# Replication: one oyster per library (an expressed-SNP check in
# sr320/AREE-co found every gill library is a different animal). How many
# tanks per treatment is unknown; if one tank per treatment, oysters are not
# independent replicates of the exposure. Flagged in limitations, not
# assumed either way.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "tire_particles_high_vs_ctl_d41_gill"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Tire particles (TP), high concentration, 41 days (run code MR_H); Bernardini et al. 2024"
    stressor_standardized: "pollutant_exposure"
    exposure_intensity: null
    exposure_duration: "41 days"
    exposure_timing: "chronic exposure; gill sampled on day 41"
    control_condition: "Unexposed controls (CTL), day-41 gill, 6 oysters"
    treatment_condition: "Tire microparticles, high concentration (MR_H), day-41 gill, 6 oysters"
    phenotype: "toxicant_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "stress_response"
    sample_size: 12
    biological_replicates: 6
