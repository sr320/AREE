# Tire microparticles and tire leachate in adult M. gigas gill, day 41.
# AREE's FIRST REAL pollutant_exposure STUDY. Chosen 2026-10-12 from the
# RNA-seq studies the sister repository sr320/AREE-co had curated, because it
# needs only ~9 GB while the machine's queue was download-bound; not in
# candidate_studies.md.
#
# Source: Bernardini et al. 2024, J Hazard Mater (Ifremer LEMAR / Univ.
# Padova). NOT open access and not in PMC: only the abstract was read. So the
# exposure concentrations, tank layout and the number of tanks per treatment
# are unknown, and are left null rather than guessed.
#
# LIBRARY TYPE, CHECKED, NOT ASSUMED. The deposit says only "RNA-Seq,
# RANDOM". Reads are 76 bp single-end, and 7.4% contain a run of 15+ A's,
# against 0.1% for full-length RNA-seq (LI2022_LOWSAL_VIBRIO) and 15.9% for
# known QuantSeq (GEORGE2023_HEATWAVE_PLOIDY, 101 bp): these are 3' tag
# libraries (QuantSeq FWD-style), consistent with the Padova co-authors'
# usual protocol. They are run with --tag_seq, so counts are not
# length-corrected. (An earlier reanalysis in sr320/AREE-co quantified them
# as full-length.)
#
# CODES. MR = tire microparticles and LEA = their leachate (the abstract's TP
# and LEA); L/H = low/high concentration; CTL = unexposed. NAT (probably a
# natural-particle reference) is not defined in any source read, so it is not
# used.

study_id: BERNARDINI2024_TIRE
