quality_flags:
  - raw_data_available
  - single_timepoint
  - ambiguous_phenotype_definition   # survival measured per ploidy x treatment group, not per sequenced oyster

limitations: >
  (1) The design (treatment, ploidy) is not in the deposited BioSamples; it
  comes from the authors' NCBI submission sheet, joined by isolate. (2)
  Mortality was measured per ploidy x treatment group, not per sequenced
  oyster: the sequenced animals are survivors, so these contrasts describe a
  stress response, and the ploidy difference in survival (36.4% vs 14.8%
  after the multiple stressor) cannot be attributed to any library or gene
  here. (3) QuantSeq 3' Tag-seq gives about one read per transcript and
  0.9-8.3 M reads per library: quantification ignores transcript length,
  isoforms are not resolvable, and mapping to the annotated transcriptome is
  lower than for full-length RNA-seq. Effect sizes are on a 3' count scale
  that may not be directly comparable with full-length RNA-seq fold changes.
  (4) The four comparisons share their ploidy-matched controls, so only the
  prespecified primary may enter a pool. (5) Tank structure and the
  duration of the 30 C exposure are not stated in the deposit or abstract.
  (6) The two stressor arms are acute and single-timepoint; recovery was not
  sequenced.

provenance:
  registered_by: "sr320"
  date_registered: "2026-10-11"
  curation_notes: >
    Claimed with `aree start-study --accession PRJNA913164 --study-id
    GEORGE2023_HEATWAVE_PLOIDY` (draft PR sr320/AREE#18). Note that sr320 is a
    co-author of the source paper. Publication identified 2026-10-11 by PubMed
    search (PMID 37464471) and matched on the BioProject description, not
    on a full-text accession citation (Europe PMC: 0 hits for PRJNA913164;
    paper not open access). Design from the authors' NCBI submission sheet
    (description column, e.g. 'diploid, single stressor'), pinned to commit
    24e7abd1c822504cdff9bbd5dab928f4106b38f9 of
    github.com/mattgeorgephd/NOPP-gigas-ploidy-temp and committed as
    authors_ncbi_attributes.tsv; design.tsv splits that column into ploidy and
    treatment and is joined with the new `aree fetch-samplesheet
    --design-table/--design-join` options (code PR on branch
    workflow/tagseq-single-end). All 72 isolates matched exactly one row:
    12 per ploidy x treatment cell. Comparisons, the meta_analysis_primary
    flag and the exclusions were fixed before any result was computed. An
    earlier, independent reanalysis of this BioProject in the sister
    repository sr320/AREE-co (2026-10-03) found within-group dispersion of
    0.03-0.14 on its Salmon quantifications, i.e. real biological replicates.
    Runs (2026-10-11, Nextflow 26.04.7, native -profile local,workstation on
    a 16 GB / 8-core Mac, work dir on an HFS+ external drive, with
    --single_end --tag_seq): all 72 FASTQ verified against ENA MD5s (18 needed
    re-download); first comparison 222/222 tasks, the other three reuse its
    Salmon quantifications (-resume). DE at padj < 0.05: diploid 30 C 3,081
    of 25,329 genes; triploid 30 C 2,254 of 24,898; diploid 30 C + 44 C 1,688
    of 25,058; triploid 30 C + 44 C 1,614 of 24,956. Fold changes correlate
    r = 0.24 (30 C) and 0.22 (30 C + 44 C) between ploidies across all genes,
    the ploidy-specific response the paper reports. Harmonized 2026-10-11:
    100,241 evidence records, identifier mapping 100% exact (quantified
    against the crosswalk's own annotation). A first attempt at the three
    non-primary comparisons was discarded unharmonized: the config then set
    params.rnaseq.comparison_id, which overrides --comparison_id, so all four
    runs wrote under the primary's name; the manifest's recorded arms showed
    it. Fixed by leaving rnaseq.comparison_id null. The workflow manifest's
    software_versions block reports container pins, not the Homebrew tools
    this native run used (Salmon 2.3.4, fastp 1.3.6, MultiQC 1.9); see
    process_versions.yml.
