quality_flags:
  - raw_data_available
  - single_timepoint
  - ambiguous_phenotype_definition

limitations: >
  (1) The tolerance difference is the authors' claim, not verified here. The
  abstract states that Zebra II has improved TAN tolerance, but the measured
  basis (LC50, survival curves, the number of animals tested) is in the
  paywalled methods, which were not read. The two challenge concentrations
  (17.6 and 16.7 mg/L) look like strain-specific test doses, possibly each
  strain's 96 h LC50; if so, Zebra II's higher LC50 is the tolerance evidence,
  and it is a modest one (about 6%). ambiguous_phenotype_definition is set
  until the full text is read.
  (2) Three clams per group, whole juveniles. n = 3 gives little power and
  imprecise standard errors; the meta-analysis weights will reflect this.
  That each library is one clam is inferred from the 12 distinct BioSamples
  and isolates ("Cultured clam1-12"), not confirmed from the methods; tank or
  container structure is unknown.
  (3) The strains were challenged at different TAN concentrations, so
  zebra_vs_ordinary_tan96h confounds strain with a ~1 mg/L dose difference,
  and the two exposure responses are not at equal dose.
  (4) Possible survivor selection. If the 96 h test ran at or near lethal
  concentrations, the exposed transcriptomes come from clams that survived,
  which biases both exposure responses and the under-exposure strain contrast
  toward tolerant individuals.
  (5) Strain is confounded with everything that differs between the two
  groups' origins (rearing history, age, size, possibly population of origin
  if P is the southern Putian population). The baseline contrast identifies
  genes that differ between these two groups, not genes that cause tolerance.
  (6) Whole-animal RNA mixes tissues, so composition differences between
  strains (e.g. relative gonad or gill mass) can appear as expression
  differences.
  (7) TAN is mapped to pollutant_exposure, the closest stressor term; ammonia
  here is an aquaculture water-quality stressor (waste accumulation in
  hatcheries and ponds) rather than an external contaminant. The original
  wording is preserved in stressor_original.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-21"
  curation_notes: >
    Claimed with `aree start-study --accession PRJNA733332 --study-id
    MA2022_AMMONIA_ZEBRA` (draft PR #109). Sample sheet and FASTQ manifest
    generated from live ENA metadata with `aree fetch-samplesheet --bioproject
    PRJNA733332 --study MA2022_AMMONIA_ZEBRA --label-field sample_alias
    --label-pattern '^(?P<strain>[BP])(?P<tan>D|C96)_(?P<rep>[123])$'
    --condition-attribute strain --condition-attribute tan --attribute isolate
    --attribute tissue --attribute collection_date --library-strategy RNA-Seq`.
    The design is in the aliases only; condition levels are B_D, B_C96, P_D
    and P_C96.
    ALIAS DECODING: B and P read as pinyin for zebra (banma) and ordinary
    (putong), matching the BioProject title's two groups; D and C96 as control
    (duizhao) and 96 h challenge, matching the abstract's 96 h acute test.
    This is an inference from the labels, not from the methods; confirm when
    the full text is read.
    REPLICATION CHECK: 12 distinct BioSamples, isolates "Cultured clam1" to
    "Cultured clam12" in alias order, all tissue "Complete individual", all
    collected 2019-12 in Dalian, 3 per strain x treatment. Distinct names do
    not prove distinct animals: run scripts/check_replicate_dispersion.py
    after quantification.
    INDEPENDENCE: different lab, country, stressor and year from the Padova
    heat studies (TUCCI2025_HEAT_PRIMING, PERUZZA2023_HEATWAVE). Same
    institution as NORTHSOUTH2024_TEMP_GILL (Dalian Ocean University), which
    may also involve Zebra II, but a different experiment, stressor and tissue.
    MAPPING: "Complete individual" maps to whole_animal (here individual
    juveniles, not pools); the abstract says juveniles, so juvenile. TAN maps
    to pollutant_exposure (limitations 7) and the tolerance phenotype to
    toxicant_tolerance. The GCF_026571515.1 reference bundle and Salmon index
    are those fetched and verified for TUCCI2025_HEAT_PRIMING on 2026-10-12.
    PRIMARY COMPARISONS prespecified on 2026-10-21 before any data were
    downloaded (see header). Exposure responses are fitted within strain and
    strain contrasts within treatment, each as a two-level DESeq2 contrast on
    its 6 libraries.
