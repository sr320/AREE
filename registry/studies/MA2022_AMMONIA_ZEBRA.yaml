species: "Ruditapes philippinarum"
strain_or_population: "Juveniles of two groups held at Dalian Ocean University (BioSample isolation_source Dalian, collected 2019-12): the Zebra II strain (a Manila clam strain bred by the Engineering Research Center of Shellfish Culture and Breeding in Liaoning Province; sample prefix B) and ordinary clams described in the abstract as a wild population (prefix P). Breeding history, generation, age and size of either group are in the paywalled methods and were not read."

# AREE reanalyzes against the NCBI RefSeq annotation its Manila clam crosswalk
# is built from, as for the other Manila clam studies. The authors' reference
# and pipeline are not known (full text not read).
genome_assembly: "ASM2657151v2"
annotation_version: "GCF_026571515.1-RS_2023_10"

assay_type: ["rnaseq"]
