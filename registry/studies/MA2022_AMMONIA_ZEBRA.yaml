platform: "Illumina HiSeq 2500, paired-end (2 x 150 bp per ENA base counts), 22.8-26.6 M read pairs per library; 38.7 GB FASTQ reported by ENA. Full-length libraries; no 3' Tag-seq design, unlike the Padova clam studies."

