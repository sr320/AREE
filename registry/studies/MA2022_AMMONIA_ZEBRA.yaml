# FOURTH REAL MANILA CLAM STUDY, claimed 2026-10-21 from the WP5 backlog
# (docs/candidate_studies_mussels_clams.md, Tier 2: PRJNA733332). The first
# clam study in AREE whose arms include a SELECTED STRAIN with an asserted
# tolerance advantage: Zebra II, a Manila clam strain bred in Liaoning, against
# ordinary (wild-type) clams, each held in seawater or under total ammonia
# nitrogen (TAN) for 96 h. It is the only clam study on pollutant_exposure /
# toxicant_tolerance, so every comparison is k = 1 for now: emerging
# candidates only, until a second ammonia (or other toxicant) study exists.
#
# Registered from deposited metadata and the publication's abstract.
# Publication CONFIRMED by design and title: Ma et al. 2022 (Comp Biochem
# Physiol D 44:101016), "Transcriptome sequencing reveals improved ammonia
# nitrogen tolerance in Zebra II strain of the Manila clam", Dalian Ocean
# University, matching the BioProject's center, title and 96 h acute test. The
# full text is paywalled (no PMC copy, Unpaywall: closed) and was NOT read, so
# every methods detail beyond the abstract and the deposit is marked unknown.
#
# DESIGN, DECODED FROM THE SAMPLE ALIASES (BioSamples carry no design field):
#   <strain><treatment>_<rep>
#   strain    B = Zebra II (pinyin banma, "zebra"); P = ordinary/wild clam
#             (putong, "ordinary"). The BioProject title names exactly these two
#             groups ("Zebra 2" and "Ruditapes philippinarum"). P could also
#             stand for Putian, the southern population this lab compares with
#             Zebra II in Li et al. 2024 (see NORTHSOUTH2024_TEMP_GILL); either
#             reading makes P the non-selected comparator.
#   treatment D = control (duizhao); C96 = 96 h TAN challenge.
#   3 clams per cell, 12 distinct BioSamples (isolates "Cultured clam1-12"),
#   all "Complete individual", collected 2019-12, Dalian.
#
# FOUR COMPARISONS, PRESPECIFIED 2026-10-21, BEFORE ANY DATA WERE RUN.
# Each contrast type has exactly one meta_analysis_primary comparison:
#   ordinary_tan96h_vs_ordinary_control   exposure_response              PRIMARY
#     The unselected stock's ammonia response: the contrast most like the
#     exposure responses a future toxicant study would contribute.
#   zebra_tan96h_vs_zebra_control         exposure_response              secondary
#   zebra_vs_ordinary_control             baseline_phenotype_difference  PRIMARY
#     The predictive-marker design: strains that differ in tolerance, both
#     unexposed. Positive log2FC = higher in Zebra II.
#   zebra_vs_ordinary_tan96h              phenotype_difference_under_exposure PRIMARY
#     Positive log2FC = higher in Zebra II. Confounded with dose (limitations 3).
# The strain x TAN interaction (phenotype_by_exposure_interaction) is not fitted:
# the RNA-seq workflow fits two-level contrasts only. Compare the two exposure
# responses on the evidence cards instead.
# ---------------------------------------------------------------------------

