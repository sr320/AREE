# EM-seq (DNA methylation) arm of Ifremer's DECICOMP POMS age experiment.
# Families F14R and H2D were challenged by OsHV-1 cohabitation at 4, 16 and 28
# months; older oysters survived POMS markedly better. This deposit has whole
# individual oysters at 0 hpc (basal) for all three ages, plus resistant and
# susceptible 28-month oysters at 500 hpc: an individual-level resistance
# phenotype, which no other real AREE methylation study has.
#
# Registered from deposited ENA metadata only (PRJEB105019, public 2025-12-06).
# The metabolomics arm of the same experiment is DECICOMP2025_POMS_AGE
# (MetaboLights MTBLS13463, PR #21), cited here but not listed under
# `accessions`, as it does not list this project either. Its 0 hpc design
# (2 families x 3 ages x 6) matches this study's T0 libraries. Whether they are
# the same animals is not stated. No publication cites this accession; the
# MetaboLights record names a manuscript in preparation (Valdivieso et al.).
#
# NOT YET RUN. 60 paired-end libraries, 72-107 M read pairs each. FASTQ are
# staged from NCBI's SRA copy on AWS, not from ENA; see the config for storage,
# runtime and integrity notes.

study_id: DECICOMP2025_POMS_AGE_EMSEQ
simulated: false

accessions:
  doi: null
  bioproject: "PRJEB105019"
  geo: null
  sra: null
  ena: "PRJEB105019"
  proteomexchange: null
  other: null

citation: "Ifremer / IHPE (2025). Epigenetic profiling (DNA methylation) of Pacific oysters (Magallana gigas) under control conditions (23C, fed ad libitum), in three ages (4, 16, and 28 month olds), DECICOMP project [EM-seq dataset]. ENA PRJEB105019, public 2025-12-06; collector J. Vidal-Dupiol. No publication cites the accession as of 2026-10-13. Same experiment, metabolomics arm: MetaboLights MTBLS13463 (AREE study DECICOMP2025_POMS_AGE), whose record names the manuscript in preparation: Valdivieso A, ..., Mitta G, Vidal-Dupiol J. Unravelling age-driven molecular transitions underlying Pacific Oyster Mortality Syndrome permissiveness in Magallana gigas."

species: "Magallana gigas"
strain_or_population: "Ifremer full-sibling biparental families F14R and H2D (two of four families challenged: H2D, F14R, F11N, F14V), produced at the Ifremer Argenton hatchery in 2020 and reared under biosecured conditions (per MTBLS13463 protocols)."

# AREE reanalyzes against its current reference. Region coordinates are
# assembly-specific: see docs/handling_genome_versions.md.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["methylation"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, paired-end Enzymatic Methyl-seq (EM-seq). 60 libraries, 71.7-106.6 M read pairs each (median 86.9 M), 2 x 150 bp; 710.5 GB of FASTQ reported by ENA. ENA's read_count counts each mate, so it is twice the pair count (base_count = 2 x pairs x 150). ENA library_strategy is Bisulfite-Seq. The project description says NextSeq 550 and calls the assay 'RNA-Seq ... on extracted DNA using the EM-seq kit'; the run records (NovaSeq 6000, Bisulfite-Seq) are taken as authoritative."

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 60 runs are public in ENA under PRJEB105019 (first public 2025-12-06). No methylation calls or publication are available. Sample sheet, methylKit sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed. One run, ERR15996548 (F14R_C3_T0_S3, in the primary comparison's reference arm), has no ENA-processed FASTQ (empty fastq_ftp); only the submitter's files are listed (submitted_ftp, with MD5s). fastq_manifest.tsv uses those two files for it (source = submitted_ftp). ENA downloads ran at about 0.5 MB/s, so the FASTQ are staged instead from NCBI's SRA copy on AWS (sra-pub-run-odp; all 60 runs, ERR15996548 included). Those files are not byte-identical to ENA's, so the ENA MD5s in fastq_manifest.tsv do not apply to them; sra_provenance.tsv is the integrity record (vdb-validate result, .sra and .fastq.gz MD5s, and per-mate read and base counts that must sum to ENA's read_count and base_count). Released before any publication: check reuse expectations with the submitters before publishing results."

qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. 60 libraries, one whole individual oyster each, parsed
# from experiment_title ('... sequencing: F14R_C3_T0_S1' = family F14R, cohort
# C3, group T0, replicate 1). Cohorts: C3 = 4, C7 = 16, C8 = 28 months
# (BioSample `age` agrees for all 60). Groups:
#   T0  0 hpc, BioSample phenotype 'No infected (Basal)'   C3, C7, C8 x 2 families x 6
#   R   500 hpc, phenotype 'Resistant'                      C8 x 2 families x 6
#   S   500 hpc, phenotype 'Susceptible'                    C8 x 2 families x 6
# The parsed group matches the BioSample phenotype for all 60 runs. Two sample
# titles carry swapped replicate numbers (F14R_C8_S_S6 says 'Replicate 1',
# F14R_C8_T0_S1 says 'Replicate 6'); run labels are unique and used as given.
#
# REPLICATION. Libraries are individual oysters, and each arm holds 6 per
# family from both families, so individuals are the replicates and family is
# balanced across arms. No replicate_unit is set. DMR_METHYLKIT has no
# covariate term, so family adds unmodeled variance; per-family runs are the
# sensitivity analysis. Tank of origin is not deposited (the 28-month cohort
# was spread over 15 tanks).
#
# PRIMARY COMPARISON. The 28 vs 4 month basal contrast is primary so that it
# pairs with DECICOMP2025_POMS_AGE's primary metabolomic contrast on the same
# design. The resistant vs susceptible contrast has the stronger phenotype,
# but how R and S were assigned at 500 hpc is not deposited (see limitations).
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "age28mo_vs_age4mo_basal"
    tissue: "whole_animal"
    # The contrast spans life stages: 4-month oysters are juveniles. Registered
    # as adult, as in DECICOMP2025_POMS_AGE.
    life_stage: "adult"
    stressor_original: "Experimental infection by cohabitation with OsHV-1 µVar-injected donor oysters (1:1 biomass, 23 C, fed ad libitum), mimicking natural POMS transmission; each age cohort challenged in a separate year. Libraries sampled at 0 hpc (basal, 'No infected')."
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "cohabitation with injected donors at 1:1 biomass ratio"
    exposure_duration: "until 48 h without mortality (per MTBLS13463 protocol)"
    exposure_timing: "sampled at 0 hpc, before infection (BioSample phenotype 'No infected (Basal)'); constitutive differences"
    control_condition: "4-month-old oysters (cohort C3), families F14R and H2D, 6 individuals per family at 0 hpc (12 libraries). Less POMS-resistant reference age; not an unexposed control."
    treatment_condition: "28-month-old oysters (cohort C8), families F14R and H2D, 6 individuals per family at 0 hpc (12 libraries). The more POMS-resistant age."
    phenotype: "disease_resistance"
    phenotype_direction: "increase"
    phenotype_unit: "percent_survival_post_challenge (cohort level; values not deposited)"
    resilience_classification: "resilience"
    contrast_type: "baseline_phenotype_difference"
    sample_size: 24
    biological_replicates: 6
    results_file: null
    meta_analysis_primary: true

  - comparison_id: "age16mo_vs_age4mo_basal"
    tissue: "whole_animal"
    life_stage: "adult"
    stressor_original: "Experimental infection by cohabitation with OsHV-1 µVar-injected donor oysters (1:1 biomass, 23 C, fed ad libitum); each age cohort challenged in a separate year. Libraries sampled at 0 hpc (basal, 'No infected')."
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "cohabitation with injected donors at 1:1 biomass ratio"
    exposure_duration: "until 48 h without mortality (per MTBLS13463 protocol)"
    exposure_timing: "sampled at 0 hpc, before infection; constitutive differences"
    control_condition: "4-month-old oysters (cohort C3), families F14R and H2D, 6 individuals per family at 0 hpc (12 libraries). Reference age; not an unexposed control."
    treatment_condition: "16-month-old oysters (cohort C7), families F14R and H2D, 6 individuals per family at 0 hpc (12 libraries)."
    phenotype: "disease_resistance"
    phenotype_direction: "increase"
    phenotype_unit: "percent_survival_post_challenge (cohort level; values not deposited)"
    resilience_classification: "resilience"
    contrast_type: "baseline_phenotype_difference"
