quality_flags:
  - raw_data_available
  - single_timepoint
  - ambiguous_phenotype_definition

limitations: >
  (1) Not yet run: about 745 GB of paired-end FASTQ, staged on a dedicated
  drive (Monarch had 167 GB free on 2026-10-13). Bismark at about 87 M read
  pairs per library (72-107 M) is still a multi-day job. The FASTQ come from
  NCBI's SRA copy, not ENA: checked against ENA's read and base counts, not
  ENA's file MD5s. (2) Resistant vs susceptible:
  how individuals were classed R or S at 500 hpc is not deposited. Both
  classes were sampled at the same time point, so "susceptible" cannot simply
  mean "died": possibly infected but surviving, high viral load, or
  moribund. It is also post-infection, so methylation differences may reflect
  disease state or tissue composition (whole animal) rather than
  predisposition. Confirm the criteria with the submitters before treating it
  as resistance evidence. (3) Age contrasts: age is confounded with challenge
  year, sampling season and freezer-storage time (each cohort was challenged
  in a separate year), and with size, maturity and reproductive state. The
  resistance phenotype is a cohort-level survival difference, not measured on
  these individuals, and the values are not deposited. Only the two families
  with the strongest age effect were profiled (selection on the outcome).
  (4) Family is not modeled by DMR_METHYLKIT. It is balanced across arms, so
  it adds variance rather than bias; run per family as a sensitivity
  analysis. Family genetic background also creates C/T SNPs that EM-seq, like
  bisulfite data, cannot separate from methylation without genotype-aware
  filtering. (5) Whole-animal libraries mix tissues whose proportions change
  with age and disease. (6) Same experiment as DECICOMP2025_POMS_AGE
  (metabolomics): convergent evidence across omics layers, not independent
  replication. Family F14R and the 2020 Ifremer production are also shared
  with DUPERRET2025_POMS_STARVE and DUPERRET2025_STARVE_RNASEQ. (7) The
  project description conflicts with the run records on platform (NextSeq
  550 vs NovaSeq 6000) and age (3 vs 4 months); run records and BioSample
  ages are used. (8) Coordinate-based region evidence is tied to
  GCF_963853765.1 and must be lifted over, not relabeled, if the reference
  changes.

provenance:
  registered_by: sr320
  date_registered: "2026-10-13"
  curation_notes: >
    Claimed with `aree start-study --accession PRJEB105019 --study-id
    DECICOMP2025_POMS_AGE_EMSEQ` (branch
    study/PRJEB105019/DECICOMP2025_POMS_AGE_EMSEQ). Sample sheet, methylKit
    sample sheet and FASTQ manifest were generated from live ENA metadata with
    `aree fetch-samplesheet --bioproject PRJEB105019 --study
    DECICOMP2025_POMS_AGE_EMSEQ --label-field experiment_title --label-pattern
    '(?P<family>F14R|H2D)_(?P<cohort>C[378])_(?P<group>T0|R|S)_S(?P<replicate>[1-6])$'
    --condition-attribute cohort --condition-attribute group --attribute
    family --attribute replicate --attribute phenotype --attribute age
    --attribute isolate --attribute tissue_type --methylkit-levels C3_T0
    C8_T0`. ERR15996548 has no fastq_ftp in ENA's read_run report.
    fetch-samplesheet first dropped it from fastq_manifest.tsv silently, and
    its submitted files were added by hand in a supplement file. After the
    tool learned to fall back to submitted FASTQ (sr320/AREE#47), the
    manifest was regenerated (2026-10-13) with the same command: it now
    covers all 60 runs, ERR15996548 with source = submitted_ftp and the
    submitter's MD5s, matching the former supplement row for row. The other
    59 runs, the sample sheet and the methylKit sheet were unchanged.
    Cross-checks on all 60 runs: the parsed group matches the
    BioSample phenotype, the cohort code matches the BioSample age, and the
    family matches the isolate. Group sizes: 6 per family in each of C3_T0,
    C7_T0, C8_T0, C8_R and C8_S. The methylKit sheet codes the primary
    comparison only (C3_T0 = 0, C8_T0 = 1). Three comparisons were registered
    before any result was computed, with the 28 vs 4 month basal contrast as
    meta_analysis_primary so that it pairs with DECICOMP2025_POMS_AGE. The
    BioSample phenotype 'No infected (Basal)' on every T0 library confirms
    the 0 hpc basal sampling that DECICOMP2025_POMS_AGE had to infer.
    Publication search 2026-10-13: Europe PMC finds no paper citing
    "PRJEB105019" (13 DECICOMP-related papers, none using it). Ask the
    submitters (J. Vidal-Dupiol, IHPE) for the R/S assignment criteria, the
    cohort survival values, and whether these are the metabolomics animals.
    2026-10-22: read-pair counts corrected. The earlier 143-213 M (median
    about 173 M) "read pairs" were ENA read_count values, which count each
    mate: ERR15996532 has 82,832,153 pairs in its SRA copy (R1 = R2), against
    ENA read_count 165,664,306 and base_count 24,849,645,900 = 2 x 82,832,153
    x 150. Halved for all 60 runs: 71.7-106.6 M pairs, median 86.9 M. Same
    day, staging switched from ENA (about 0.5 MB/s) to NCBI's SRA copy on AWS
    (sra-pub-run-odp): each run is downloaded as .sra, checked with
    vdb-validate, split with fasterq-dump (sra-tools 3.4.1), required to
    match ENA's read_count and base_count exactly, gzipped with pigz, and
    recorded in sra_provenance.tsv.
  source_links:
    - "https://www.ebi.ac.uk/ena/browser/view/PRJEB105019"
    - "https://www.ebi.ac.uk/metabolights/MTBLS13463"
