  - comparison_id: "resistant_vs_susceptible_28mo_500hpc"
    tissue: "whole_animal"
    life_stage: "adult"
    stressor_original: "Experimental infection by cohabitation with OsHV-1 µVar-injected donor oysters (1:1 biomass, 23 C, fed ad libitum), 28-month cohort. Libraries sampled at 500 hpc from individuals with BioSample phenotype 'Resistant' or 'Susceptible'."
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "cohabitation with injected donors at 1:1 biomass ratio"
    exposure_duration: "500 h post-cohabitation"
    exposure_timing: "500 hpc, after the infection; R and S assignment criteria not deposited"
    control_condition: "28-month-old oysters with phenotype 'Susceptible' at 500 hpc, families F14R and H2D, 6 per family (12 libraries). Reference group; not an unexposed control."
