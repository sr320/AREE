species: "Mytilus edulis"
species_identity:
  basis: collection_site
  notes: >-
    Collected from the lower intertidal of Kobbefjord, south of Nuuk, West
    Greenland, and identified as M. edulis by location. No species-diagnostic
    markers are reported for the sequenced animals.
strain_or_population: "Wild lower-intertidal population, Kobbefjord, south of Nuuk, Greenland (64°10'50.8\" N, 51°32'28.1\" W), collected August 2019; experiments at Aarhus University, Denmark. Shell length 34.7 +/- 0.13 mm."

# AREE reanalyzes against the NCBI RefSeq annotation its M. edulis crosswalk is
# built from. The authors assembled a de novo transcriptome (Trinity) and
# quantified with Bowtie2/RSEM; that pipeline is not reproduced.
genome_assembly: "xbMytEdul2.2"
annotation_version: "GCF_963676685.1-RS_2025_02"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, paired-end 150 bp, libraries prepared and sequenced by Novogene (Cambridge, UK); 38-66 M read pairs per library; 109.3 GB FASTQ reported by ENA for all 35 libraries."

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 35 libraries are public in ENA under PRJEB48959 (first public 2021-12-04), brokered from ArrayExpress E-MTAB-11178, whose BioSample attributes ('environmental stress', 'temperature') carry the design. Only the libraries in registered comparisons need staging. The authors' FPKM tables from a de novo assembly are not reused. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

