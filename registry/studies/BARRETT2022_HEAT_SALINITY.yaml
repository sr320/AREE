quality_flags:
  - raw_data_available
  - species_assignment_unverified
  - single_timepoint
  - tank_level_replication

limitations: >
  (1) Species identity. M. edulis is in the hybridizing M. edulis complex, and
  the animals were assigned by collection site, not genotyped; every record
  carries species_assignment_unverified (docs/species_identity.md).
  (2) Replication unit. Mussels were held in buckets of 10, four per
  treatment, and the five sequenced animals are one per bucket plus a fifth
  from one of the same buckets, which bucket is not recorded. Two of each
  arm's five may therefore share a bucket. Fitted on mussels with
  tank_level_replication; bucket IDs are not deposited. The authors tested
  bucket effects on mortality only (none found). (3) Pool label conflict. Every
  BioSample says "individual: mixed pool of 10 individuals", while the paper
  says 35 individual samples were extracted and sequenced (section 2.3). The
  paper is followed; the label most likely names the bucket of 10. If the
  libraries were pools, each would average 10 animals and its variance would
  be understated: check replicate dispersion before harmonizing. (4) Survivor
  sampling: only treatments with mean mortality under 25% were sequenced, and
  heated animals are survivors of 6 days of repeated exposure. (5) Repeated,
  not acute: 12 air exposures over 6 days, so this is a response with some
  acclimation, unlike CLARK2021_HEAT_GREENLAND's single 2 h shock; the pool
  spans both, and heterogeneity will show it. (6) Single tissue, single
  timepoint, one population, the same research group as its pool partner.
  (7) Reference: the RefSeq M. edulis annotation (GCF_963676685.1); Greenland
  animals, or any M. trossulus ancestry in them, will map less completely.

