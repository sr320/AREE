# SECOND REAL MUSSEL STUDY, claimed 2026-10-17 from the WP5 backlog
# (docs/candidate_studies_mussels_clams.md, pool C: Mytilus edulis heat). With
# CLARK2021_HEAT_GREENLAND it forms the first within-species mussel pool
# (k = 2) on thermal_tolerance. NOT YET RUN.
#
# Registered from deposited metadata and the publication, which is CONFIRMED:
# Barrett et al. 2022, Genes 13:155, open access (PMC8774603). Its methods
# (35 individual gill samples, seven treatments of n = 5, Illumina PE150 at
# Novogene) match the deposit (ArrayExpress E-MTAB-11178, ENA PRJEB48959).
#
# INDEPENDENCE FROM CLARK2021_HEAT_GREENLAND (checked 2026-10-17). Same
# research group (British Antarctic Survey, Aarhus University; Clark, Peck and
# Thyrring are authors of both), but different animals and experiments: these
# mussels were collected in Kobbefjord, south of Nuuk, in August 2019 and
# exposed at Aarhus; Clark's were collected in Godthåbsfjorden in summer 2018.
# Counted as independent (k = 2).
#
# DESIGN AS PUBLISHED. Intertidal mussels held 1 week at 5 C and 23 per mille
# (the collection-site salinity) with a simulated semi-diurnal tide, then
# distributed in buckets of 10 (four buckets per treatment) across 12 aquaria
# at 5, 15 or 23 per mille. Every 12 h for 6 days each bucket was exposed to
# air at 5, 30 or 33 C for 1.5 h. Mortality was scored per treatment (Nielsen
# et al. 2021); only treatments with mean mortality under 25% were sequenced
# (36 C killed every animal, and heat at 5 per mille killed over half). Five
# animals per treatment were sequenced: one from each of the four buckets plus
# a fifth chosen by shell length, all of shell length near the mean.
#
# FOUR COMPARISONS, PRESPECIFIED 2026-10-17, BEFORE ANY DATA WERE RUN.
#   heat_33c_vs_control (33 C vs 5 C air, both 23 per mille) is
#     meta_analysis_primary for thermal_tolerance: the contrast that pools with
#     CLARK2021_HEAT_GREENLAND's 32 C heat shock vs control.
#   low_salinity_15_vs_control (15 vs 23 per mille, both 5 C) is
#     meta_analysis_primary for salinity_tolerance. Different phenotype, so it
#     never enters the same pool as the heat comparison.
#   heat_30c_vs_control and very_low_salinity_5_vs_control are registered for
#     completeness and not pooled.
# CLASSIFICATION. stress_response throughout, as for CLARK2021_HEAT_GREENLAND:
# gill transcriptomes of exposed vs unexposed animals, no animal's own
# tolerance scored. Survival was measured per treatment, not per sequenced
# animal.
# Sample-sheet condition levels combine the BioSample attributes
# "environmental stress" (salinity) and "temperature" (air temperature, C).
# ---------------------------------------------------------------------------

