# Real proteomics study: whole flesh of triploid juvenile Pacific oysters 2
# days after intramuscular injection with a high or a low load of OsHV-1
# uVar, Coomassie 2-DE. Registered from PRIDE PXD000905 and the authors'
# accepted manuscript on Ifremer Archimer (doc 00199/31035), Corporeau et al.
# 2014, J Proteomics 109:176-187. The published version is not open access.
#
# REGISTERED, NOT HARMONIZED (2026-10-17, sr320). The same situation as
# HARNEY2016_OA_WARM_LARVAE (P1):
#   - Spot volumes were quantified from gel images in Progenesis SameSpots
#     (one gel per oyster, 5 per group). Neither images nor volumes were
#     deposited. PRIDE holds only the nanoLC-MS/MS identification runs of the
#     25 excised spots (Bruker .yep, named <spot><source gel>, e.g. 337CA61),
#     so nothing can be requantified.
#   - The paper reports an average fold change for the 25 spots that passed
#     SameSpots p < 0.05, with no per-spot p value, no SE and nothing for
#     the other spots. Several spots hold more than one co-migrating protein.
#   - Proteins carry 2012 UniProt C. gigas accessions (K1..._CRAGI), most of
#     which UniProtKB has since deleted (see HARNEY2016_OA_WARM_LARVAE).
# Decision: register with qc_status and analysis_status not_started,
# results_file null; Tables 2-3 not transcribed.
#
# DESIGN NOTES worth keeping. Each load was injected into 3 x 40 oysters in
# 20 L tanks. The 5 proteomic oysters per group came from two tanks each
# (high: tanks 1-2; low: tanks 4-5) and were chosen for extreme OsHV-1 DNA
# (the highest challenged, the lowest controls; paper Table 1), so the
# contrast is "heavily infected vs uninfected" rather than injection load
# alone. The spot runs' source gels (oysters 34, 37, 38, 42, 61, 67, 73, 79)
# match Table 1.

study_id: CORPOREAU2014_OSHV_LOAD
simulated: false

accessions:
  doi: "10.1016/j.jprot.2014.06.030"
  bioproject: null
  geo: null
  sra: null
  ena: null
  proteomexchange: "PXD000905"
  other: "Archimer 00199/31035 (accepted manuscript)"

citation: "Corporeau C, Tamayo D, Pernet F, Quere C, Madec S (2014) Proteomic signatures of the oyster metabolic response to herpesvirus OsHV-1 uVar infection. J Proteomics 109:176-187. https://doi.org/10.1016/j.jprot.2014.06.030 (PMID 25009143). Accepted manuscript: https://archimer.ifremer.fr/doc/00199/31035/. Proteomics: PRIDE PXD000905."

species: "Magallana gigas"
strain_or_population: "Triploid, 8 months old, from a farming area in Aber Benoit (northern Brittany, France) with no recorded mortality; collected March 2009 and held at the Ifremer station in Plouzane."

# Identified against UniProt C. gigas entries (2012 oyster_v9 proteome); most
# of those accessions are now deleted. This records the annotation a mapping
# would target.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["proteomics"]
analysis_mode: "processed_results_harmonization"
platform: "Coomassie-stained 2-DE (IEF pH 3-10, 11 cm; 8-16% SDS-PAGE), one gel per oyster (the paper also mentions 2 technical replicates per analysis); image analysis in Progenesis SameSpots 1.5. Spot identification by nanoLC-ESI-MS/MS on a Bruker HCT Ultra PTM Discovery ion trap, ProteinScape 2.1 / Mascot against UniProt C. gigas."

data_availability:
  raw_data_available: false
  processed_data_available: true
  status: "available"
  access_notes: "PRIDE PXD000905 (COMPLETE, EBI terms of use): 25 Bruker .yep identification runs of excised spots with Mascot results, peak lists and mzTab; no gel images or spot volumes, so raw_data_available is false for quantification. Processed results: paper Tables 2-3 (25 significant spots, average fold change, co-migrating proteins), in the publisher version (not open access) and the accepted manuscript on Ifremer Archimer. Not transcribed. Details in data/studies/CORPOREAU2014_OSHV_LOAD/pride_provenance.json."

qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# ONE COMPARISON, the paper's: high-load vs low-load injected oysters at 2 dpi,
# 5 vs 5, one gel each. Flagged primary before any analysis (no effect while
# results_file is null).
#
# PHENOTYPE. OsHV-1 DNA at 2 dpi about 10,000 times higher in high-load
# oysters (the proteomic oysters: mean 1.4e6 vs 0.9 copies per ng DNA, Table
# 1), and mortality 9/60 by 6 dpi vs 1/60 for low load. Recorded as
# pathogen_load, increase (disease).
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "oshv1_high_load_vs_low_load_2dpi"
    tissue: "whole_animal"
    life_stage: "juvenile"
    stressor_original: "Intramuscular injection (adductor, under MgCl2 anaesthesia) of 100 uL filtered tissue homogenate carrying 2 x 10^9 (high load, from moribund broodstock) or 4 x 10^6 (low load, from healthy animals) OsHV-1 uVar genome copies; 3 x 40 oysters per load in 20 L tanks at 20 C; sampled 2 days post-injection. Proteomic oysters chosen for the highest (high load) or lowest (low load) OsHV-1 DNA."
    stressor_standardized: "pathogen_challenge"
    exposure_intensity: "2e9 vs 4e6 OsHV-1 genome copies injected"
    exposure_duration: "2 d"
    exposure_timing: "acute, before onset of mortality"
    control_condition: "Low-load injected, tanks 4-5: oysters 61, 63, 67, 73, 79 (OsHV-1 DNA 0-4.4 copies/ng)"
    treatment_condition: "High-load injected, tanks 1-2: oysters 34, 37, 38, 42, 45 (OsHV-1 DNA 5.4e4-3.8e6 copies/ng)"
    phenotype: "pathogen_load"
    phenotype_direction: "increase"
    phenotype_unit: "OsHV-1 DNA copies per ng total DNA (qPCR); mortality 9/60 vs 1/60 at 6 dpi"
    resilience_classification: "disease"
    sample_size: 10
    biological_replicates: 5
    results_file: null
    meta_analysis_primary: true

quality_flags:
  - processed_only
  - tank_level_replication
  - single_timepoint
  - identifier_mapping_uncertain

limitations: >
  (1) No quantitative proteomic data were deposited: no gel images or spot
  volumes, only identification runs of the 25 excised spots, so the study
  cannot be reanalyzed. (2) The paper reports average fold changes for the
  25 spots selected at p < 0.05, with no per-spot statistics and nothing on
  the other spots; several spots contain more than one protein. Not
  transcribed or harmonized. (3) Proteomic oysters were selected for extreme
  OsHV-1 DNA, so the contrast is infected vs uninfected animals, not load
  alone; they came from two of three tanks per load. (4) 2012 UniProt
  accessions, mostly deleted since. (5) Triploid juveniles, whole flesh, one
  time point.

