# Real metabolomics study: 16 days of starvation vs ad libitum feeding before
# OsHV-1 µVar cohabitation challenge. Starvation reduced POMS mortality in
# both families, and that survival was measured in the same tanks.
#
# Registered from the MetaboLights ISA-Tab of MTBLS13313 (public 2025-11-14,
# CC0) and the published paper, Duperret et al. 2025, iScience 29:114333
# (PMID 41541659, open access PMC12803857).
#
# THE PROCESSED TABLES ARE EMPTY, as in DECICOMP2025_POMS_AGE. The four
# Metabolite Assignment Files list 328 metabolites but hold no abundance
# values. Only Agilent targeted-dMRM raw files (.d, zipped) are deposited, and
# no AREE workflow reads them. Nothing can be harmonized yet.
#
# DIET IS FULLY CONFOUNDED WITH MS BATCH. On all four platforms the fed and
# starved samples were acquired in separate runs months apart, with no
# overlap. Fed samples ran Dec 2023 to Feb 2024; starved samples ran May to
# June 2024 (see ms_batches_by_diet in metabolights_provenance.json). A
# fed-vs-starved difference in these data cannot be separated from
# instrument drift or batch. This is the main reason the study should not
# contribute to a pooled estimate without an explicit batch caveat.
#
# The same experiment's RNA-seq (ENA PRJEB86618 starved, PRJEB86525 fed) is
# registered and reanalyzed as DUPERRET2025_STARVE_RNASEQ (PR #23, merged
# 2026-10-13). Its primary comparison, starved_vs_fed_0hpc, is this study's
# comparison on the same tanks, so the two are the study's paired omics
# layers. That pairing will only count once this study has abundances.
# Neither RNA-seq project is listed under `accessions` here; both are
# DUPERRET2025_STARVE_RNASEQ's accessions, and the 16S data are cited only.
#
# MERGED AS A REGISTRATION (2026-10-13), not analyzable: the MAFs are still
# empty. Re-fetched 2026-10-13: the GM MAF is byte-identical to the registered
# copy (still 0 abundance values), and the MetaboLights files API lists the
# same four MAFs. The other three MAFs could not be re-fetched (EBI FTP
# unreachable that day).

study_id: DUPERRET2025_POMS_STARVE
simulated: false

accessions:
  doi: "10.1016/j.isci.2025.114333"
  bioproject: null
  geo: null
  sra: null
  ena: null
  proteomexchange: null
  other: "MTBLS13313"

citation: "Duperret L, Valdivieso A, Petton B, Morga B, Faury N, de Lorgeril J, Corporeau C, Degremont L, Allienne JF, Henry S, Turtoi A, Pouzadoux J, Romatif O, Courtay G, Monaco CJ, Toulza E, Lagorce A, Pernet F, Vidal-Dupiol J, Mitta G (2025) Food deprivation enhances disease resistance: Underlying mechanisms in oysters confronted with Pacific oyster mortality syndrome. iScience 29(1):114333. https://doi.org/10.1016/j.isci.2025.114333 (PMID 41541659). Metabolomics: MetaboLights MTBLS13313 (CC0). Same experiment: RNA-seq ENA PRJEB86618 (starved) and PRJEB86525 (fed), registered as AREE study DUPERRET2025_STARVE_RNASEQ; 16S PRJEB86589/PRJEB86519; umbrella BioProject PRJEB86647 (Ifremer DECICOMP)."

species: "Magallana gigas"
strain_or_population: "Ifremer first-generation full-sib families F11N and F14R (produced 11 May 2020 from G0 families F11 and F14, whose parents were wild Dellec oysters; both G0 families highly POMS-susceptible). Pathogen-free recipients, 3 months old at the start of the diet treatment (9 Aug 2020)."

# Metabolomics is not aligned to a genome; see DECICOMP2025_POMS_AGE. The
# validator requires a known assembly, so this records the annotation any
# metabolite -> enzyme-gene link would use. The paper's KEGG mapping used the
# crg (C. gigas) organism code.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["metabolomics"]
analysis_mode: "raw_reanalysis"
platform: "Targeted metabolomics on four platforms: (1) general metabolites (GM), Agilent 1290 Infinity II UHPLC, Discovery HS F5, Agilent 6495 triple quadrupole, dynamic MRM (111 metabolites listed); (2) nucleotides (NUCs), InfinityLab Poroshell HPH-C18, 6495 (21); (3) polyunsaturated fatty acids and oxylipins (PUFAs), Kinetex C8, 6495 (183); (4) TCA-cycle intermediates, Agilent 8890 GC with 5977B MSD, methoxyamine/MSTFA derivatization (13, including the d27-myristic acid internal standard). The paper reports 148 detected metabolites."

data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "MetaboLights MTBLS13313 is public under CC0 1.0. Vendor raw files (Agilent .d, zipped) are under FILES/RAW_FILES/{GM_RAW,NUCs_RAW,PUFAs_RAW,TCA_RAW}/, one per sample per platform (192 files). The four MAFs name 328 metabolites but contain no abundance values; checked 2026-10-11, and the GM MAF re-checked unchanged 2026-10-13. No metabolite has a database identifier or MSI reliability level. The authors' processed data (internal-standard normalized, IQR filtered, quantile normalized, log10 in MetaboAnalystR 4.0.0) are described in the paper but are not in MetaboLights; check the paper's supplementary tables before re-integrating raw files."

qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# DESIGN AS DEPOSITED. 48 samples = 2 families (F11N, F14R) x 2 diets
# (fed ad libitum, code 3; starved, code 5) x 4 times (0, 3, 6, 12 hpc) x 3.
# Sample IDs are <family>-<diet code>-<hpc>-<replicate>.
#
# THE SAMPLE UNIT IS A POOL. Per the paper, each sample is a pool of 10 live
# oysters from one tank and one family, and each diet had three 400-L tanks
# holding both families. Replicates 1-3 are therefore the three tanks of a diet
# (inferred: the deposit does not name tanks, but nothing else gives three
# replicates). The diet was applied per tank, so the effective n is 3 tanks per
# diet. The two families share tanks, so family is a within-tank factor, not a
# replicate.
#
# PHENOTYPE. Starvation lowered final POMS mortality: F14R 34.8% starved vs
# 75.5% fed; F11N 93.3% vs 100% (log-rank P < 0.05 for both). Onset was also
# delayed (120 hpc starved vs 72/96 hpc fed). This was measured on the
# populations of the same tanks the pools came from, so the contrast is
# classified `resilience` on disease_resistance, direction `increase` for
# starved relative to fed. Note how uneven it is: F11N barely benefits.
#
# ONE COMPARISON. The paper's metabolomic analysis is fed vs starved at 0 hpc,
# after 16 days of diet treatment and before infection (WMCNA modules
# correlated with diet, then KEGG enrichment). That is the only metabolomic
# contrast the source reports, so it is the only one registered. The 3, 6 and
# 12 hpc samples are deposited and listed in samplesheet.tsv for any later
# diet x infection-time analysis.
# ---------------------------------------------------------------------------
comparisons:
  - comparison_id: "starved_vs_fed_0hpc"
    tissue: "whole_animal"
    life_stage: "spat"
    stressor_original: "Food deprivation: food supply stopped for 16 days (acclimation) at 23 C before OsHV-1 µVar cohabitation challenge, versus ad libitum feeding (1,500 µm3/µL Tisochrysis lutea + Skeletonema costatum, 50/50). Challenge: cohabitation with OsHV-1 µVar-injected donors at 1:1 biomass, flow stopped for the first 125 hpc."
    stressor_standardized: "nutritional_limitation"
    exposure_intensity: "complete food deprivation (food supply stopped)"
    exposure_duration: "16 d before challenge"
    exposure_timing: "sampled at 0 hpc: end of the 16 d diet treatment, start of cohabitation, before infection"
    control_condition: "Fed ad libitum, 3 tanks, families F11N and F14R, one pool of 10 oysters per tank x family at 0 hpc (6 samples)"
    treatment_condition: "Starved for 16 d, 3 tanks, families F11N and F14R, one pool of 10 oysters per tank x family at 0 hpc (6 samples)"
    phenotype: "disease_resistance"
    phenotype_direction: "increase"
    phenotype_unit: "percent_survival_post_challenge (final mortality per family x diet: F14R 34.8% starved vs 75.5% fed; F11N 93.3% vs 100%)"
    resilience_classification: "resilience"
    sample_size: 12
    biological_replicates: 3
    results_file: null
    meta_analysis_primary: true

quality_flags:
  - raw_data_available
  - tank_level_replication
  - low_replication
  - single_timepoint
  - identifier_mapping_uncertain

limitations: >
  (1) MS batch is fully confounded with diet on all four platforms. Fed
  samples were acquired Dec 2023 to Feb 2024 and starved samples May to June
  2024, in separate runs, so the diet effect cannot be separated from batch
  or instrument drift. Internal-standard and quantile normalization reduce
  but do not remove this. AREE has no quality flag for batch confounding
  yet; it is recorded here. (2) No usable processed data: the MAFs hold no
  abundance values, and the raw files are vendor targeted-MRM data that no
  AREE workflow reads. (3) Replication is 3 tanks per diet. Each sample is
  a pool of 10 oysters, so between-oyster variance is averaged away and the
  replicate unit is the tank (replicate = tank is inferred). (4) Starvation
  is a strong physiological manipulation. Metabolite differences at 0 hpc
  will mostly reflect fasting itself (metabolic depression), not resistance
  mechanisms. The comparison associates metabolites with a treatment that
  raised survival; it does not identify resistance markers that would
  generalize to fed animals. (5) The resistance effect is family-dependent:
  large in F14R, marginal in F11N (93.3% vs 100% mortality). Pooling
  families dilutes it. (6) The F14R family and the 2020 Ifremer production
  are shared with DECICOMP2025_POMS_AGE (MTBLS13463), and that study's MAFs
  carry this study's sample columns. If the fed arm here shares a challenge
  trial with DECICOMP's 4-month cohort, the two studies are not independent.
  Confirm before pooling them. The RNA-seq arm (DUPERRET2025_STARVE_RNASEQ)
  shares this study's tanks, so it is convergent evidence, not replication.
  Its 0 hpc diet contrast calls 38% of genes DE, mostly fasting response,
  and this study's metabolites will share that interpretation. (7) Targeted
  panel of about 330 metabolites
  with no database identifiers or MSI levels in the deposit. Mapping is
  held at unresolved.

