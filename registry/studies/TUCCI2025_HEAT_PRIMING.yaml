    Claimed with `aree start-study --accession PRJNA1132140 --study-id
    TUCCI2025_HEAT_PRIMING`. Sample sheet and FASTQ manifest generated from
    live ENA metadata with `aree fetch-samplesheet --bioproject PRJNA1132140
    --study TUCCI2025_HEAT_PRIMING --condition-attribute Treatment
    --condition-attribute "Thermal stress" --attribute Clam_ID
    --library-strategy RNA-Seq`. The --library-strategy option is from PR #40
    (WP5), not yet on main when this was generated; the provenance records the
    filter (kept RNA-Seq; 40 RNA-Seq and 40 AMPLICON runs before filtering).
    Regenerate from main once #40 merges. TAG-SEQ: the run configuration sets
    tag_seq = true (PR #24, merged into this branch 2026-10-12). LIBRARY-STRATEGY CHECK: unlike
    LUTIER2022_OA_TIPPING, the AMPLICON label here is correct. The 40
    AMPLICON runs are paired-end with their own BioSamples; the 40 RNA-Seq
    runs are single-end, 76 bp, 5.5-16.5 M reads, matching the paper's 75 SE
    3' Tag libraries and its 16S V3-V4 250 bp paired-end amplicons.
    REPLICATION CHECK: 40 distinct BioSamples and 40 distinct Clam_ID values
    (Naive_noHW_1-10, Naive_HW_1-10, Primed_noHW_1-10, Primed_HW_1-10), 10
    per group, matching the paper's 10 clams per group. Tank membership is
    not recorded (limitation 2). Distinct names do not prove distinct
    animals: run scripts/check_replicate_dispersion.py after quantification.
    MAPPING: tissue 'digestive gland' (paper, RNAseq analyses) maps to
    digestive_gland; 'Adult individuals' maps to adult. The reference bundle
    for GCF_026571515.1 was fetched and verified with `aree fetch-reference`
    on 2026-10-12: 65,336 transcripts, 47,388 genes, all of them in
    rphil_gene_id_crosswalk.tsv, and the GTF names the registered release.
    PUBLICATION: found by PubMed search for the design; the article's data
    availability names PRJNA1132140. A follow-up from the same group (Martino
    et al. 2026, ISME Commun, doi:10.1093/ismeco/ycag059) transplants primed
    microbiomes; its data appear to be PRJNA1292094 (not checked) and it is a
    separate experiment.
