citation: "Harney E, Artigaud S, Le Souchu P, Miner P, Corporeau C, Essid H, Pichereau V, Nunes FLD (2016) Non-additive effects of ocean acidification in combination with warming on the larval proteome of the Pacific oyster, Crassostrea gigas. J Proteomics 135:151-161. https://doi.org/10.1016/j.jprot.2015.12.001 (PMID 26657130). Accepted manuscript: https://archimer.ifremer.fr/doc/00299/40985/. Proteomics: PRIDE PXD002316."

species: "Magallana gigas"
strain_or_population: "Two-year-old adults from the Ifremer Argenton hatchery conditioning program, held at the Ifremer Plouzané laboratory from July 2013 (Bay of Brest water). One cross: oocytes of 5 females pooled and fertilized with sperm of 4 males, then split equally among the 12 tanks."

# Spots were identified against the 2012 UniProt C. gigas reference proteome
# (UP000005408, April 2014 release), built on the oyster_v9 assembly that
# AREE does not register. Most of those accessions are now deleted; the two
# that survive carry NCBI GeneIDs in the current annotation. This records the
# annotation any mapping would target. See identifier_mapping_uncertain.
genome_assembly: "GCF_963853765.1"
annotation_version: "GCF_963853765.1-RS_2024_06"

assay_type: ["proteomics"]
analysis_mode: "processed_results_harmonization"
platform: "Coomassie-stained 2-DE (IEF pH 3-10 on IPGphor3, 12% SDS-PAGE, 15 x 15 cm gels, 500 ug protein), one gel per tank; image analysis in Progenesis SameSpots v3.3. Spot identification by nanoLC-MS/MS on an LTQ-Orbitrap XL, Mascot 2.2.07 / Proteome Discoverer 1.2 against UniProt UP000005408 (April 2014), 1% FDR."

data_availability:
  raw_data_available: false
  processed_data_available: true
  status: "available"
  access_notes: "PRIDE PXD002316 (COMPLETE submission, EBI terms of use): 22 .RAW identification runs of excised spots with Mascot results, peak lists and mzTab; no gel images or spot volumes, so raw_data_available is false for quantification. Processed results: paper Table 2 (12 significance-selected spots x 5 contrasts, fold change and P only), in the publisher version (not open access) and the accepted manuscript on Ifremer Archimer. Not transcribed. Details in data/studies/HARNEY2016_OA_WARM_LARVAE/pride_provenance.json."

# Registered only; see the header. Nothing was QC'd or harmonized.
qc_status: "not_started"
analysis_status: "not_started"

# ---------------------------------------------------------------------------
# FIVE COMPARISONS, the paper's Table 2 contrasts, so the registry shows what
# the study tested. sample_size 6 = 3 tanks per arm, one gel per tank.
#
# PHENOTYPE. Size (area) and calcification (birefringence) of 30-50 D-larvae
# per tank at 40 h, from the same tanks. The paper tested larvae as units
# (Kruskal-Wallis, Dunn tests vs control and warm-acidified vs warm only):
# acidified smaller than control (z = -8.58), warm larger (z = 3.15),
# warm-acidified not different in size (z = 1.05); calcification higher in
# warm (z = 8.61) and warm-acidified (z = 6.59) than control, lower in
# warm-acidified than warm (z = -2.44), acidified not different (z = -1.31).
# Directions below follow those tests; where the paper made no test the
# direction is not_applicable. Classifications stay at the ontology default.
#
# meta_analysis_primary: acidified vs control at 20 C, the single-stressor OA
# contrast comparable with other OA studies, chosen before any result was
# examined. It carries no results, so the flag has no effect until data exist.
# ---------------------------------------------------------------------------
