# Real proteomics study: Pacific oyster D-larvae reared 40 h under ocean
# acidification (pH 7.9 vs 8.1) crossed with warming (22 vs 20 C), 3 tanks per
# treatment, Coomassie 2-DE. Registered from PRIDE PXD002316 and the authors'
# accepted manuscript on Ifremer Archimer (doc 00299/40985), Harney et al.
# 2016, J Proteomics 135:151-161. The published version is not open access.
#
# REGISTERED, NOT HARMONIZED (2026-10-17). The design is sound (12 tanks, 3 per
# treatment, one pooled cross split among them), but the data needed for a
# reanalysis or a usable evidence record were never deposited:
#   - Spot volumes were quantified from 16-bit gel images in Progenesis
#     SameSpots (one gel per tank). Neither images nor volumes are public.
#     PRIDE holds only the LC-MS/MS identification runs of excised spots
#     (22 runs, named by SameSpots spot number), so there is nothing to
#     requantify.
#   - The only quantitative result is the paper's Table 2: fold change,
#     direction and SameSpots ANOVA P for 12 spots, chosen from about 650 per
#     gel because they reached P < 0.02 in at least one contrast. No standard
#     error, no multiple-testing correction, and nothing for the other ~638
#     spots. Such records could not enter a pooled estimate and would carry
#     only selected directions.
#   - 9 of the 11 C. gigas UniProt accessions behind the 12 spots have been
#     deleted from UniProtKB ("not part of a reference proteome"); only
#     actin-2 (K1QWP8 -> GeneID 105340468) and GAPDH (K1Q350 -> 105340512)
#     still resolve to AREE gene IDs.
# Decision (2026-10-17, sr320): register for the record with qc_status and
# analysis_status not_started and every results_file null; do not transcribe
# or harmonize Table 2. pride_provenance.json records the PRIDE files, the
# manuscript checksum and each spot's UniProt status (build_provenance.py).
# If the SameSpots volumes or gel images are ever released, this becomes a
# tank-replicated OA x warming proteomic study worth reanalyzing.
#
# PRIDE's project description still reports the pre-revision analysis
# (22 spots, 18 proteins, P < 0.05); the paper reports 12 spots at P < 0.02.
# The PRIDE spot numbers (266_178 etc.) cannot be matched to the paper's spot
# numbers 1-12 without the annotated gel (paper Fig. 3).

