  - tank_level_replication

limitations: >
  (1) No quantitative proteomic data were deposited: spot volumes and gel
  images are not public, so the study cannot be reanalyzed. (2) The only
  published results are for 12 of about 650 spots, selected because they
  reached SameSpots ANOVA P < 0.02 in at least one contrast, with fold change
  and P but no standard error and no multiple-testing correction. The other
  spots are unreported, so any record from Table 2 would show only selected
  directions; it is not transcribed or harmonized. (3) 9 of 11 spot
  accessions are deleted from UniProtKB; only actin-2 and GAPDH map to AREE
  gene IDs. Two spots (5, 6) are the same protein (severin) at different pI.
  2-DE spots are protein species, not genes. (4) Each treatment's three tanks
  were fed from one treatment header tank (water chain: 22 C header -> 20 C
  and acidified headers -> a second, cooled acidified header), so
  treatment is confounded with its water supply; tanks are separate units for
  the larvae. (5) Phenotype statistics treat individual larvae as units
  (30-50 per tank) rather than tanks, so their P values are anticonservative.
  (6) One cross (5 females x 4 males) and one 40 h time point.

