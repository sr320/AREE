  - comparison_id: "ph7_9_vs_ph8_1_at_20c"
    tissue: "whole_animal"
    life_stage: "larva"
    stressor_original: "Reduced pH: seawater acidified by CO2 bubbling (header-tank CO2 reactor) to pH 7.87 +/- 0.05 at 19.8 +/- 0.3 C ('acidified') versus pH 8.06 +/- 0.06 at 19.9 +/- 0.4 C ('control'); 5 L open-flow tanks, 80 mL/min, from 90 min post-fertilization to 40 h."
    stressor_standardized: "ocean_acidification"
    exposure_intensity: "pH 7.87 vs 8.06 (about -0.2 pH units)"
    exposure_duration: "40 h"
    exposure_timing: "from fertilization through the D-veliger stage"
    control_condition: "Control: pH 8.06, 19.9 C, 3 tanks"
    treatment_condition: "Acidified: pH 7.87, 19.8 C, 3 tanks"
    phenotype: "acidification_tolerance"
    phenotype_direction: "decrease"
    phenotype_unit: "D-larva size (area, um2) at 40 h: smaller under acidification (Dunn z = -8.58); birefringence not different (z = -1.31); larvae tested as units"
    resilience_classification: "resilience"
    contrast_type: "exposure_response"
    sample_size: 6
