  registered_by: "sr320"
  date_registered: "2026-10-11"
  curation_notes: >
    Claimed with `aree start-study --accession PRJEB18614 --study-id
    PAYTON2017_HAB_AMINUTUM` (draft PR sr320/AREE#32). Uses the
    toxicant_tolerance phenotype added by sr320/AREE#31; this branch contains
    that commit until #31 merges. Sample sheet from live ENA metadata with
    `aree fetch-samplesheet --label-field run_accession` (each run its own
    sample_id) and `--condition-attribute "growth condition"`: 52 runs, 26 per
    diet, two runs per BioSample, which are the two sequencing lanes of one
    pooled library (paper methods). replicate_unit = sample_accession sums the
    lanes. All 26 libraries are used, as in the paper's own DE analysis (an
    earlier reanalysis in sr320/AREE-co dropped both day-2 ZT 8.5 pools by its
    own QC rule; AREE does not, without an author-stated reason).
    meta_analysis_primary is set on the study's only comparison; there is no
    other real HAB study to pool with yet. 2026-10-17: merged as a
    registration with the run pending (status fields set from in_progress to
    not_started, since no run is under way).
