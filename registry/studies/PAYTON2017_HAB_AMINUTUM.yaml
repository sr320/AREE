data_availability:
  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 52 runs are public in ENA (PRJEB18614) / ArrayExpress (E-MTAB-5345). Diet is the ENA sample attribute `growth condition`; sampling time is only in the ArrayExpress SDRF, committed here as E-MTAB-5345.sdrf.txt. Sequence data are not committed."

qc_status: "not_started"
analysis_status: "not_started"

comparisons:
  - comparison_id: "alexandrium_vs_heterocapsa_6d"
    tissue: "gill"
    life_stage: "adult"
    stressor_original: "Continuous feeding on the PST-producing dinoflagellate Alexandrium minutum (strain AM89BM), ~400 cells/mL in tanks, 'mimicking a realistic HAB', for 6 days; control fed the non-toxic dinoflagellate Heterocapsa triquetra (strain HT99PZ) at matched supply (Payton et al. 2017); ENA growth condition 'Alexandrium minutum' / 'Heterocapsa triquetra'"
    stressor_standardized: "harmful_algal_bloom"
    exposure_intensity: "A. minutum 430.9 ± 160.8 cells/mL measured in tanks (1.3 pg saxitoxin per cell), vs H. triquetra 159.1 ± 15.7 cells/mL; gill PST burden 95.8 ± 13.5 ng STX eq/g"
    exposure_duration: "6 days; gill sampled during the last 52 h"
    exposure_timing: "sampled every 4 h over 52 h (13 times, Zeitgeber time) on days 5-6 of exposure; times pooled as replicates"
    control_condition: "Heterocapsa triquetra (non-toxic dinoflagellate) diet; 3 tanks; 13 pooled libraries (6 oysters each), one per sampling time"
    treatment_condition: "Alexandrium minutum (PST-producing) diet; 3 tanks; 13 pooled libraries (6 oysters each), one per sampling time"
    phenotype: "toxicant_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
    resilience_classification: "stress_response"
    sample_size: 26
    biological_replicates: 13
    meta_analysis_primary: true
    results_file: null

quality_flags:
  - raw_data_available
  - tank_level_replication   # each library pools a diet's three tanks; tank variance is absent from lfcSE

limitations: >
  (1) Treatment was applied per tank (three per diet), but every library
  pools animals from all three tanks of its diet, so tank-to-tank variation is
  not in the error term and lfcSE is somewhat anti-conservative; the 13
  libraries per diet differ in animals and time of day, not tank. (2)
  Libraries pool six oysters. (3) Sampling times are pooled as replicates;
  circadian variation, which the paper shows is large and is itself changed
  by A. minutum, adds variance and can make a time-specific effect look
  smaller. (4) No tolerance outcome was measured: the comparison describes
  the response to a realistic toxic bloom, not which oysters cope with it.
  (5) The control alga differs from A. minutum in more than toxicity, and
  its measured density in tanks was lower.

