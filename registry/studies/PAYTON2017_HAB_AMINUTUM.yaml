# Harmful algal bloom exposure: adult gill after 6 days on the paralytic-
# shellfish-toxin (PST) producer Alexandrium minutum vs a non-toxic
# dinoflagellate. AREE's FIRST harmful_algal_bloom STRESSOR. Chosen
# 2026-10-11 from the RNA-seq studies the sister repository sr320/AREE-co had
# curated; not in candidate_studies.md.
#
# Source: Payton et al. 2017, Sci Rep (open access, PMC5471176); data
# ArrayExpress E-MTAB-5345 = ENA PRJEB18614. Methods read in full 2026-10-11.
# The paper's subject is the circadian transcriptome; AREE uses only its
# diet contrast, as the paper's own differential-expression analysis did
# ("considering the 13 sample times ... of each algal treatment as
# replicates").
#
# REPLICATION, AND ITS LIMIT. 156 oysters in six tanks, three per diet. During
# the last two days, gill of six oysters per diet was taken every 4 h for
# 52 h and pooled per diet and time: 13 libraries per diet, each pooling
# animals from that diet's three tanks, each sequenced on two lanes. So the
# replicates DESeq2 sees are the 13 libraries (lanes summed with
# replicate_unit = sample_accession), which are different animals at
# different times of day. Every library contains the same three tanks, so
# tank-to-tank variation never enters the error term: lfcSE is somewhat too
# small, in the way LUTIER2022's would have been without pseudo-bulking. The
# libraries cannot be assigned to tanks, so this cannot be fixed; it is
# flagged (tank_level_replication) and limits how much weight the study
# should carry. Time-of-day is balanced between diets but not modelled.
#
# PHENOTYPE. Exposure is confirmed (gill PST 95.8 ± 13.5 ng STX eq/g in the
# A. minutum group, none in controls) and valve behaviour changed (daytime
# valve-opening rose from 20.6% to 38.0%), but no tolerance outcome was
# measured. So toxicant_tolerance is the axis and the comparison is
# stress_response, overriding the ontology default.
#
# MERGED AS A REGISTRATION (2026-10-17), RUN PENDING. The sample sheet, FASTQ
# manifest and run configuration are ready, but the RNA-seq workflow has not
# been run: no results, manifests or reports are committed, results_file is
# null, and both status fields are not_started. Run it in a follow-up study
# PR from a fresh `aree start-study`-style branch.

