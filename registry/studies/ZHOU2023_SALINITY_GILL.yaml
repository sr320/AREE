# FIRST REAL HARD CLAM (Mercenaria mercenaria) STUDY, claimed 2026-11-27 on
# Pori from the WP5 backlog (docs/candidate_studies_mussels_clams.md, Tier 1 B:
# hard clam salinity, PRJNA975821). It is the first of three independent hard
# clam salinity studies listed there (with PRJNA1159784 and PRJNA1288005), so
# the hyposalinity pool opens at k = 1.
#
# PUBLICATION: Zhou C, Yang M-J, Hu Z, et al. (2023) Mar Environ Res 192:106198,
# doi 10.1016/j.marenvres.2023.106198 (PubMed 37757610). Not in PMC; only the
# abstract was read, so exposure durations are left null.
#
# DESIGN AS DEPOSITED (BioSample attributes and sample aliases, checked
# 2026-11-27). One-year-old hard clams from Tianjin, China, held at 20 C;
# gill. Seven groups, three libraries each: NS (30 psu control), acute
# short-term hyposalinity AL1 and AL5 (10 psu), acute short-term
# hypersalinity AH1 and AH5 (45 psu), chronic long-term hyposalinity CL
# (10 psu) and chronic long-term hypersalinity CH (45 psu). Every alias agrees
# with its deposited store_cond salinity. The 1 and 5 in the acute aliases are
# probably sampling times (unit not deposited).
#
# POOLED LIBRARIES: every BioSample says "3 individuals pooled into one
# sample". The unit of replication is the pool: n = 3 pools (9 clams) per
# group. sample_size counts libraries, as for LI2018_HEAT_TIDAL.
#
# TWO COMPARISONS, PRESPECIFIED 2026-11-27, BEFORE ANY DATA WERE DOWNLOADED.
#   chronic_hyposal_10_vs_30psu (CL vs NS) is meta_analysis_primary: the
#   backlog plan pools one hyposalinity comparison per hard clam study, and
#   the chronic arm is the closest match to PRJNA1159784 (three months at 15
#   vs 25 ppt).
#   chronic_hypersal_45_vs_30psu (CH vs NS) is secondary.
# The four acute groups (12 runs) are not downloaded yet: their timing is not
# deposited and the paper's methods were not available. Add them as further
# comparisons once the sampling times are confirmed.
#
# RESULTS (reanalysed on Pori 2026-11-27, DESeq2 ~condition, 3 vs 3 pools):
#   chronic_hyposal_10_vs_30psu: 3,036 of 32,727 genes at padj < 0.05
#   (1,722 up).
#   chronic_hypersal_45_vs_30psu: 12,716 of 32,572 (6,189 up), 39% of tested
#   genes. CH pools correlate at 0.98 with each other (NS 0.94-0.96) and CH
#   alone separates on PC1 (54% of variance), so the hypersaline response is
#   large; pooling also shrinks lfcSE (limitation 1).
#   2,057 genes are significant in both, 1,783 (87%) in the same direction.
#   Autophagy-annotated genes significant under hypersalinity are mostly up
#   (10 of 12), in line with the paper's abstract. Salmon mapping 69.9-73.2%;
#   replicate dispersion passes in all three groups.
# ---------------------------------------------------------------------------

