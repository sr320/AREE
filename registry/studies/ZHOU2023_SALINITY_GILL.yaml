annotation_version: "GCF_021730395.1-RS_2023_01"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000, paired-end; 52.5 GB FASTQ reported by ENA for all 21 runs, about 20-27 M read pairs per run."

