  raw_data_available: true
  processed_data_available: false
  status: "available"
  access_notes: "Raw paired-end FASTQ for all 21 libraries are public in ENA/SRA under PRJNA975821. No processed results are deposited with the BioProject. Sample sheet and FASTQ manifest with ENA MD5s were generated from ENA metadata; sequence data are not committed."

qc_status: "in_progress"
analysis_status: "in_progress"

