quality_flags:
  - raw_data_available
  - low_replication
  - single_timepoint
  - ambiguous_phenotype_definition

limitations: >
  (1) Pooled libraries. Each library pools the gills of 3 clams, so n = 3
  pools per group. Pooling averages out individual variation, which makes
  lfcSE smaller than three single animals would give.
  (2) Exposure durations, transfer rate and housing are not deposited and
  only the abstract was read; the fields are left null rather than guessed.
  (3) Exposure only. The paper reports free amino acid content and autophagy
  activity, not survival or another tolerance outcome on the sequenced
  animals, so the comparisons are salinity responses, not tolerance.
  (4) Housing is not deposited. If each salinity was one tank, group is
  confounded with tank and significance is an upper bound; add
  tank_level_replication if the methods show this.
  (5) The two comparisons share the NS control libraries, so they are not
  independent of each other.
  (6) The four acute groups (AL1, AL5, AH1, AH5) are registered in the
  sample sheet but not yet analysed.
  (7) The hypersalinity comparison calls 39% of tested genes significant.
  The response is large (CH separates on PC1), but pooled libraries and a
  very tight CH group (median dispersion 0.009) make many small shifts
  significant; rank on effect size rather than padj alone.
  (8) A few genes have |log2FC| > 10 (11 in hyposalinity, 21 in
  hypersalinity), mostly uncharacterized LOC genes near zero in one group.
  Treat these magnitudes as on/off calls, not precise fold changes.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-11-27"
  curation_notes: >
    Claimed on Pori with `aree start-study --accession PRJNA975821 --study-id
    ZHOU2023_SALINITY_GILL` (draft PR #130). Sample sheet and FASTQ manifest
    generated with `aree fetch-samplesheet --bioproject PRJNA975821 --study
    ZHOU2023_SALINITY_GILL --label-field sample_alias --label-pattern
    '^(?P<group>NS|CL|CH|AL1|AL5|AH1|AH5)_(?P<rep>[123])$'
    --condition-attribute group --attribute store_cond --attribute temp
    --attribute sieving --attribute collection_date --library-strategy
    RNA-Seq`.
    ALIAS CHECK: every alias agrees with its deposited store_cond (NS 30 psu;
    CL, AL1, AL5 10 psu; CH, AH1, AH5 45 psu); all at 20 C.
    REPLICATION CHECK: 21 distinct BioSamples, 3 per group, each recorded as
    "3 individuals pooled into one sample". Run
    scripts/check_replicate_dispersion.py after quantification.
    MAPPING: life_stage adult from BioSample host_life_stage. phenotype
    salinity_tolerance is the axis term for salinity; exposure_only because
    no outcome was measured on the sequenced animals. 10 psu is reduced
    salinity, not freshwater, so the stressor is salinity rather than
    freshwater_exposure.
    PRIMARY COMPARISON prespecified on 2026-11-27 before any data were
    downloaded (see header).
    STORAGE (Pori): raw FASTQ, Nextflow work, stage and the GCF_021730395.1
    reference bundle are on /Volumes/ST5/aree, because the omics drive is
    not mounted. The bundle was fetched fresh with `aree fetch-reference
    --assembly GCF_021730395.1`: 72,829 transcripts, 44,880 genes, all in
    mmerc_gene_id_crosswalk.tsv.
    DOWNLOAD (Pori, 2026-11-27): the 9 NS, CL and CH runs (18 files) came
    from NCBI SRA with fastq-dump 3.4.1 --split-files --skip-technical --gzip
    in two streams, each run accepted only when both mates matched ENA's
    read count (20.4-26.7 M pairs per run, all on the first attempt);
    SHA-256 of every file is in fastq_ncbi_provenance.tsv. ENA was skipped
    because its HTTPS downloads ran at about 59 KB/s on 2026-11-27, so the
    read-count check replaces the ENA MD5 check. Took 4.8 h (05:41 to 10:28).
    REANALYSIS (Pori, 2026-11-27): -profile local,workstation with the Pori
    8 GB resource override; work directory on /Volumes/ST5.
    chronic_hyposal_10_vs_30psu (24 tasks, 65 min including the Salmon index
    build) and chronic_hypersal_45_vs_30psu (23 tasks, 69 min), no failures.
    Salmon 2.8.0, fastp 1.4.0, FastQC 0.12.1, DESeq2 1.50.2 / tximport 1.38.2
    on R 4.5.3, MultiQC 1.35, Python 3.11.17 / pandas 3.0.6. Both manifests
    record design ~condition, 6 libraries, residual df 4 and no warnings.
    QC: Salmon mapping 69.9% (CH_2, SRR24733772, lowest) to 73.2% (CL_3).
    Replicate dispersion (scripts/check_replicate_dispersion.py,
    replicate_dispersion_qc.tsv) passes: median 0.015 (NS), 0.029 (CL) and
    0.009 (CH) on 5,300-6,100 genes per group. These are low, as expected
    for pools of 3 clams; distinct pools, not duplicated libraries, since
    within-group correlation of log CPM is 0.93-0.98, not about 1.
    HARMONIZED against mmerc_gene_id_crosswalk.tsv: all 32,727 (hyposalinity)
    and 32,572 (hypersalinity) records resolve exact; 28,903 and 28,731
    carry an orthogroup.
