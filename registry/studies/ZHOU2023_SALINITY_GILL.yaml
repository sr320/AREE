    tissue: "gill"
    life_stage: "adult"
    stressor_original: "'Chronic long-term hyposalinity (CL)' (paper abstract; BioProject description); BioSample store_cond 10 psu seawater vs 30 psu for the control (NS); aliases CL_1-3 vs NS_1-3."
    stressor_standardized: "salinity"
    exposure_intensity: "10 psu vs 30 psu"
    exposure_duration: null
    exposure_timing: null
    control_condition: "Gill of clams held at 30 psu, 20 C (NS_1-3); each library pools 3 clams."
    treatment_condition: "Gill of clams held long-term at 10 psu, 20 C (CL_1-3); each library pools 3 clams. Duration and transfer rate not deposited."
    phenotype: "salinity_tolerance"
    phenotype_direction: "not_applicable"
    phenotype_unit: null
