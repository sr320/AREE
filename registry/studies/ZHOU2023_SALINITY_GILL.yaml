    stressor_standardized: "salinity"
    exposure_intensity: "45 psu vs 30 psu"
    exposure_duration: null
    exposure_timing: null
    control_condition: "Gill of clams held at 30 psu, 20 C (NS_1-3); each library pools 3 clams."
    treatment_condition: "Gill of clams held long-term at 45 psu, 20 C (CH_1-3); each library pools 3 clams."
