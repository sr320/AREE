quality_flags:
  - raw_data_available
  - low_replication
  - single_timepoint
  - ambiguous_phenotype_definition

limitations: >
  (1) Pooled libraries. Each library pools the gills of 3 clams, so n = 3
  pools per group. Pooling averages out individual variation, which makes
  lfcSE smaller than three single animals would give.
  (2) Exposure durations, transfer rate and housing are not deposited and
  only the abstract was read; the fields are left null rather than guessed.
  (3) Exposure only. The paper reports free amino acid content and autophagy
  activity, not survival or another tolerance outcome on the sequenced
  animals, so the comparisons are salinity responses, not tolerance.
  (4) Housing is not deposited. If each salinity was one tank, group is
  confounded with tank and significance is an upper bound; add
  tank_level_replication if the methods show this.
  (5) The two comparisons share the NS control libraries, so they are not
  independent of each other.
  (6) The four acute groups (AL1, AL5, AH1, AH5) are registered in the
  sample sheet but not yet analysed.

