  bioproject: "PRJNA975821"
  geo: null
  sra: "SRR24733763-SRR24733783 (21 RNA-seq runs; 9 used: NS, CL, CH)"
  ena: "PRJNA975821"
  proteomexchange: null
  other: "BioSamples SAMN35344898-SAMN35344918 (one per library). PubMed 37757610."

citation: "Zhou C, Yang M-J, Hu Z, Zou Y, Shi P, Li Y-R, Guo Y-J, Song H, Zhang T (2023). Autophagy contributes to increase the content of intracellular free amino acids in hard clam (Mercenaria mercenaria) during prolonged exposure to hypersaline environments. Marine Environmental Research 192:106198. https://doi.org/10.1016/j.marenvres.2023.106198"

species: "Mercenaria mercenaria"
strain_or_population: "Tianjin, China (39.09 N 117.10 E, intertidal mudflat per BioSample); one year old, about 5 cm shell length; collected 2022-04-11. Wild or farmed origin and sex not deposited."

