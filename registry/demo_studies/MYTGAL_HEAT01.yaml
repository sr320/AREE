# SIMULATED DEMO STUDY — synthetic data, not a real publication.
#
# The first non-oyster demo study. It exists to exercise species partitioning:
# it reports the SAME demo gene identifiers, under the SAME phenotype
# (larval_viability), as the two oyster larval studies GIGAS_OA02 and
# GIGAS_LARV05, which pool hsp70 and disagree on sod1. If evidence were grouped
# by feature and phenotype alone, this study would join those pools and change
# them. Grouped by species_taxid as AREE does, it forms its own Mytilus
# partition and leaves every oyster result unchanged (tests/test_demo_species.py).
#
# Real NCBI GeneIDs are never shared between species; reusing the demo
# crosswalk's identifiers here is a deliberate, demo-only device.
study_id: MYTGAL_HEAT01
simulated: true

accessions:
  doi: null
  bioproject: null
  geo: null
  sra: null
  ena: null
  proteomexchange: null
  other: null

citation: "[SIMULATED] Demo RNA-seq dataset representing heat stress in Mediterranean mussel (Mytilus galloprovincialis) D-veliger larvae. Constructed for AREE demonstration purposes; does not correspond to a real accession."
species: "Mytilus galloprovincialis"
species_identity:
  basis: collection_site
  notes: "Simulated broodstock described as collected from an Adriatic longline farm; no species-diagnostic markers. Illustrates the Mytilus edulis-complex rule: any basis short of genotyping carries species_assignment_unverified."
strain_or_population: "Adriatic farm broodstock (simulated)"
genome_assembly: "xbMytGall1.hap1.1"
annotation_version: "mytgal_annotation_demo"

assay_type: ["rnaseq"]
analysis_mode: "raw_reanalysis"
platform: "Illumina NovaSeq 6000 (simulated)"

data_availability:
  raw_data_available: true
  processed_data_available: true
  status: "available"
  access_notes: "Synthetic data generated for demo purposes; standardized RNA-seq workflow output supplied directly as demo results."

qc_status: "passed"
analysis_status: "harmonized"

comparisons:
  - comparison_id: "larval_heat_vs_control"
    tissue: "whole_larva"
    life_stage: "larva"
    stressor_original: "Larvae reared at 24C versus 18C from fertilization to D-veliger (48h)"
    stressor_standardized: "temperature"
    exposure_intensity: "24C"
    exposure_duration: "48h"
    exposure_timing: "fertilization to D-veliger"
    control_condition: "18C, matched density and food"
    treatment_condition: "24C, matched density and food"
    phenotype: "larval_viability"
    phenotype_direction: "decrease"
    phenotype_unit: "percent_normal_D_larvae"
    resilience_classification: "resilience"
    contrast_type: "exposure_response"
    sample_size: 18
    biological_replicates: 3
    results_file: "data/demo/rnaseq/MYTGAL_HEAT01_larval_heat_vs_control_dge_demo.tsv"

quality_flags:
  - species_assignment_unverified
limitations: "Simulated dataset; effect sizes and p-values are illustrative. Its gene identifiers are borrowed from the oyster demo crosswalk to test species partitioning and do not denote real mussel genes."

provenance:
  registered_by: "aree_demo_curator"
  date_registered: "2026-10-12"
  curation_notes: "Added in WP4 of docs/mussel_clam_integration_plan.md as the second-species demo and species-partition regression fixture."
  source_links: []
