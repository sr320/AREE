name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python tests + demo pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,intake]"

      - name: Lint (ruff)
        run: ruff check src tests scripts modules/shared

      - name: Run tests
        run: pytest -q

      - name: Validate all demo studies
        run: |
          for sid in $(aree study-ids --simulated); do
            aree validate-study "registry/studies/$sid.yaml"
          done

      # The registry CSV is generated, not committed. Every study YAML on the
      # branch, demo and real, must still validate into it.
      - name: Rebuild the registry index from every study YAML
        run: aree build-registry --strict

      - name: Run full demo pipeline end-to-end
        run: |
          for sid in $(aree study-ids --simulated); do
            aree register-study "registry/studies/$sid.yaml" --update
          done
          for sid in $(aree study-ids --simulated); do
            aree harmonize --study "$sid"
          done
          aree meta-analyze --feature-type gene
          aree build-evidence-cards
          aree build-cross-species-cards --feature-type gene
          aree top-candidates
          test -f reports/evidence/evidence_table.tsv
          test -d reports/evidence_cards
          test -f reports/evidence_cards/cross_species/candidates.tsv
          test -f reports/top_candidates_summary.md

  study-pr-scope:
    name: Study PR stays inside its own files
    # Only study branches (study/<ACCESSION>/<STUDY_ID>, from `aree start-study`).
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'study/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check changed paths, study_id and accession
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: aree check-study-scope --branch "$HEAD_REF" --base "origin/$BASE_REF"

  real-study:
    name: Real-study path (intake -> harmonize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,intake]"

      # The committed derived TSVs must still follow from the committed published
      # artifact. --check regenerates into a temp dir and compares checksums, so a
      # hand-edited result file or a swapped source artifact fails here.
      - name: Verify intake is reproducible from the published source
        run: aree intake-supplementary data/studies/HESSER2024_VCOR/intake.yaml --check

      - name: Validate and register the real study
        run: |
          aree validate-study registry/studies/HESSER2024_VCOR.yaml
          aree register-study registry/studies/HESSER2024_VCOR.yaml --update

      # Runs against the real 33k-gene NCBI/UniProt crosswalk committed to the repo,
      # not the synthetic demo crosswalk. The study's genome assembly selects it
      # (data/reference/genome_assemblies.yaml); no environment variable is needed.
      - name: Harmonize against the real crosswalk
        run: aree harmonize --study HESSER2024_VCOR

      - name: Check the harmonized output
        run: python scripts/check_real_study_evidence.py

      # Intake and harmonization must not leave the working tree dirty.
      - name: Working tree must be clean
        run: |
          git status --porcelain -- data/ registry/studies/
          test -z "$(git status --porcelain -- data/ registry/studies/)"

  nextflow-smoke:
    name: Nextflow workflow smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python runtime
        run: pip install -e .

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::jsonlite
            any::knitr
            any::rmarkdown

      # Not through setup-r-dependencies: pak cannot solve bioc::limma there
      # (limma suggests vsn, which imports limma). Hard dependencies only.
      - name: Install limma
        run: |
          Rscript -e 'install.packages("BiocManager", repos = "https://cloud.r-project.org")' \
                  -e 'BiocManager::install("limma", update = FALSE, ask = FALSE, dependencies = c("Depends", "Imports", "LinkingTo"))' \
                  -e 'stopifnot(requireNamespace("limma", quietly = TRUE)); cat("limma", as.character(packageVersion("limma")), "\n")'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install current Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.0"

      - name: Run every processed-results workflow
        run: |
          nextflow run workflows/rnaseq -profile demo,local \
            --outdir /tmp/aree-smoke/rnaseq \
            -work-dir /tmp/aree-smoke/work-rnaseq
          nextflow run workflows/methylation -profile demo,local \
            --outdir /tmp/aree-smoke/methylation \
            -work-dir /tmp/aree-smoke/work-methylation
          nextflow run workflows/proteomics -profile demo,local \
            --outdir /tmp/aree-smoke/proteomics \
            -work-dir /tmp/aree-smoke/work-proteomics
          nextflow run workflows/metabolomics -profile demo,local \
            --outdir /tmp/aree-smoke/metabolomics \
            -work-dir /tmp/aree-smoke/work-metabolomics

      - name: Exercise the RNA-seq raw DAG with tiny paired FASTQ fixtures
        run: |
          nextflow run workflows/rnaseq -profile local,ci_stub -stub-run \
            --mode raw_reanalysis \
            --study_id CI_RNASEQ \
            --comparison_id treatment_vs_control \
            --reads 'tests/fixtures/rnaseq_raw/*_R{1,2}.fastq' \
            --transcript_fasta tests/fixtures/rnaseq_raw/reference.fa \
            --gtf tests/fixtures/rnaseq_raw/annotation.gtf \
            --tx2gene tests/fixtures/rnaseq_raw/tx2gene.tsv \
            --sample_sheet tests/fixtures/rnaseq_raw/samples.tsv \
            --control_level control \
            --treatment_level treatment \
            --viral_reference data/reference/pathogens/OsHV-1/NC_005881.2.fasta \
            --exclude_samples control2 \
            --exclude_genes data/reference/gene_lists/GCF_963853765.1-RS_2024_06_rRNA.txt \
            --outdir /tmp/aree-smoke/rnaseq-raw \
            -work-dir /tmp/aree-smoke/work-rnaseq-raw

      - name: Exercise the RNA-seq raw DAG with single-end FASTQ fixtures
        run: |
          nextflow run workflows/rnaseq -profile local,ci_stub -stub-run \
            --mode raw_reanalysis \
            --single_end \
            --study_id CI_RNASEQ_SE \
            --comparison_id treatment_vs_control \
            --reads 'tests/fixtures/rnaseq_raw_se/ERR*.fastq' \
            --transcript_fasta tests/fixtures/rnaseq_raw/reference.fa \
            --gtf tests/fixtures/rnaseq_raw/annotation.gtf \
            --tx2gene tests/fixtures/rnaseq_raw/tx2gene.tsv \
            --sample_sheet tests/fixtures/rnaseq_raw_se/samples.tsv \
            --control_level control \
            --treatment_level treatment \
            --viral_reference data/reference/pathogens/OsHV-1/NC_005881.2.fasta \
            --outdir /tmp/aree-smoke/rnaseq-raw-se \
            -work-dir /tmp/aree-smoke/work-rnaseq-raw-se

      - name: Exercise the RNA-seq raw DAG single-end, as 3' Tag-seq
        run: |
          nextflow run workflows/rnaseq -profile local,ci_stub -stub-run \
            --mode raw_reanalysis \
            --single_end --tag_seq \
            --study_id CI_TAGSEQ \
            --comparison_id treatment_vs_control \
            --reads 'tests/fixtures/rnaseq_raw_se/ERR*.fastq' \
            --transcript_fasta tests/fixtures/rnaseq_raw/reference.fa \
            --gtf tests/fixtures/rnaseq_raw/annotation.gtf \
            --tx2gene tests/fixtures/rnaseq_raw/tx2gene.tsv \
            --sample_sheet tests/fixtures/rnaseq_raw_se/samples.tsv \
            --control_level control \
            --treatment_level treatment \
            --outdir /tmp/aree-smoke/rnaseq-tagseq \
            -work-dir /tmp/aree-smoke/work-rnaseq-tagseq
          # One trimmed file per library, none for a second mate.
          test "$(ls /tmp/aree-smoke/rnaseq-raw-se/rnaseq/trimmed/*_trimmed_R1.fastq.gz | wc -l)" -eq 4
          ! ls /tmp/aree-smoke/rnaseq-raw-se/rnaseq/trimmed/*_trimmed_R2.fastq.gz 2>/dev/null

      # A real (not stub) run: normalization, the detection filter, tank
      # units and limma all execute on the simulated targeted-panel fixture.
      - name: Run the metabolomics raw DAG on a targeted-panel fixture
        run: |
          nextflow run workflows/metabolomics -profile local \
            --mode raw_reanalysis \
            --metabolomics.raw_feature_table tests/fixtures/metabolomics_raw/features.tsv \
            --metabolomics.sample_sheet tests/fixtures/metabolomics_raw/samplesheet.tsv \
            --metabolomics.study_id CI_METAB \
            --metabolomics.comparison_id treatment_vs_control \
            --metabolomics.normalization internal_standard \
            --metabolomics.detection_limit 0.001 \
            --metabolomics.replicate_unit tank \
            --metabolomics.acquisition targeted \
            --outdir /tmp/aree-smoke/metabolomics-raw \
            -work-dir /tmp/aree-smoke/work-metabolomics-raw
          python scripts/check_metabolomics_raw_smoke.py /tmp/aree-smoke/metabolomics-raw

      # A real run of the proteomics raw DAG on a spectral-count (NSAF-like)
      # fixture: linear scale, zeros as not detected, the per-arm detection
      # filter, sample-sheet subsetting and limma with lfcSE.
      - name: Run the proteomics raw DAG on a spectral-count fixture
        run: |
          nextflow run workflows/proteomics -profile local \
            --mode raw_reanalysis \
            --proteomics.raw_abundance_matrix tests/fixtures/proteomics_raw/abundance_matrix.tsv \
            --proteomics.sample_sheet tests/fixtures/proteomics_raw/samplesheet.tsv \
            --proteomics.study_id CI_PROT \
            --proteomics.comparison_id treatment_vs_control \
            --proteomics.input_scale linear \
            --proteomics.normalization none \
            --proteomics.quantification spectral_count \
            --outdir /tmp/aree-smoke/proteomics-raw \
            -work-dir /tmp/aree-smoke/work-proteomics-raw
          python scripts/check_proteomics_raw_smoke.py /tmp/aree-smoke/proteomics-raw

      # Two stub runs differing only in comparison params, paired and single
      # end: the second must take FASTQC, fastp, Salmon and viral quant from
      # the -resume cache. Skipped in the Python job, which has no Nextflow.
      - name: A second comparison reuses per-library RNA-seq tasks
        run: |
          pip install pytest
          pytest -q tests/test_rnaseq_resume_across_comparisons.py

      - name: Assert workflow artifacts exist
        run: |
          test -f /tmp/aree-smoke/rnaseq/rnaseq/standardized/GIGAS_HEAT01_acute_heat_vs_control_dge_standardized.tsv
          test -f /tmp/aree-smoke/methylation/methylation/standardized/GIGAS_PATH03_OsHV1_challenge_vs_sham_dmr_standardized.tsv
          test -f /tmp/aree-smoke/proteomics/proteomics/standardize_output/GIGAS_SAL04_low_salinity_vs_control_protein_abundance_standardized.tsv
          test -f /tmp/aree-smoke/metabolomics/metabolomics/standardized/GIGAS_GROW06_hypoxia_vs_control_metabolite_features_standardized.tsv
          test -f /tmp/aree-smoke/rnaseq-raw/rnaseq/standardized/CI_RNASEQ_treatment_vs_control_dge_standardized.tsv
          test -f /tmp/aree-smoke/rnaseq-raw/rnaseq/viral_load/CI_RNASEQ_treatment_vs_control_viral_load.tsv
          test -f /tmp/aree-smoke/rnaseq-raw-se/rnaseq/standardized/CI_RNASEQ_SE_treatment_vs_control_dge_standardized.tsv
          test -f /tmp/aree-smoke/rnaseq-tagseq/rnaseq/standardized/CI_TAGSEQ_treatment_vs_control_dge_standardized.tsv

      # Each manifest's software_versions must match the versions.yml every
      # task of that run wrote, so it cannot fall back to declared pins.
      - name: Manifest software_versions match what ran
        run: |
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/rnaseq/rnaseq/manifests/GIGAS_HEAT01_acute_heat_vs_control_manifest.json \
            /tmp/aree-smoke/work-rnaseq
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/methylation/methylation/manifest/GIGAS_PATH03_OsHV1_challenge_vs_sham_manifest.json \
            /tmp/aree-smoke/work-methylation
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/proteomics/proteomics/manifest/GIGAS_SAL04_low_salinity_vs_control_manifest.json \
            /tmp/aree-smoke/work-proteomics
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/metabolomics/metabolomics/manifest/GIGAS_GROW06_hypoxia_vs_control_manifest.json \
            /tmp/aree-smoke/work-metabolomics
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/rnaseq-raw/rnaseq/manifests/CI_RNASEQ_treatment_vs_control_manifest.json \
            /tmp/aree-smoke/work-rnaseq-raw
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/metabolomics-raw/metabolomics/manifest/CI_METAB_treatment_vs_control_manifest.json \
            /tmp/aree-smoke/work-metabolomics-raw
          python scripts/check_manifest_versions.py \
            /tmp/aree-smoke/proteomics-raw/proteomics/manifest/CI_PROT_treatment_vs_control_manifest.json \
            /tmp/aree-smoke/work-proteomics-raw

  schema-validation:
    name: JSON schema sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check schemas are valid JSON Schema
        run: |
          python -c "import json, jsonschema; [jsonschema.Draft7Validator.check_schema(json.load(open(p))) for p in ['schemas/study.schema.json','schemas/evidence.schema.json']]; print('schemas OK')"

  docs-render:
    name: Render Quarto docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # The dashboard page reads docs/dashboard/data.json. Here it is built from
      # the registry alone (no pipeline outputs), which the builder must handle
      # by reporting them missing; the Pages workflow builds the populated one.
      - name: Build dashboard data from the registry
        run: aree build-dashboard
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render docs site
        run: quarto render docs
      - name: Dashboard home page rendered
        run: test -f docs/_site/index.html && test -f docs/_site/about.html
