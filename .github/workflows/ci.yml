name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python tests + demo pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,intake]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Validate all demo studies
        run: |
          for f in registry/studies/GIGAS_*.yaml; do
            aree validate-study "$f"
          done

      # The registry CSV is generated, not committed. Every study YAML on the
      # branch, demo and real, must still validate into it.
      - name: Rebuild the registry index from every study YAML
        run: aree build-registry --strict

      - name: Run full demo pipeline end-to-end
        run: |
          for f in registry/studies/GIGAS_*.yaml; do
            aree register-study "$f" --update
          done
          for sid in GIGAS_HEAT01 GIGAS_OA02 GIGAS_PATH03 GIGAS_SAL04 GIGAS_LARV05 GIGAS_GROW06; do
            aree harmonize --study "$sid"
          done
          aree meta-analyze --feature-type gene
          aree build-evidence-cards
          aree top-candidates
          test -f reports/evidence/evidence_table.tsv
          test -d reports/evidence_cards
          test -f reports/top_candidates_summary.md

  study-pr-scope:
    name: Study PR stays inside its own files
    # Only study branches (study/<ACCESSION>/<STUDY_ID>, from `aree start-study`).
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'study/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check changed paths, study_id and accession
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: aree check-study-scope --branch "$HEAD_REF" --base "origin/$BASE_REF"

  real-study:
    name: Real-study path (intake -> harmonize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,intake]"

      # The committed derived TSVs must still follow from the committed published
      # artifact. --check regenerates into a temp dir and compares checksums, so a
      # hand-edited result file or a swapped source artifact fails here.
      - name: Verify intake is reproducible from the published source
        run: aree intake-supplementary data/studies/HESSER2024_VCOR/intake.yaml --check

      - name: Validate and register the real study
        run: |
          aree validate-study registry/studies/HESSER2024_VCOR.yaml
          aree register-study registry/studies/HESSER2024_VCOR.yaml --update

      # Runs against the real 33k-gene NCBI/UniProt crosswalk committed to the repo,
      # not the synthetic demo crosswalk.
      - name: Harmonize against the real crosswalk
        env:
          AREE_CROSSWALK: data/reference/crosswalk/mgigas_gene_id_crosswalk.tsv
        run: aree harmonize --study HESSER2024_VCOR

      - name: Check the harmonized output
        run: python scripts/check_real_study_evidence.py

      # Intake and harmonization must not leave the working tree dirty.
      - name: Working tree must be clean
        run: |
          git status --porcelain -- data/ registry/studies/
          test -z "$(git status --porcelain -- data/ registry/studies/)"

  nextflow-smoke:
    name: Nextflow workflow smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python runtime
        run: pip install -e .

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::jsonlite
            any::knitr
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install current Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.0"

      - name: Run every processed-results workflow
        run: |
          nextflow run workflows/rnaseq -profile demo,local \
            --outdir /tmp/aree-smoke/rnaseq \
            -work-dir /tmp/aree-smoke/work-rnaseq
          nextflow run workflows/methylation -profile demo,local \
            --outdir /tmp/aree-smoke/methylation \
            -work-dir /tmp/aree-smoke/work-methylation
          nextflow run workflows/proteomics -profile demo,local \
            --outdir /tmp/aree-smoke/proteomics \
            -work-dir /tmp/aree-smoke/work-proteomics
          nextflow run workflows/metabolomics -profile demo,local \
            --outdir /tmp/aree-smoke/metabolomics \
            -work-dir /tmp/aree-smoke/work-metabolomics

      - name: Exercise the RNA-seq raw DAG with tiny paired FASTQ fixtures
        run: |
          nextflow run workflows/rnaseq -profile local,ci_stub -stub-run \
            --mode raw_reanalysis \
            --study_id CI_RNASEQ \
            --comparison_id treatment_vs_control \
            --reads 'tests/fixtures/rnaseq_raw/*_R{1,2}.fastq' \
            --transcript_fasta tests/fixtures/rnaseq_raw/reference.fa \
            --gtf tests/fixtures/rnaseq_raw/annotation.gtf \
            --tx2gene tests/fixtures/rnaseq_raw/tx2gene.tsv \
            --sample_sheet tests/fixtures/rnaseq_raw/samples.tsv \
            --control_level control \
            --treatment_level treatment \
            --viral_reference data/reference/pathogens/OsHV-1/NC_005881.2.fasta \
            --exclude_samples control2 \
            --outdir /tmp/aree-smoke/rnaseq-raw \
            -work-dir /tmp/aree-smoke/work-rnaseq-raw

      - name: Assert workflow artifacts exist
        run: |
          test -f /tmp/aree-smoke/rnaseq/rnaseq/standardized/GIGAS_HEAT01_acute_heat_vs_control_dge_standardized.tsv
          test -f /tmp/aree-smoke/methylation/methylation/standardized/GIGAS_PATH03_OsHV1_challenge_vs_sham_dmr_standardized.tsv
          test -f /tmp/aree-smoke/proteomics/proteomics/standardize_output/GIGAS_SAL04_low_salinity_vs_control_protein_abundance_standardized.tsv
          test -f /tmp/aree-smoke/metabolomics/metabolomics/standardized/GIGAS_GROW06_hypoxia_vs_control_metabolite_features_standardized.tsv
          test -f /tmp/aree-smoke/rnaseq-raw/rnaseq/standardized/CI_RNASEQ_treatment_vs_control_dge_standardized.tsv
          test -f /tmp/aree-smoke/rnaseq-raw/rnaseq/viral_load/CI_RNASEQ_treatment_vs_control_viral_load.tsv

  schema-validation:
    name: JSON schema sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check schemas are valid JSON Schema
        run: |
          python -c "import json, jsonschema; [jsonschema.Draft7Validator.check_schema(json.load(open(p))) for p in ['schemas/study.schema.json','schemas/evidence.schema.json']]; print('schemas OK')"

  docs-render:
    name: Render Quarto docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # The dashboard page reads docs/dashboard/data.json. Here it is built from
      # the registry alone (no pipeline outputs), which the builder must handle
      # by reporting them missing; the Pages workflow builds the populated one.
      - name: Build dashboard data from the registry
        run: aree build-dashboard
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render docs site
        run: quarto render docs
      - name: Dashboard home page rendered
        run: test -f docs/_site/index.html && test -f docs/_site/about.html
