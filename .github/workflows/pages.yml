name: Deploy dashboard to GitHub Pages

# Builds the documentation site with the progress-and-findings dashboard and
# publishes it at https://sr320.github.io/AREE/.
#
# The dashboard is generated from the pipeline's real outputs, so this workflow
# runs the same steps a curator runs locally: register every real study,
# harmonize each against its species' crosswalk, pool, rank, then
# `aree build-dashboard`. The simulated demo studies (registry/demo_studies/)
# are pipeline fixtures exercised by CI, not findings, so the published site
# leaves them out.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site + dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the dashboard's activity chart reads the full git log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[intake]"

      - name: Register every real study
        run: |
          for f in registry/studies/*.yaml; do
            case "$(basename "$f")" in _*) continue ;; esac
            aree register-study "$f" --update
          done
          aree list-studies

      # Every committed results_file of every real study that has not failed QC,
      # one comparison at a time, read from the registry. A newly merged study
      # appears without editing this file; a qc_status: failed study never does.
      # Each study resolves against the crosswalk registered for its genome
      # assembly, so a study of a new species needs no edit here either.
      - name: Harmonize real studies (each against its own species' crosswalk)
        run: python scripts/harmonize_committed_results.py

      - name: Meta-analyze, rank, and summarize
        run: |
          aree meta-analyze --feature-type gene
          aree build-evidence-cards
          aree build-cross-species-cards --feature-type gene
          aree top-candidates

      - name: Build dashboard data
        run: aree build-dashboard

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
